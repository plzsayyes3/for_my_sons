<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>わんこクラウド</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f6efe3;color:#29251f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#fffaf0;border-bottom:1px solid #ddcfbc}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #332f29;border-radius:13px;background:#fff;color:inherit;text-decoration:none;font-size:26px}h1{font-size:22px;margin:0}
main{width:min(100%,520px);margin:auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 28px)}.panel{background:#fffaf2;border:2px solid #332f29;border-radius:22px;padding:17px;box-shadow:0 5px 0 #332f29;margin-bottom:14px}.status{font-weight:900;font-size:18px}.sub{margin:6px 0 0;color:#766c61;font-size:12px;line-height:1.55;font-weight:700}
label{display:block;margin:12px 2px 5px;font-size:11px;font-weight:900;color:#776d62}input{width:100%;height:48px;border:2px solid #d6c7b3;border-radius:13px;padding:0 12px;font:inherit;background:white;font-size:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}button,.button{min-height:48px;border:2px solid #332f29;border-radius:13px;background:#332f29;color:#fff;font-weight:900;text-decoration:none;display:grid;place-items:center;padding:8px}.secondary{background:#fff;color:#332f29}.sync{background:#f0c747;color:#332f29}.danger{background:#fff;color:#b34a42}.small{font-size:11px;color:#766c61;margin-top:10px;line-height:1.45}.hidden{display:none!important}.msg{margin-top:12px;padding:10px 11px;border-radius:11px;background:#f4ecdf;font-size:12px;font-weight:800;line-height:1.4}.user{word-break:break-all;font-size:12px;color:#62594f;margin-top:5px}
</style>
</head>
<body>
<header><a class="back" href="../wanko-library/">‹</a><h1>わんこクラウド</h1></header>
<main>
<section class="panel" id="not-configured">
  <div class="status">☁️ クラウド準備中</div>
  <p class="sub">Supabaseプロジェクトとの接続設定がまだ入っていません。接続後は、同じ家族アカウントで別のiPadやiPhoneから図鑑を復元できます。</p>
</section>
<section class="panel hidden" id="signed-out">
  <div class="status">☁️ 家族クラウド</div>
  <p class="sub">親のアカウントを1つ作れば十分です。同じアカウントを家族の端末で使います。</p>
  <label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email">
  <label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" minlength="8">
  <div class="actions"><button class="secondary" id="signup">新しく作る</button><button id="signin">ログイン</button></div>
  <div class="msg hidden" id="auth-msg"></div>
</section>
<section class="panel hidden" id="signed-in">
  <div class="status">☁️ オンライン保存 ON</div>
  <div class="user" id="user"></div>
  <p class="sub" id="sync-state">同期状態を確認しています…</p>
  <div class="actions"><button class="sync" id="sync">今すぐ同期</button><a class="button secondary" href="../wanko-library/">図鑑へ</a></div>
  <button class="danger" id="signout" style="width:100%;margin-top:9px">ログアウト</button>
  <div class="msg hidden" id="sync-msg"></div>
</section>
</main>
<script src="../shared/wanko-cloud-config.js"></script>
<script src="../shared/wanko-cloud.js"></script>
<script src="../shared/wanko-library-store.js?v=1"></script>
<script src="../shared/wanko-library.js"></script>
<script>
(async()=>{
 const q=s=>document.querySelector(s), notConfigured=q('#not-configured'), out=q('#signed-out'), inside=q('#signed-in');
 const authMsg=q('#auth-msg'), syncMsg=q('#sync-msg');
 function message(el,text){el.textContent=text;el.classList.toggle('hidden',!text)}
 async function render(){
   const ready=WankoCloud.configured();
   notConfigured.classList.toggle('hidden',ready);
   if(!ready){out.classList.add('hidden');inside.classList.add('hidden');return;}
   const session=await WankoCloud.getSession();
   out.classList.toggle('hidden',!!session);inside.classList.toggle('hidden',!session);
   if(session){
     q('#user').textContent=session.user?.email||'家族アカウント';
     const state=await WankoLibrary.syncState();
     q('#sync-state').textContent=state.pending
       ? 'この端末に未同期のわんこが '+state.pending+' 匹います。'
       : 'この端末のわんこはクラウドと同期されています。';
   }
 }
 q('#signin').onclick=async()=>{message(authMsg,'ログイン中…');try{await WankoCloud.signIn(q('#email').value.trim(),q('#password').value);await WankoLibrary.syncNow();message(authMsg,'');render();}catch(e){message(authMsg,e.message)}};
 q('#signup').onclick=async()=>{message(authMsg,'アカウント作成中…');try{const r=await WankoCloud.signUp(q('#email').value.trim(),q('#password').value);if(r.needsEmailConfirmation){message(authMsg,'確認メールを送信しました。メールの確認後にログインしてください。');}else{await WankoLibrary.syncNow();message(authMsg,'');render();}}catch(e){message(authMsg,e.message)}};
 q('#signout').onclick=async()=>{await WankoCloud.signOut();message(syncMsg,'');render();};
 q('#sync').onclick=async()=>{message(syncMsg,'同期中…');try{const r=await WankoLibrary.syncNow();message(syncMsg,'同期しました。クラウド '+r.pulled+' 件取得 / '+r.synced+' 件送信');await render();}catch(e){message(syncMsg,e.message)}};
 window.addEventListener('wanko-cloud-auth-changed',render);render();
})();
</script>
</body></html>
