<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9ecbd8">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="For My Sons">
  <meta name="description" content="子どもたちのWebアプリへ迷わず入るためのホーム画面">
  <title>For My Sons</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/for-my-sons-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="home-screen" aria-labelledby="home-title">
    <section class="hero-widget" aria-label="For My Sons">
      <p class="eyebrow">FOR MY SONS</p>
      <h1 id="home-title">あそぶ。つくる。まなぶ。</h1>
      <p class="hero-copy">ここから、すきなものをひらこう。</p>
      <div class="profile-bar" aria-label="現在のプロフィール">
        <span id="current-profile-indicator">現在: profile-1</span>
        <button id="parent-settings-button" type="button">おうちの人設定</button>
      </div>
    </section>

    <section class="recent-wanko" id="recent-wanko" hidden aria-label="さいきんのわんこ">
      <div class="recent-wanko-copy">
        <p class="eyebrow">MY WANKO</p>
        <strong id="recent-wanko-name">さいきんのわんこ</strong>
        <span>タップでバトルへ</span>
      </div>
      <a class="recent-wanko-link" href="./wanko-war/?v=12" aria-label="さいきんのわんこでバトル">
        <img id="recent-wanko-image" alt="">
      </a>
    </section>

    <section class="apps-section" aria-label="アプリ">
      <div id="app-grid" class="app-grid" aria-live="polite"></div>
    </section>

    <div class="page-indicator" aria-hidden="true">
      <span class="page-dot is-active"></span>
    </div>
  </main>

  <aside id="parent-settings-panel" class="parent-settings-panel" hidden></aside>

  <template id="app-template">
    <a class="app-tile" rel="noopener noreferrer">
      <span class="app-icon-wrap">
        <img class="app-icon" alt="" width="72" height="72">
      </span>
      <span class="app-name"></span>
    </a>
  </template>

  <link rel="stylesheet" href="./shared/for-my-sons.css?v=1">
  <script src="./shared/for-my-sons-db.js?v=1"></script>
  <script src="./shared/profile-manager.js?v=1"></script>
  <script src="./shared/parent-lock.js?v=1"></script>
  <script src="./shared/save-store.js?v=1"></script>
  <script src="./shared/github-sync.js?v=1"></script>
  <script src="./shared/for-my-sons.js?v=1"></script>
  <script src="./shared/settings-view.js?v=1"></script>
  <script src="./shared/wanko-cloud-config.js"></script>
  <script src="./shared/wanko-cloud.js"></script>
  <script src="./shared/wanko-library.js"></script>
  <script src="./app.js?v=2" defer></script>
</body>
</html>
