name: Import Ghost Typing Monsters

on:
  push:
    paths:
      - '.github/workflows/import-ghost-monsters.yml'
      - '.github/scripts/import_ghost_monsters.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout For My Sons
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0

      - name: Download original monster ZIP and create three game sprites
        run: python .github/scripts/import_ghost_monsters.py

      - name: Commit optimized sprites and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ghost-typing/assets/monster-weak.png ghost-typing/assets/monster-medium.png ghost-typing/assets/monster-strong.png ghost-typing/assets/ATTRIBUTION.md
          if ! git diff --cached --quiet; then
            git commit -m "Import credited CraftPix monster sprites for ghost typing"
            git push origin HEAD:main
          else
            echo "Monster sprites already up to date."
          fi
