<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<title>たしざんチャレンジ</title>
<style>
:root{--ink:#29251f;--line:#332f29;--paper:#f7f0e4;--gold:#ffe27a;--card:#fffaf2;--muted:#74695c;--good:#dff1cf;--bad:#ffe0d9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#fff9ef,#f3eadc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;user-select:none}
button,a{font:inherit;color:inherit}
body{min-height:100svh}
header{display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top) + 9px) 11px 9px;background:rgba(255,250,242,.94);border-bottom:2px solid rgba(51,47,41,.18)}
.back{width:40px;height:40px;display:grid;place-items:center;text-decoration:none;border:2px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:22px;font-weight:1000}
header h1{margin:0;font-size:19px;white-space:nowrap}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:4px;min-width:62px;justify-content:center;padding:6px 8px;border:1.5px solid var(--line);border-radius:999px;background:#fff7cf;font-size:11px;font-weight:1000}
.player{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff}
main{width:min(100%,640px);margin:auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 28px)}
.panel{border:3px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 6px 0 var(--line);padding:17px}
.panel[hidden]{display:none}
.hero{text-align:center;padding:8px 4px 5px}
.heroIcon{font-size:64px;line-height:1}.hero h2{margin:7px 0 5px;font-size:29px}.hero p{margin:0;color:var(--muted);font-size:12px;font-weight:800;line-height:1.55}
.rules{margin:15px 0 0;display:grid;gap:7px}
.rule{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;padding:8px 10px;border:1.5px solid #d8cbbb;border-radius:13px;background:#fff;font-size:11px}
.rule b{font-size:12px}.rule span{color:#665d53;font-weight:800}
.startButton,.againButton,.gachaButton{width:100%;min-height:50px;border:2.5px solid var(--line);border-radius:15px;font-weight:1000;box-shadow:0 4px 0 var(--line)}
.startButton,.againButton{margin-top:15px;background:var(--gold);font-size:17px}
.gachaButton{display:grid;place-items:center;margin-top:9px;background:#fff;text-decoration:none;font-size:14px}
.startButton:active,.againButton:active,.gachaButton:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.topline{display:flex;align-items:center;gap:9px;margin-bottom:13px}.progress{flex:1;height:12px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}.progressFill{height:100%;width:0;background:var(--gold);transition:width .2s}.counter{font-size:12px;font-weight:1000;min-width:45px;text-align:right}
.scoreRow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;font-weight:900;color:var(--muted)}.scoreRow strong{font-size:17px;color:var(--ink)}
.levelBadge{display:inline-flex;padding:5px 9px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:11px;font-weight:1000}
.question{text-align:center;padding:12px 0 7px}.equation{font-size:clamp(42px,13vw,68px);font-weight:1000;letter-spacing:.02em;font-variant-numeric:tabular-nums}.possible{margin-top:6px;font-size:12px;font-weight:900;color:#7a6850;min-height:18px}
.answerDisplay{margin:10px auto 8px;width:min(100%,330px);min-height:66px;display:grid;place-items:center;border:3px solid var(--line);border-radius:18px;background:#fff;font-size:34px;font-weight:1000;font-variant-numeric:tabular-nums}.answerDisplay.empty{color:#c6b8a7}
.feedback{min-height:28px;text-align:center;font-size:13px;font-weight:1000;padding:4px}.feedback.good{color:#365d28}.feedback.bad{color:#9a3e31}
.keypad{width:min(100%,360px);margin:7px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{min-height:54px;border:2px solid var(--line);border-radius:15px;background:#fff;font-size:23px;font-weight:1000;box-shadow:0 3px 0 var(--line)}.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}.key.action{font-size:14px;background:#eee6da}.key.submit{background:var(--gold);font-size:16px}
.result{text-align:center}.resultIcon{font-size:72px}.result h2{margin:5px 0 2px;font-size:28px}.earned{font-size:40px;font-weight:1000;margin:8px 0}.result p{margin:5px 0;color:var(--muted);font-size:12px;font-weight:800;line-height:1.5}.breakdown{margin:14px 0 0;display:grid;gap:6px;text-align:left}.breakRow{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:11px;background:#fff;border:1px solid #ddd0bf;font-size:11px;font-weight:900}
@media(max-width:420px){header h1{font-size:17px}.player{display:none}.panel{padding:14px}.rule{grid-template-columns:76px 1fr}.equation{font-size:43px}.key{min-height:50px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../../wanko/?v=4" aria-label="わんこトップへ">‹</a>
  <h1>たしざんチャレンジ</h1>
  <div class="spacer"></div>
  <span class="pill player" id="playerBadge">読込中</span>
  <span class="pill">🐾 <b id="walletPoints">0</b></span>
</header>
<main>
  <section class="panel" id="introPanel">
    <div class="hero">
      <div class="heroIcon">➕🐶</div>
      <h2>たしざん 10もん</h2>
      <p>5しゅるいを2もんずつ。まちがえても、なおして最後まで進めます。</p>
    </div>
    <div class="rules" aria-label="点数ルール">
      <div class="rule"><b>1桁 + 1桁</b><span>ミスなし 1pt ／ ミスしたら 0pt</span></div>
      <div class="rule"><b>2桁 + 1桁</b><span>なおして正解すれば 1pt</span></div>
      <div class="rule"><b>2桁 + 2桁</b><span>ミスなし 2pt ／ ミスあり 1pt</span></div>
      <div class="rule"><b>3桁 + 1桁</b><span>ミスなし 3pt ／ ミスあり 1pt</span></div>
      <div class="rule"><b>3桁 + 3桁</b><span>5pt → ミスごとに1pt減る（最低1pt）</span></div>
    </div>
    <button class="startButton" id="startButton" type="button">10もん スタート</button>
  </section>

  <section class="panel" id="gamePanel" hidden>
    <div class="topline">
      <div class="progress" aria-label="進み具合"><div class="progressFill" id="progressFill"></div></div>
      <div class="counter" id="counter">1 / 10</div>
    </div>
    <div class="scoreRow"><span class="levelBadge" id="levelBadge">1桁 + 1桁</span><span>いま <strong id="score">0pt</strong></span></div>
    <div class="question">
      <div class="equation" id="equation">3 + 4 = ?</div>
      <div class="possible" id="possible">この問題：1pt</div>
    </div>
    <div class="answerDisplay empty" id="answerDisplay" aria-live="polite">こたえ</div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="keypad" id="keypad" aria-label="数字キーボード">
      <button class="key" type="button" data-digit="1">1</button>
      <button class="key" type="button" data-digit="2">2</button>
      <button class="key" type="button" data-digit="3">3</button>
      <button class="key" type="button" data-digit="4">4</button>
      <button class="key" type="button" data-digit="5">5</button>
      <button class="key" type="button" data-digit="6">6</button>
      <button class="key" type="button" data-digit="7">7</button>
      <button class="key" type="button" data-digit="8">8</button>
      <button class="key" type="button" data-digit="9">9</button>
      <button class="key action" type="button" id="backspaceButton" aria-label="1文字消す">⌫</button>
      <button class="key" type="button" data-digit="0">0</button>
      <button class="key submit" type="button" id="submitButton">こたえる</button>
    </div>
  </section>

  <section class="panel result" id="resultPanel" hidden>
    <div class="resultIcon">🐶🎉</div>
    <h2>1しゅう クリア！</h2>
    <div class="earned" id="earnedPoints">+0pt</div>
    <p id="saveStatus">わんこポイントに追加しています…</p>
    <div class="breakdown" id="breakdown"></div>
    <button class="againButton" id="againButton" type="button">もう1しゅう</button>
    <a class="gachaButton" href="../../wanko-gacha/?v=3">ガチャを見にいく</a>
  </section>
</main>

<script src="../../shared/for-my-sons-db.js?v=2"></script>
<script src="../../shared/profile-manager.js?v=2"></script>
<script src="../../shared/parent-lock.js?v=3"></script>
<script src="../../shared/save-store.js?v=2"></script>
<script src="../../shared/github-sync.js?v=8"></script>
<script src="../../shared/character-requests.js?v=1"></script>
<script src="../../shared/for-my-sons.js?v=9"></script>
<script src="../../shared/wanko-library.js"></script>
<script src="../../shared/wanko-game-data.js?v=2"></script>
<script src="../../shared/wanko-game-progress.js?v=6"></script>
<script src="../../shared/wanko-profile-sync.js?v=1"></script>
<script src="../../shared/wanko-mini-addition.js?v=1"></script>
<script>
(() => {
  const introPanel=document.getElementById('introPanel');
  const gamePanel=document.getElementById('gamePanel');
  const resultPanel=document.getElementById('resultPanel');
  const startButton=document.getElementById('startButton');
  const againButton=document.getElementById('againButton');
  const playerBadge=document.getElementById('playerBadge');
  const walletPoints=document.getElementById('walletPoints');
  const progressFill=document.getElementById('progressFill');
  const counter=document.getElementById('counter');
  const levelBadge=document.getElementById('levelBadge');
  const scoreEl=document.getElementById('score');
  const equation=document.getElementById('equation');
  const possible=document.getElementById('possible');
  const answerDisplay=document.getElementById('answerDisplay');
  const feedback=document.getElementById('feedback');
  const submitButton=document.getElementById('submitButton');
  const backspaceButton=document.getElementById('backspaceButton');
  const keypad=document.getElementById('keypad');
  const earnedPoints=document.getElementById('earnedPoints');
  const saveStatus=document.getElementById('saveStatus');
  const breakdown=document.getElementById('breakdown');

  let Progress=window.WankoGameProgress;
  let progressSync=null,progressState=null,sharedApi=null,sessionProfile=null;
  let round=[],index=0,answerText='',mistakes=0,totalScore=0,results=[],locked=false,roundFinished=false;

  function getEconomyDeviceId(){
    const key='wankoEconomyDeviceId';
    let id=localStorage.getItem(key);
    if(!id){
      const bytes=new Uint8Array(12);
      crypto.getRandomValues(bytes);
      id='d-'+[...bytes].map(value=>value.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(key,id);
    }
    return id;
  }
  const economyDeviceId=getEconomyDeviceId();

  function queueProgressSync(){
    if(progressSync&&progressState)progressSync.schedule(progressState);
  }

  async function setupProfile(){
    try{
      if(!window.ForMySonsShared?.createForMySons)throw new Error('shared api unavailable');
      sharedApi=await window.ForMySonsShared.createForMySons();
      sessionProfile=await sharedApi.profile.current();
      const label=sessionProfile?.label&&sessionProfile.label!=='profile-1'?sessionProfile.label:'未設定';
      playerBadge.textContent=label;
      const scopedProgress=window.WankoGameProgress.createProfileStore(sessionProfile.id,sharedApi.save,window.WankoGameData);
      const scopedSync=window.WankoProfileSync.createWankoProfileSync({
        api:sharedApi,
        profileId:sessionProfile.id,
        definitions:window.WankoGameData,
        progressStore:scopedProgress,
        legacyStorage:window.WankoLibrary,
        confirmLegacy:async()=>false,
        onStatus:status=>{playerBadge.dataset.sync=status.state==='local-only'?'local':'cloud'}
      });
      const initialized=await scopedSync.initialize();
      Progress=scopedProgress;
      progressSync=scopedSync;
      progressState=initialized.state;
    }catch(error){
      console.warn('Addition profile setup failed; using local progress.',error);
      progressState=await Progress.getState();
      playerBadge.textContent='端末保存';
    }
    updateWallet();
  }

  function updateWallet(){
    const wallet=window.WankoGameProgress.walletFromState(progressState||{});
    walletPoints.textContent=wallet.points;
  }

  function scoreForCurrent(){
    return window.WankoMiniAddition.scoreQuestion(round[index].levelId,mistakes);
  }

  function currentScoreText(){
    const question=round[index];
    const now=scoreForCurrent();
    if(mistakes===0)return 'ミスなしで '+question.maxPoints+'pt';
    if(now===0)return 'この問題は 0pt。なおして次へ！';
    return 'いま正解すると '+now+'pt';
  }

  function renderQuestion(){
    const question=round[index];
    counter.textContent=(index+1)+' / '+round.length;
    progressFill.style.width=(index/round.length*100)+'%';
    levelBadge.textContent=question.label;
    scoreEl.textContent=totalScore+'pt';
    equation.textContent=question.a+' + '+question.b+' = ?';
    possible.textContent=currentScoreText();
    answerText='';
    mistakes=0;
    renderAnswer();
    feedback.textContent='';
    feedback.className='feedback';
    locked=false;
  }

  function renderAnswer(){
    answerDisplay.textContent=answerText||'こたえ';
    answerDisplay.classList.toggle('empty',!answerText);
  }

  function startRound(){
    round=window.WankoMiniAddition.createRound();
    index=0;answerText='';mistakes=0;totalScore=0;results=[];locked=false;roundFinished=false;
    introPanel.hidden=true;
    resultPanel.hidden=true;
    gamePanel.hidden=false;
    renderQuestion();
  }

  function addDigit(digit){
    if(locked||answerText.length>=4)return;
    if(answerText==='0')answerText='';
    answerText+=digit;
    renderAnswer();
  }

  async function finishRound(){
    if(roundFinished)return;
    roundFinished=true;
    locked=true;
    progressFill.style.width='100%';
    gamePanel.hidden=true;
    resultPanel.hidden=false;
    earnedPoints.textContent='+'+totalScore+'pt';
    breakdown.replaceChildren();
    for(const item of results){
      const row=document.createElement('div');row.className='breakRow';
      const left=document.createElement('span');left.textContent=item.label+'　'+item.a+' + '+item.b;
      const right=document.createElement('span');right.textContent=item.points+'pt'+(item.mistakes?'（ミス '+item.mistakes+'）':'');
      row.append(left,right);breakdown.appendChild(row);
    }
    try{
      if(totalScore>0){
        progressState=await Progress.awardPoints(totalScore,economyDeviceId);
        queueProgressSync();
        if(progressSync)await progressSync.flush();
      }
      updateWallet();
      saveStatus.textContent='🐾 わんこポイントに '+totalScore+'pt 追加しました。';
    }catch(error){
      console.warn('Addition point save failed',error);
      saveStatus.textContent='ポイントの保存に失敗しました。もう一度この画面を開いて確認してください。';
    }
  }

  function submitAnswer(){
    if(locked||!answerText)return;
    const question=round[index];
    const value=Number(answerText);
    if(value!==question.answer){
      mistakes++;
      answerText='';
      renderAnswer();
      possible.textContent=currentScoreText();
      feedback.textContent='ちがうよ。もういちど！';
      feedback.className='feedback bad';
      try{navigator.vibrate?.(25)}catch{}
      return;
    }
    locked=true;
    const points=window.WankoMiniAddition.scoreQuestion(question.levelId,mistakes);
    totalScore+=points;
    results.push({...question,mistakes,points});
    scoreEl.textContent=totalScore+'pt';
    feedback.textContent='せいかい！ +'+points+'pt';
    feedback.className='feedback good';
    try{navigator.vibrate?.([18,20,35])}catch{}
    setTimeout(()=>{
      index++;
      if(index>=round.length){void finishRound();return}
      renderQuestion();
    },520);
  }

  keypad.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.digit!==undefined)addDigit(button.dataset.digit);
  });
  backspaceButton.addEventListener('click',()=>{if(!locked){answerText=answerText.slice(0,-1);renderAnswer()}});
  submitButton.addEventListener('click',submitAnswer);
  startButton.addEventListener('click',startRound);
  againButton.addEventListener('click',startRound);
  window.addEventListener('pagehide',()=>{if(progressSync)void progressSync.flush()});
  document.addEventListener('gesturestart',event=>event.preventDefault(),{passive:false});

  setupProfile().catch(error=>{
    console.error(error);
    playerBadge.textContent='端末保存';
    startButton.disabled=false;
  });
})();
</script>
</body>
</html>
