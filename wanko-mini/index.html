<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<title>わんこミニゲーム</title>
<style>
:root{--ink:#29251f;--line:#332f29;--paper:#f7f0e4;--gold:#ffe27a;--green:#e7f2d7;--blue:#e5eef8;--orange:#f8ead3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#fff9ef,#f3eadc);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;user-select:none}
body{min-height:100svh}
a,button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 12px 9px}
.back{width:40px;height:40px;display:grid;place-items:center;text-decoration:none;border:2px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 3px 0 var(--line);font-size:22px;font-weight:1000}
header h1{margin:0;font-size:20px}.spacer{flex:1}.pill{padding:6px 9px;border:1.5px solid var(--line);border-radius:999px;background:#fff7cf;font-size:11px;font-weight:1000}
main{width:min(100%,680px);margin:auto;padding:8px 14px calc(env(safe-area-inset-bottom) + 28px)}
.hero{padding:16px 10px;text-align:center}.heroIcon{font-size:62px}.hero h2{margin:7px 0 5px;font-size:29px}.hero p{margin:0;font-size:12px;font-weight:800;color:#74695c;line-height:1.55}
.games{display:grid;gap:13px;margin-top:10px}
.game{display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:102px;padding:14px;border:3px solid var(--line);border-radius:22px;text-decoration:none;box-shadow:0 5px 0 var(--line)}
.game.add{background:var(--green)}.game.sub{background:var(--blue)}.game.mul{background:var(--orange)}
.game:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.icon{font-size:44px;text-align:center}.name{font-size:21px;font-weight:1000}.desc{margin-top:4px;font-size:11px;font-weight:800;color:#675e54;line-height:1.45}.arrow{font-size:26px;font-weight:1000}
.sizeLine{margin-top:7px;display:flex;align-items:flex-end;gap:4px;height:28px}.sizeLine span{line-height:1}.ant{font-size:12px}.mouse{font-size:15px}.dog{font-size:18px}.elephant{font-size:22px}.whale{font-size:27px}
.note{margin-top:15px;padding:11px 13px;border:1.5px solid #d8cbbb;border-radius:14px;background:#fff;font-size:11px;font-weight:800;color:#6c6257;text-align:center}
@media(min-width:600px){.games{grid-template-columns:1fr 1fr}.game{grid-template-columns:58px minmax(0,1fr) auto}}
</style>
</head>
<body>
<header>
  <a class="back" href="../wanko/?v=7" aria-label="わんこトップへ">‹</a>
  <h1>ミニゲーム</h1>
  <div class="spacer"></div>
  <span class="pill">🐾 <b id="points">0</b></span>
</header>
<main>
  <section class="hero">
    <div class="heroIcon">🎮🐶</div>
    <h2>どれであそぶ？</h2>
    <p>からだが大きいどうぶつほど難しいコース。もらったポイントはガチャ券に交換できます。</p>
  </section>
  <section class="games">
    <a class="game add" href="./addition/?v=3">
      <div class="icon">➕</div>
      <div>
        <div class="name">たしざん</div>
        <div class="desc">蟻からシロナガスクジラまで、5つの難易度</div>
        <div class="sizeLine" aria-hidden="true"><span class="ant">🐜</span><span class="mouse">🐭</span><span class="dog">🐕</span><span class="elephant">🐘</span><span class="whale">🐋</span></div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="game sub" href="./subtraction/?v=1">
      <div class="icon">➖</div>
      <div>
        <div class="name">ひきざん</div>
        <div class="desc">答えがマイナスにならない問題で、同じ5コース</div>
        <div class="sizeLine" aria-hidden="true"><span class="ant">🐜</span><span class="mouse">🐭</span><span class="dog">🐕</span><span class="elephant">🐘</span><span class="whale">🐋</span></div>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="game mul" href="./multiplication/?v=1">
      <div class="icon">✖️</div>
      <div>
        <div class="name">かけざん</div>
        <div class="desc">99問チャレンジ。連続正解で1問あたりのポイントが上がる</div>
        <div class="sizeLine" aria-hidden="true"><span class="ant">1</span><span class="mouse">×</span><span class="dog">9</span><span class="elephant">🔥</span><span class="whale">99</span></div>
      </div>
      <div class="arrow">›</div>
    </a>
  </section>
  <div class="note">🐾20ポイントで 🎫ガチャ券1枚</div>
</main>
<script src="../shared/for-my-sons-db.js?v=2"></script>
<script src="../shared/profile-manager.js?v=2"></script>
<script src="../shared/parent-lock.js?v=3"></script>
<script src="../shared/save-store.js?v=2"></script>
<script src="../shared/github-sync.js?v=8"></script>
<script src="../shared/character-requests.js?v=1"></script>
<script src="../shared/for-my-sons.js?v=9"></script>
<script src="../shared/wanko-library.js"></script>
<script src="../shared/wanko-game-data.js?v=2"></script>
<script src="../shared/wanko-game-progress.js?v=6"></script>
<script src="../shared/wanko-profile-sync.js?v=1"></script>
<script>
(async()=>{
  const points=document.getElementById('points');
  try{
    const api=await window.ForMySonsShared.createForMySons();
    const profile=await api.profile.current();
    const progress=window.WankoGameProgress.createProfileStore(profile.id,api.save,window.WankoGameData);
    let state=await progress.getState();
    if(window.WankoProfileSync?.createWankoProfileSync){
      const sync=window.WankoProfileSync.createWankoProfileSync({
        api,profileId:profile.id,definitions:window.WankoGameData,progressStore:progress,
        legacyStorage:window.WankoLibrary,confirmLegacy:async()=>false
      });
      state=(await sync.initialize()).state;
    }
    points.textContent=window.WankoGameProgress.walletFromState(state).points;
  }catch(error){
    console.warn('Mini game wallet load failed',error);
    points.textContent='-';
  }
})();
</script>
</body>
</html>
