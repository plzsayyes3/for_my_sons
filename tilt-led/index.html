<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110f">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest?v=4">
  <title>ひかりリング | For My Sons</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #07110f; }
    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #eefbf6;
      background:
        radial-gradient(circle at 50% 42%, rgba(42,255,184,.07), transparent 36%),
        linear-gradient(180deg, #0a1714 0%, #050a09 100%);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: .62; }
    .app {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding:
        calc(env(safe-area-inset-top) + 10px)
        14px
        calc(env(safe-area-inset-bottom) + 14px);
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      flex: 0 0 auto;
    }
    .back, .mini-button {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(198,255,235,.13);
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: rgba(12,31,26,.72);
      color: #eafff7;
      text-decoration: none;
      font: inherit;
      font-size: 24px;
      font-weight: 800;
      box-shadow: inset 0 1px rgba(255,255,255,.06);
      touch-action: manipulation;
    }
    .mini-button {
      width: auto;
      min-width: 44px;
      padding: 0 12px;
      font-size: 17px;
    }
    .title { min-width: 0; flex: 1; }
    .eyebrow {
      margin: 0 0 2px;
      color: #73d9b6;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 38px;
      flex: 0 0 auto;
      color: rgba(229,255,247,.78);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .03em;
    }
    .hud-pill {
      min-width: 90px;
      padding: 8px 11px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .hit-count { color: #ff9b9b; }
    .time-count { color: #99c8ff; }
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 4px 0 8px;
    }
    .ring-shell {
      position: relative;
      width: min(92vw, 88svh, 640px);
      aspect-ratio: 1;
      border-radius: 50%;
      touch-action: none;
    }
    .ring-face {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 1px solid rgba(140,255,218,.08);
      background:
        radial-gradient(circle at 50% 44%, rgba(38,103,82,.10), rgba(0,0,0,.22) 63%, rgba(0,0,0,.50) 100%);
      box-shadow: inset 0 0 35px rgba(0,0,0,.8), 0 0 70px rgba(0,0,0,.42);
    }
    .ring-guide {
      position: absolute;
      inset: 15%;
      border: 1px solid rgba(145,255,218,.06);
      border-radius: 50%;
    }
    .led {
      --a: 0deg;
      --b: .04;
      --s: 1;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border-radius: 50%;
      transform:
        rotate(var(--a))
        translateY(calc(min(46vw, 44svh, 320px) * -1))
        scale(var(--s));
      background: rgb(38 68 59);
      opacity: calc(.34 + var(--b) * .66);
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.06),
        0 0 calc(var(--b) * 20px) rgba(67,255,190,calc(var(--b) * .42));
      transition: background 70ms linear, opacity 70ms linear, box-shadow 70ms linear, transform 70ms linear;
      will-change: transform, opacity, box-shadow;
    }
    .led.is-player {
      background: rgb(91 171 255);
      opacity: 1;
      box-shadow:
        0 0 14px rgba(75,161,255,.95),
        0 0 38px rgba(75,161,255,.72);
    }
    .led.is-player-near {
      background: rgb(91 171 255);
      opacity: 1;
      box-shadow:
        0 0 7px rgba(75,161,255,.82),
        0 0 17px rgba(75,161,255,.46);
    }
    .led.is-enemy {
      background: rgb(255 72 72);
      opacity: 1;
      box-shadow:
        0 0 14px rgba(255,67,67,.96),
        0 0 40px rgba(255,67,67,.78);
    }
    .led.is-enemy-near {
      background: rgb(38 68 59);
      opacity: .34;
      box-shadow: none;
    }
    .ring-shell.is-hit .led.is-player {
      background: #fff;
      box-shadow: 0 0 14px #fff, 0 0 32px rgba(255,255,255,.8);
    }
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 27%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(115,255,207,.10);
      background: rgba(9,23,19,.78);
      display: grid;
      place-items: center;
      text-align: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,.72);
      pointer-events: none;
    }
    .time-counter {
      display: grid;
      place-items: center;
      align-content: center;
      width: 100%;
      height: 100%;
      gap: 2px;
    }
    .time-number {
      color: #8bc8ff;
      font-size: clamp(24px, 4.8cqh, 42px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -.045em;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 10px rgba(91,171,255,.65),
        0 0 28px rgba(91,171,255,.35);
    }
    .time-number.is-final {
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(255,255,255,.62),
        0 0 30px rgba(91,171,255,.42);
    }
    .time-unit {
      color: rgba(181,218,255,.58);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .16em;
    }
    .life-count {
      color: #8bc8ff;
      font-size: 15px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }
    .life-count.is-danger { color: #ff8585; }
    .controls {
      flex: 0 0 auto;
      display: grid;
      gap: 8px;
      width: min(100%, 440px);
      margin: 0 auto;
    }
    .start {
      min-height: 54px;
      border: 0;
      border-radius: 18px;
      background: #63f2be;
      color: #062119;
      font: inherit;
      font-size: 16px;
      font-weight: 950;
      letter-spacing: .02em;
      box-shadow: 0 8px 26px rgba(56,255,184,.14);
      touch-action: manipulation;
    }
    .status {
      margin: 0;
      min-height: 34px;
      display: grid;
      place-items: center;
      color: rgba(224,255,244,.65);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      line-height: 1.35;
    }
    .hint {
      margin: 0;
      color: rgba(200,241,226,.39);
      font-size: 10px;
      text-align: center;
    }
    .speed-control {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid rgba(198,255,235,.10);
      border-radius: 16px;
      background: rgba(12,31,26,.52);
    }
    .speed-label {
      color: rgba(224,255,244,.76);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .speed-value {
      min-width: 2.5em;
      color: #b8ffe5;
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .speed-slider {
      width: 100%;
      min-width: 0;
      accent-color: #63f2be;
      touch-action: pan-x;
    }
    [hidden] { display: none !important; }
    .new-record-badge {
      margin-top: 2px;
      padding: 3px 7px;
      border: 1px solid rgba(255,230,105,.45);
      border-radius: 999px;
      background: rgba(255,214,62,.12);
      color: #ffe56b;
      font-size: 7px;
      font-weight: 950;
      letter-spacing: .12em;
      white-space: nowrap;
    }
    .records-modal {
      position: fixed;
      inset: 0;
      z-index: 24;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .records-modal.is-open { display: flex; }
    .records-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.64);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .records-card {
      position: relative;
      z-index: 1;
      width: min(100%, 430px);
      max-height: min(88cqh, 430px);
      overflow: auto;
      padding: 17px;
      border: 1px solid rgba(198,255,235,.14);
      border-radius: 22px;
      background: #0b1815;
      box-shadow: 0 18px 70px rgba(0,0,0,.46);
    }
    .records-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }
    .records-head h2 { margin: 0; font-size: 20px; }
    .records-close {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(198,255,235,.12);
      border-radius: 13px;
      background: rgba(255,255,255,.04);
      color: #eafff7;
      font: inherit;
      font-size: 17px;
      font-weight: 900;
    }
    .personal-record {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 2px 12px;
      padding: 12px 14px;
      border: 1px solid rgba(139,200,255,.18);
      border-radius: 17px;
      background: rgba(91,171,255,.07);
    }
    .personal-record span {
      color: rgba(215,238,255,.65);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .15em;
    }
    .personal-record strong {
      grid-row: 1 / 3;
      grid-column: 2;
      color: #9bd0ff;
      font-size: 28px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .personal-record small {
      color: #e8f6ff;
      font-size: 12px;
      font-weight: 850;
    }
    .family-record-title {
      margin: 13px 3px 7px;
      color: rgba(224,255,244,.52);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .15em;
    }
    .family-record-list {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .family-record-list li {
      display: grid;
      grid-template-columns: 26px minmax(0,1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
    }
    .family-record-list li.is-me {
      border-color: rgba(91,171,255,.25);
      background: rgba(91,171,255,.075);
    }
    .record-rank {
      color: rgba(255,229,107,.8);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }
    .record-name {
      min-width: 0;
      overflow: hidden;
      color: #eafff7;
      font-size: 12px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .record-name em {
      margin-left: 5px;
      color: #8bc8ff;
      font-size: 8px;
      font-style: normal;
      letter-spacing: .08em;
    }
    .record-score {
      color: #b9ddff;
      font-size: 14px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }
    .family-record-list .record-empty {
      display: block;
      min-height: 0;
      color: rgba(224,255,244,.5);
      font-size: 11px;
      text-align: center;
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px);
    }
    .settings-modal.is-open { display: flex; }
    .settings-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .settings-card {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      padding: 18px;
      border: 1px solid rgba(198,255,235,.12);
      border-radius: 24px;
      background: #0b1815;
      box-shadow: 0 18px 70px rgba(0,0,0,.42);
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .settings-head h2 { margin: 0; font-size: 20px; }
    .settings-close {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(198,255,235,.12);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      color: #eafff7;
      font: inherit;
      font-size: 18px;
      font-weight: 900;
    }
    .settings-action {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 1px solid rgba(198,255,235,.12);
      border-radius: 15px;
      background: rgba(255,255,255,.05);
      color: #d9fff1;
      font: inherit;
      font-size: 14px;
      font-weight: 850;
    }
    @media (orientation: landscape) and (max-height: 540px) {
      .app {
        padding-left: calc(env(safe-area-inset-left) + 12px);
        padding-right: calc(env(safe-area-inset-right) + 12px);
      }
      .hud { position: absolute; left: 74px; top: calc(env(safe-area-inset-top) + 8px); }
      .stage { padding: 0; }
      .ring-shell { width: min(calc(100svh - 74px), 640px); }
      .led {
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        transform:
          rotate(var(--a))
          translateY(calc((min(calc(50svh - 37px), 320px) - 25px) * -1))
          scale(var(--s));
      }
      .controls {
        position: absolute;
        right: calc(env(safe-area-inset-right) + 16px);
        bottom: calc(env(safe-area-inset-bottom) + 14px);
        width: min(34vw, 280px);
      }
      .hint { display: none; }
    }
    .landscape-stage {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      container-type: size;
      transform-origin: 50% 50%;
      background:
        radial-gradient(circle at 50% 42%, rgba(42,255,184,.07), transparent 36%),
        linear-gradient(180deg, #0a1714 0%, #050a09 100%);
    }
    .landscape-stage .app {
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 8px 14px 10px;
    }
    .landscape-stage .topbar {
      position: relative;
      z-index: 6;
    }
    .landscape-stage .stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      padding: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .landscape-stage .ring-shell {
      pointer-events: auto;
    }
    .landscape-stage .ring-shell {
      width: min(calc(100cqh - 74px), 72cqw, 660px);
    }
    .landscape-stage .led {
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      transform:
        rotate(var(--a))
        translateY(calc((min(calc(50cqh - 37px), 36cqw, 330px) - 25px) * -1))
        scale(var(--s));
    }
    .landscape-stage .hud {
      position: absolute;
      left: 70px;
      top: 9px;
      z-index: 6;
      min-height: 34px;
    }
    .landscape-stage .controls {
      position: absolute;
      z-index: 6;
      right: 16px;
      bottom: 10px;
      width: min(34cqw, 280px);
    }
    .landscape-stage .hint { display: none; }
    .landscape-stage .settings-modal,
    .landscape-stage .records-modal { position: absolute; }

    @media (orientation: portrait) {
      .landscape-stage {
        left: 50%;
        top: 50%;
        width: 100svh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
    @media (orientation: landscape) {
      .landscape-stage {
        left: 0;
        top: 0;
        width: 100vw;
        height: 100svh;
        transform: none;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .led { transition: none; }
    }
  </style>
</head>
<body>
  <div class="landscape-stage" id="landscape-stage">
  <main class="app" id="app">
    <header class="topbar">
      <a class="back" href="../" aria-label="For My Sonsにもどる">‹</a>
      <div class="title">
        <p class="eyebrow">ESCAPE RING · SENSOR GAME</p>
        <h1>ひかりリング</h1>
      </div>
      <button class="mini-button" id="records-button" type="button" aria-label="家族の記録を見る">🏆</button>
      <button class="mini-button" id="settings-button" type="button" aria-label="設定をひらく">⚙️</button>
    </header>

    <section class="hud" aria-label="ゲーム状況">
      <div class="hud-pill">BLUE <span class="life-count" id="life-count">5</span></div>
    </section>

    <section class="stage" aria-label="赤いLEDから逃げるゲーム">
      <div class="ring-shell" id="ring" role="img" aria-label="50個のLEDリング。青が自分、赤が追いかけてきます">
        <div class="ring-face"></div>
        <div class="ring-guide"></div>
        <div id="leds"></div>
        <div class="center">
          <div class="time-counter" aria-label="経過時間">
            <span class="time-number" id="time-count">0.00</span>
            <span class="time-unit">SEC</span>
            <span class="new-record-badge" id="new-record-badge" hidden>NEW RECORD</span>
          </div>
        </div>
      </div>
    </section>

    <section class="controls">
      <button class="start" id="start-button" type="button">ゲームスタート</button>
      <p class="status" id="status">どこまで逃げられるか、タイム勝負。</p>
      <p class="hint">青は5つ。赤に当たるたび1つ減る。</p>
    </section>
  </main>

  <div class="settings-modal" id="settings-modal" aria-hidden="true">
    <div class="settings-backdrop" id="settings-backdrop"></div>
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <div>
          <p class="eyebrow">SETTINGS</p>
          <h2 id="settings-title">せってい</h2>
        </div>
        <button class="settings-close" id="settings-close" type="button" aria-label="設定をとじる">✕</button>
      </div>

      <label class="speed-control" for="speed-slider">
        <span class="speed-label">青の速さ</span>
        <input class="speed-slider" id="speed-slider" type="range" min="1" max="10" step="1" value="10">
        <span class="speed-value" id="speed-value">10</span>
      </label>

      <button class="settings-action" id="center-button" type="button">この位置を まんなかにする</button>
      <button class="settings-action" id="refresh-button" type="button">↻ 最新データに更新</button>
    </section>
  </div>

  <div class="records-modal" id="records-modal" aria-hidden="true">
    <div class="records-backdrop" id="records-backdrop"></div>
    <section class="records-card" role="dialog" aria-modal="true" aria-labelledby="records-title">
      <div class="records-head">
        <div>
          <p class="eyebrow">RECORDS</p>
          <h2 id="records-title">きろく</h2>
        </div>
        <button class="records-close" id="records-close" type="button" aria-label="記録をとじる">✕</button>
      </div>

      <div class="personal-record">
        <span>MY BEST</span>
        <strong id="my-best">—</strong>
        <small id="record-profile">読み込み中…</small>
      </div>

      <div class="family-record-title">FAMILY RECORD</div>
      <ol class="family-record-list" id="family-record-list">
        <li class="record-empty">記録を読み込み中…</li>
      </ol>
    </section>
  </div>
  </div>

  <script src="../shared/for-my-sons-db.js?v=2"></script>
  <script src="../shared/profile-manager.js?v=2"></script>
  <script src="../shared/parent-lock.js?v=3"></script>
  <script src="../shared/save-store.js?v=2"></script>
  <script src="../shared/github-sync.js?v=9"></script>
  <script src="../shared/character-requests.js?v=5"></script>
  <script src="../shared/parent-requests.js?v=4"></script>
  <script src="../shared/for-my-sons.js?v=13"></script>
  <script>
    (() => {
      const LED_COUNT = 50;
      const MAX_TILT = 28;
      const DEAD_ZONE = 1.8;
      const SMOOTHING = 0.12;
      const SENSOR_GAIN = 0.50;
      const WATER_DAMPING = 0.943;
      const SPEED_MIN = 0.007;
      const SPEED_MAX = 0.035;
      const SPRING_MIN = 0.0035;
      const SPRING_MAX = 0.012;
      const ENEMY_SPEED = 0.0165;
      const ENEMY_SPEED_STEP = 0.0012;
      const ENEMY_SPEED_INTERVAL_MS = 6000;
      const ENEMY_SPEED_FAST_INTERVAL_MS = 4000;
      const ENEMY_SPEED_FAST_START_MS = 50000;
      const ENEMY_SPEED_MAX = 0.032;
      const ENEMY_TURN_INTERVAL_MS = 5000;
      const ENEMY_TURN_BLEND_MS = 650;
      const ENEMY_LOOKAHEAD_MIN = 5;
      const ENEMY_LOOKAHEAD_MAX = 16;
      const ENEMY_LOOKAHEAD_VELOCITY_BONUS = 5;
      const HIT_DISTANCE = 2.1;
      const HIT_COOLDOWN_MS = 950;
      const STARTING_LIVES = 5;
      const BUILD_VERSION = '27';
      const ACTIVE_CACHE_NAME = 'for-my-sons-v124';
      const RECORD_APP_ID = 'tilt-led';
      const RECORD_SAVE_KEY = 'survival-record';
      const FALLBACK_RECORD_KEY = 'tilt-led-best-centiseconds';

      const landscapeStage = document.querySelector('#landscape-stage');
      const app = document.querySelector('#app');
      const ring = document.querySelector('#ring');
      const ledsRoot = document.querySelector('#leds');
      const startButton = document.querySelector('#start-button');
      const recordsButton = document.querySelector('#records-button');
      const recordsModal = document.querySelector('#records-modal');
      const recordsBackdrop = document.querySelector('#records-backdrop');
      const recordsClose = document.querySelector('#records-close');
      const myBest = document.querySelector('#my-best');
      const recordProfile = document.querySelector('#record-profile');
      const familyRecordList = document.querySelector('#family-record-list');
      const newRecordBadge = document.querySelector('#new-record-badge');
      const settingsButton = document.querySelector('#settings-button');
      const settingsModal = document.querySelector('#settings-modal');
      const settingsBackdrop = document.querySelector('#settings-backdrop');
      const settingsClose = document.querySelector('#settings-close');
      const centerButton = document.querySelector('#center-button');
      const refreshButton = document.querySelector('#refresh-button');
      const status = document.querySelector('#status');
      const lifeCount = document.querySelector('#life-count');
      const timeCount = document.querySelector('#time-count');
      const speedSlider = document.querySelector('#speed-slider');
      const speedValue = document.querySelector('#speed-value');

      const leds = [];
      let sensorStarted = false;
      let calibrated = false;
      let zeroX = 0;
      let zeroY = 0;
      let targetX = 0;
      let targetY = 0;
      let smoothX = 0;
      let smoothY = 0;
      let dragging = false;

      let playerAngle = 0;
      let playerVelocity = 0;
      let lastTargetAngle = 0;
      let enemyAngle = Math.PI;
      let enemyTravelDirection = 1;
      let enemyLastTurnAt = 0;
      let enemyTurnStartedAt = 0;
      let gameRunning = false;
      let gamePaused = false;
      let lives = 5;
      let lastHitAt = -Infinity;
      let gameStartedAt = 0;
      let pausedAt = 0;
      let pausedTotal = 0;
      let sharedApi = null;
      let currentProfile = null;
      let familyRecords = [];
      let recordInitPromise = null;

      const savedSpeed = Number(localStorage.getItem('tilt-led-speed'));
      let speedSetting = Number.isFinite(savedSpeed) && savedSpeed >= 1 && savedSpeed <= 10 ? savedSpeed : 10;
      speedSlider.value = String(speedSetting);
      speedValue.textContent = String(speedSetting);

      for (let i = 0; i < LED_COUNT; i += 1) {
        const led = document.createElement('div');
        led.className = 'led';
        led.style.setProperty('--a', (i * 360 / LED_COUNT) + 'deg');
        ledsRoot.appendChild(led);
        leds.push(led);
      }

      function syncLandscapeViewport() {
        const viewport = window.visualViewport;
        const width = viewport?.width || window.innerWidth;
        const height = viewport?.height || window.innerHeight;
        const left = viewport?.offsetLeft || 0;
        const top = viewport?.offsetTop || 0;
        const portrait = height > width;

        if (portrait) {
          landscapeStage.style.width = height + 'px';
          landscapeStage.style.height = width + 'px';
          landscapeStage.style.left = (left + width / 2) + 'px';
          landscapeStage.style.top = (top + height / 2) + 'px';
          landscapeStage.style.transform = 'translate(-50%, -50%) rotate(90deg)';
        } else {
          landscapeStage.style.width = width + 'px';
          landscapeStage.style.height = height + 'px';
          landscapeStage.style.left = left + 'px';
          landscapeStage.style.top = top + 'px';
          landscapeStage.style.transform = 'none';
        }
      }

      function screenAngle() {
        const value = screen.orientation && Number.isFinite(screen.orientation.angle)
          ? screen.orientation.angle
          : (typeof window.orientation === 'number' ? window.orientation : 0);
        return ((value % 360) + 360) % 360;
      }

      function transformForScreen(beta, gamma) {
        const physicalAngle = screenAngle();
        const forcedPortraitRotation = window.matchMedia('(orientation: portrait)').matches ? 90 : 0;
        const angle = (physicalAngle + forcedPortraitRotation) % 360;
        if (angle === 90) return { x: beta, y: -gamma };
        if (angle === 180) return { x: -gamma, y: -beta };
        if (angle === 270) return { x: -beta, y: gamma };
        return { x: gamma, y: beta };
      }

      function onOrientation(event) {
        if (typeof event.beta !== 'number' || typeof event.gamma !== 'number') return;
        const value = transformForScreen(event.beta, event.gamma);

        if (!calibrated) {
          zeroX = value.x;
          zeroY = value.y;
          calibrated = true;
          if (!gameRunning) status.textContent = 'センサーOK。スタートできます。';
        }

        targetX = (value.x - zeroX) * SENSOR_GAIN;
        targetY = (value.y - zeroY) * SENSOR_GAIN;
      }

      async function ensureSensor() {
        if (sensorStarted) return true;
        if (!('DeviceOrientationEvent' in window)) {
          status.textContent = 'センサーなし：リングを指でドラッグして遊べます。';
          return true;
        }

        try {
          if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
              status.textContent = 'センサーが許可されていません。指ドラッグでも遊べます。';
              return true;
            }
          }
          calibrated = false;
          window.addEventListener('deviceorientation', onOrientation, true);
          sensorStarted = true;
          app.classList.add('is-running');
          return true;
        } catch (error) {
          console.warn('Device orientation permission failed.', error);
          status.textContent = 'センサーを開始できません。指ドラッグでも遊べます。';
          return true;
        }
      }

      function setCenter() {
        if (sensorStarted) {
          zeroX += targetX / SENSOR_GAIN;
          zeroY += targetY / SENSOR_GAIN;
        }
        targetX = 0;
        targetY = 0;
        smoothX = 0;
        smoothY = 0;
        playerVelocity = 0;
        calibrated = sensorStarted;
        status.textContent = 'ここを まんなかにしました。';
      }

      function pointerTilt(event) {
        const rect = ring.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const radius = rect.width * 0.38;
        const dx = (event.clientX - cx) / radius;
        const dy = (event.clientY - cy) / radius;
        targetX = Math.max(-1, Math.min(1, dx)) * MAX_TILT;
        targetY = Math.max(-1, Math.min(1, dy)) * MAX_TILT;
      }

      ring.addEventListener('pointerdown', (event) => {
        dragging = true;
        ring.setPointerCapture?.(event.pointerId);
        pointerTilt(event);
      });
      ring.addEventListener('pointermove', (event) => {
        if (dragging) pointerTilt(event);
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        if (!sensorStarted) {
          targetX = 0;
          targetY = 0;
        }
      };
      ring.addEventListener('pointerup', endDrag);
      ring.addEventListener('pointercancel', endDrag);
      ring.addEventListener('lostpointercapture', endDrag);

      function shortestAngle(from, to) {
        let diff = (to - from + Math.PI) % (Math.PI * 2) - Math.PI;
        if (diff < -Math.PI) diff += Math.PI * 2;
        return diff;
      }

      function normalizedAngle(value) {
        return ((value % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      }

      function circularLedDistance(a, b) {
        const diff = Math.abs(a - b) % LED_COUNT;
        return Math.min(diff, LED_COUNT - diff);
      }

      function speedRatio() {
        return (speedSetting - 1) / 9;
      }

      function currentMaxSpeed() {
        return SPEED_MIN + (SPEED_MAX - SPEED_MIN) * speedRatio();
      }

      function currentSpring() {
        return SPRING_MIN + (SPRING_MAX - SPRING_MIN) * speedRatio();
      }

      function currentImpulse() {
        return 0.003 + 0.011 * speedRatio();
      }

      function playerLedPosition() {
        return (normalizedAngle(playerAngle) / (Math.PI * 2)) * LED_COUNT;
      }

      function enemyLedPosition() {
        return (normalizedAngle(enemyAngle) / (Math.PI * 2)) * LED_COUNT;
      }

      function formatRecord(cs) {
        return Number.isFinite(cs) && cs > 0 ? (cs / 100).toFixed(2) : '—';
      }

      function renderFamilyRecords() {
        myBest.textContent = formatRecord(
          familyRecords.find(item => item.profile.id === currentProfile?.id)?.bestCs || 0
        );
        recordProfile.textContent = currentProfile?.label || 'この端末';

        const sorted = [...familyRecords].sort((a, b) => {
          if ((b.bestCs || 0) !== (a.bestCs || 0)) return (b.bestCs || 0) - (a.bestCs || 0);
          return String(a.profile.label).localeCompare(String(b.profile.label), 'ja');
        });

        familyRecordList.replaceChildren();
        if (!sorted.length) {
          const empty = document.createElement('li');
          empty.className = 'record-empty';
          empty.textContent = 'まだ家族の記録がありません';
          familyRecordList.appendChild(empty);
          return;
        }

        sorted.forEach((item, index) => {
          const li = document.createElement('li');
          if (item.profile.id === currentProfile?.id) li.classList.add('is-me');

          const rank = document.createElement('span');
          rank.className = 'record-rank';
          rank.textContent = item.bestCs > 0 ? String(index + 1) : '—';

          const name = document.createElement('span');
          name.className = 'record-name';
          name.textContent = item.profile.label || item.profile.id;
          if (item.profile.id === currentProfile?.id) {
            const you = document.createElement('em');
            you.textContent = 'YOU';
            name.appendChild(you);
          }

          const score = document.createElement('strong');
          score.className = 'record-score';
          score.textContent = formatRecord(item.bestCs);

          li.append(rank, name, score);
          familyRecordList.appendChild(li);
        });
      }

      async function refreshFamilyRecords() {
        if (!sharedApi || !currentProfile) {
          const fallbackBest = Number(localStorage.getItem(FALLBACK_RECORD_KEY)) || 0;
          familyRecords = [{
            profile: currentProfile || { id: 'local', label: 'この端末' },
            bestCs: fallbackBest
          }];
          renderFamilyRecords();
          return;
        }

        let profiles = await sharedApi.profile.list();
        if (!profiles.some(profile => profile.id === currentProfile.id)) {
          profiles = [currentProfile, ...profiles];
        }
        const realProfiles = profiles.filter(profile => profile.id !== 'profile-1');
        if (realProfiles.length && currentProfile.id !== 'profile-1') profiles = realProfiles;

        familyRecords = await Promise.all(profiles.map(async profile => {
          try {
            const record = await sharedApi.save.get(profile.id, RECORD_APP_ID, RECORD_SAVE_KEY);
            return {
              profile,
              bestCs: Number(record?.value?.bestCs) || 0
            };
          } catch (error) {
            console.warn('Record load failed for', profile.id, error);
            return { profile, bestCs: 0 };
          }
        }));
        renderFamilyRecords();
      }

      async function refreshCaches({ forceReload = false } = {}) {
        refreshButton && (refreshButton.disabled = true);
        if (refreshButton) refreshButton.textContent = '更新中…';

        try {
          if ('serviceWorker' in navigator) {
            let registration = await navigator.serviceWorker.getRegistration('../');
            if (!registration) {
              registration = await navigator.serviceWorker.register('../service-worker.js', {
                scope: '../',
                updateViaCache: 'none'
              });
            }
            await registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          }

          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys
                .filter(key => key.startsWith('for-my-sons-') && key !== ACTIVE_CACHE_NAME)
                .map(key => caches.delete(key))
            );
          }

          localStorage.setItem('tilt-led-build-version', BUILD_VERSION);

          if (forceReload) {
            const url = new URL(location.href);
            url.searchParams.set('v', BUILD_VERSION);
            url.searchParams.set('refresh', Date.now().toString());
            location.replace(url.toString());
            return;
          }
        } catch (error) {
          console.warn('Cache refresh failed.', error);
        } finally {
          if (refreshButton) {
            refreshButton.disabled = false;
            refreshButton.textContent = '↻ 最新データに更新';
          }
        }
      }

      async function refreshCachesOnBuildChange() {
        const seen = localStorage.getItem('tilt-led-build-version');
        if (seen === BUILD_VERSION) return;
        await refreshCaches();
      }

      function ensureRecordSystem() {
        if (recordInitPromise) return recordInitPromise;
        recordInitPromise = (async () => {
          try {
            if (!window.ForMySonsShared?.createForMySons) throw new Error('shared api unavailable');
            sharedApi = await window.ForMySonsShared.createForMySons();
            currentProfile = await sharedApi.profile.current();
          } catch (error) {
            console.warn('Tilt LED record system fallback.', error);
            sharedApi = null;
            currentProfile = { id: 'local', label: 'この端末' };
          }
          await refreshFamilyRecords();
        })();
        return recordInitPromise;
      }

      async function saveRecord(finalCs) {
        await ensureRecordSystem();

        const existing = familyRecords.find(item => item.profile.id === currentProfile?.id);
        const previousBest = Number(existing?.bestCs) || 0;
        const isNewRecord = finalCs > previousBest;

        if (isNewRecord) {
          if (sharedApi) {
            await sharedApi.save.json(RECORD_APP_ID, RECORD_SAVE_KEY, {
              bestCs: finalCs,
              bestSeconds: finalCs / 100,
              updatedAt: new Date().toISOString()
            });
          } else {
            localStorage.setItem(FALLBACK_RECORD_KEY, String(finalCs));
          }
          await refreshFamilyRecords();
        }

        newRecordBadge.hidden = !isNewRecord;
        status.textContent = isNewRecord
          ? 'NEW RECORD!  ' + formatRecord(finalCs) + ' 秒'
          : '記録 ' + formatRecord(finalCs) + ' 秒  /  BEST ' + formatRecord(previousBest) + ' 秒';
      }

      function resetGame() {
        lives = STARTING_LIVES;
        lifeCount.textContent = String(lives);
        lifeCount.classList.remove('is-danger');
        timeCount.textContent = '0.00';
        timeCount.classList.remove('is-final');
        newRecordBadge.hidden = true;
        playerAngle = 0;
        playerVelocity = 0;
        lastTargetAngle = 0;
        enemyAngle = Math.PI;
        lastHitAt = -Infinity;
        gameStartedAt = performance.now();
        enemyTravelDirection = 1;
        enemyLastTurnAt = gameStartedAt;
        enemyTurnStartedAt = gameStartedAt;
        pausedTotal = 0;
        pausedAt = 0;
        gameRunning = true;
        gamePaused = false;
        startButton.disabled = true;
        startButton.textContent = 'にげろ！';
        status.textContent = '青がなくなるまで逃げよう。';
      }

      function gameOver(now) {
        const finalElapsed = Math.max(0, now - gameStartedAt - pausedTotal);
        const finalCs = Math.round(finalElapsed / 10);
        timeCount.textContent = formatRecord(finalCs);
        gameRunning = false;
        gamePaused = false;
        startButton.disabled = false;
        startButton.textContent = 'もういちど';
        lifeCount.textContent = '0';
        lifeCount.classList.add('is-danger');
        timeCount.classList.add('is-final');
        status.textContent = '記録を保存中…';
        void saveRecord(finalCs);
      }

      function registerHit(now) {
        if (!gameRunning || now - lastHitAt < HIT_COOLDOWN_MS) return;
        lastHitAt = now;
        lives = Math.max(0, lives - 1);
        lifeCount.textContent = String(lives);
        lifeCount.classList.toggle('is-danger', lives <= 2);
        ring.classList.add('is-hit');
        setTimeout(() => ring.classList.remove('is-hit'), 180);

        if (lives <= 0) {
          gameOver(now);
          return;
        }

        enemyAngle = normalizedAngle(playerAngle + Math.PI);
        status.textContent = '青が1つ減った。残り ' + lives + '。';
      }

      function updatePlayer() {
        smoothX += (targetX - smoothX) * SMOOTHING;
        smoothY += (targetY - smoothY) * SMOOTHING;

        const magnitude = Math.hypot(smoothX, smoothY);
        const level = magnitude <= DEAD_ZONE;
        let targetAngle = Math.atan2(smoothX, -smoothY);
        if (targetAngle < 0) targetAngle += Math.PI * 2;

        if (!level) {
          const angleDelta = shortestAngle(playerAngle, targetAngle);
          const targetMotion = shortestAngle(lastTargetAngle, targetAngle);
          playerVelocity += angleDelta * currentSpring();
          playerVelocity += targetMotion * currentImpulse();
          playerVelocity *= WATER_DAMPING;
          const maxSpeed = currentMaxSpeed();
          playerVelocity = Math.max(-maxSpeed, Math.min(maxSpeed, playerVelocity));
          playerAngle += playerVelocity;
          lastTargetAngle = targetAngle;
        } else {
          playerVelocity *= 0.94;
          playerAngle += playerVelocity;
        }
        playerAngle = normalizedAngle(playerAngle);
      }

      function currentEnemySpeed(now) {
        if (!gameRunning) return ENEMY_SPEED;
        const elapsed = Math.max(0, now - gameStartedAt - pausedTotal);

        const normalElapsed = Math.min(elapsed, ENEMY_SPEED_FAST_START_MS);
        const normalLevels = Math.floor(normalElapsed / ENEMY_SPEED_INTERVAL_MS);

        const fastElapsed = Math.max(0, elapsed - ENEMY_SPEED_FAST_START_MS);
        const fastLevels = Math.floor(fastElapsed / ENEMY_SPEED_FAST_INTERVAL_MS);

        const level = normalLevels + fastLevels;
        return Math.min(ENEMY_SPEED_MAX, ENEMY_SPEED + level * ENEMY_SPEED_STEP);
      }

      function updateEnemy(now) {
        const speed = currentEnemySpeed(now);

        if (now - enemyLastTurnAt >= ENEMY_TURN_INTERVAL_MS) {
          enemyTravelDirection *= -1;
          enemyLastTurnAt = now;
          enemyTurnStartedAt = now;
        }

        const directDistance = Math.abs(shortestAngle(enemyAngle, playerAngle));
        const distanceRatio = Math.min(1, directDistance / Math.PI);
        const playerSpeedRatio = Math.min(1, Math.abs(playerVelocity) / Math.max(0.001, currentMaxSpeed()));

        const lookAheadFrames =
          ENEMY_LOOKAHEAD_MIN +
          (ENEMY_LOOKAHEAD_MAX - ENEMY_LOOKAHEAD_MIN) * distanceRatio +
          ENEMY_LOOKAHEAD_VELOCITY_BONUS * playerSpeedRatio;

        const predictedPlayerAngle = normalizedAngle(
          playerAngle + playerVelocity * lookAheadFrames
        );

        const shortest = shortestAngle(enemyAngle, predictedPlayerAngle);
        const desiredDirection = shortest >= 0 ? 1 : -1;

        // 普段は選んだ周回方向を守る。5秒ごとにその方向を反転させる。
        // 反転直後だけ少し減速して、瞬間的なワープ感をなくす。
        const turnAge = now - enemyTurnStartedAt;
        const turnBlend = Math.min(1, Math.max(0.28, turnAge / ENEMY_TURN_BLEND_MS));

        let direction = enemyTravelDirection;

        // かなり近い時だけ、目の前の青を取り逃さないよう最短方向を優先。
        if (directDistance < 0.22) direction = desiredDirection;

        enemyAngle = normalizedAngle(
          enemyAngle + direction * speed * turnBlend
        );
      }

      function renderLeds() {
        const playerPos = playerLedPosition();
        const enemyPos = enemyLedPosition();
        const playerCenter = Math.round(playerPos) % LED_COUNT;
        const enemyCenter = Math.round(enemyPos) % LED_COUNT;

        const playerOffsets = [];
        if (lives > 0) {
          const half = Math.floor(lives / 2);
          for (let i = 0; i < lives; i += 1) {
            playerOffsets.push(i - half);
          }
        }

        leds.forEach((led, index) => {
          const relative = ((index - playerCenter + LED_COUNT + Math.floor(LED_COUNT / 2)) % LED_COUNT) - Math.floor(LED_COUNT / 2);
          const playerIndex = playerOffsets.indexOf(relative);
          const isPlayer = playerIndex >= 0;
          const isEnemy = index === enemyCenter;

          led.classList.toggle('is-player', isPlayer);
          led.classList.toggle('is-player-near', false);
          led.classList.toggle('is-enemy', isEnemy);
          led.classList.toggle('is-enemy-near', false);

          const glow = isPlayer || isEnemy ? 1 : 0;
          led.style.setProperty('--b', (0.04 + glow * .28).toFixed(3));
          led.style.setProperty('--s', (1 + glow * .22).toFixed(3));
        });

        return { playerPos, enemyPos };
      }

      function render(now) {
        updatePlayer();

        if (gameRunning && !gamePaused) {
          updateEnemy(now);
          const elapsed = Math.max(0, now - gameStartedAt - pausedTotal);
          timeCount.textContent = (elapsed / 1000).toFixed(2);
        }

        const positions = renderLeds();

        if (gameRunning && !gamePaused) {
          const distance = circularLedDistance(positions.playerPos, positions.enemyPos);
          const blueHalfSpan = lives > 0 ? Math.floor(lives / 2) : 0;
          const hitDistance = Math.max(HIT_DISTANCE, blueHalfSpan + 0.5);
          if (distance <= hitDistance) registerHit(now);
        }

        requestAnimationFrame(render);
      }

      speedSlider.addEventListener('input', () => {
        speedSetting = Number(speedSlider.value);
        speedValue.textContent = String(speedSetting);
        localStorage.setItem('tilt-led-speed', String(speedSetting));
      });

      function syncModalPause() {
        const modalOpen =
          settingsModal.classList.contains('is-open') ||
          recordsModal.classList.contains('is-open');

        if (!gameRunning) return;
        if (modalOpen && !gamePaused) {
          gamePaused = true;
          pausedAt = performance.now();
        } else if (!modalOpen && gamePaused) {
          const pauseDuration = performance.now() - pausedAt;
          pausedTotal += pauseDuration;
          enemyLastTurnAt += pauseDuration;
          enemyTurnStartedAt += pauseDuration;
          pausedAt = 0;
          gamePaused = false;
        }
      }

      function setSettingsOpen(open) {
        settingsModal.classList.toggle('is-open', open);
        settingsModal.setAttribute('aria-hidden', String(!open));
        syncModalPause();
      }

      async function setRecordsOpen(open) {
        recordsModal.classList.toggle('is-open', open);
        recordsModal.setAttribute('aria-hidden', String(!open));
        syncModalPause();
        if (open) {
          await ensureRecordSystem();
          await refreshFamilyRecords();
        }
      }

      recordsButton.addEventListener('click', () => void setRecordsOpen(true));
      recordsClose.addEventListener('click', () => void setRecordsOpen(false));
      recordsBackdrop.addEventListener('click', () => void setRecordsOpen(false));
      settingsButton.addEventListener('click', () => setSettingsOpen(true));
      settingsClose.addEventListener('click', () => setSettingsOpen(false));
      settingsBackdrop.addEventListener('click', () => setSettingsOpen(false));

      startButton.addEventListener('click', async () => {
        await ensureSensor();
        resetGame();
      });

      centerButton.addEventListener('click', () => {
        setCenter();
        setSettingsOpen(false);
      });
      refreshButton.addEventListener('click', () => {
        void refreshCaches({ forceReload: true });
      });

      window.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (recordsModal.classList.contains('is-open')) void setRecordsOpen(false);
        else if (settingsModal.classList.contains('is-open')) setSettingsOpen(false);
      });

      window.addEventListener('orientationchange', () => {
        syncLandscapeViewport();
        calibrated = false;
        targetX = 0;
        targetY = 0;
        smoothX = 0;
        smoothY = 0;
        playerVelocity = 0;
        if (sensorStarted) status.textContent = '向きがかわったので、基準を取りなおします。';
      });

      window.addEventListener('resize', syncLandscapeViewport);
      window.visualViewport?.addEventListener('resize', syncLandscapeViewport);
      window.visualViewport?.addEventListener('scroll', syncLandscapeViewport);
      syncLandscapeViewport();

      void refreshCachesOnBuildChange();
      void ensureRecordSystem();
      renderLeds();
      requestAnimationFrame(render);
    })();
