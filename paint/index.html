<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe2">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ペイント</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="icon-button back" href="../" aria-label="For My Sonsにもどる">‹</a>
      <div class="title-wrap">
        <p class="eyebrow">FOR MY SONS</p>
        <h1>ペイント</h1>
      </div>
      <button class="save-button" id="save" type="button">ほぞん</button>
    </header>

    <main>
      <section class="ratio-bar" aria-label="キャンバスのかたち">
        <span class="ratio-label">キャンバス</span>
        <div class="ratio-options" role="group" aria-label="キャンバス比率">
          <button type="button" data-ratio="1:1" class="is-active">1:1</button>
          <button type="button" data-ratio="3:2">3:2</button>
          <button type="button" data-ratio="2:3">2:3</button>
          <button type="button" data-ratio="16:9">16:9</button>
        </div>
      </section>

      <section class="canvas-stage" id="canvas-stage">
        <div class="canvas-frame" id="canvas-frame">
          <canvas id="paint-canvas" aria-label="おえかきキャンバス"></canvas>
        </div>
      </section>

      <section class="tools" aria-label="おえかきどうぐ">
        <div class="tool-row primary-tools">
          <button class="tool-button is-active" id="brush" type="button" aria-pressed="true">
            <span class="tool-icon">✎</span><span>ペン</span>
          </button>
          <button class="tool-button" id="eraser" type="button" aria-pressed="false">
            <span class="tool-icon">⌫</span><span>けしゴム</span>
          </button>
          <div class="divider" aria-hidden="true"></div>
          <button class="round-button" id="undo" type="button" aria-label="もどす" disabled>↶</button>
          <button class="round-button" id="redo" type="button" aria-label="やりなおす" disabled>↷</button>
          <button class="round-button clear-button" id="clear" type="button" aria-label="ぜんぶけす">✕</button>
        </div>

        <div class="tool-row colors" id="colors" aria-label="いろ">
          <button class="color is-active" type="button" data-color="#222222" style="--swatch:#222222" aria-label="くろ"></button>
          <button class="color" type="button" data-color="#ef4444" style="--swatch:#ef4444" aria-label="あか"></button>
          <button class="color" type="button" data-color="#f97316" style="--swatch:#f97316" aria-label="オレンジ"></button>
          <button class="color" type="button" data-color="#facc15" style="--swatch:#facc15" aria-label="きいろ"></button>
          <button class="color" type="button" data-color="#22c55e" style="--swatch:#22c55e" aria-label="みどり"></button>
          <button class="color" type="button" data-color="#3b82f6" style="--swatch:#3b82f6" aria-label="あお"></button>
          <button class="color" type="button" data-color="#8b5cf6" style="--swatch:#8b5cf6" aria-label="むらさき"></button>
          <button class="color" type="button" data-color="#ec4899" style="--swatch:#ec4899" aria-label="ピンク"></button>
        </div>

        <div class="tool-row sizes" role="group" aria-label="ペンのふとさ">
          <span class="size-label">ふとさ</span>
          <button type="button" data-size="10"><span class="dot dot-s"></span></button>
          <button type="button" data-size="24" class="is-active"><span class="dot dot-m"></span></button>
          <button type="button" data-size="48"><span class="dot dot-l"></span></button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
