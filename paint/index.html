<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe2">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ペイント</title>
  <link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="icon-button back" href="../" aria-label="For My Sonsにもどる">‹</a>
      <div class="title-wrap">
        <p class="eyebrow">FOR MY SONS</p>
        <h1>ペイント</h1>
      </div>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <main>
      <section class="ratio-bar" aria-label="キャンバスのかたち">
        <span class="ratio-label">キャンバス</span>
        <div class="ratio-options" role="group" aria-label="キャンバス比率">
          <button type="button" data-ratio="1:1" class="is-active">1:1</button>
          <button type="button" data-ratio="3:2">3:2</button>
          <button type="button" data-ratio="2:3">2:3</button>
          <button type="button" data-ratio="16:9">16:9</button>
        </div>
      </section>

      <section class="save-actions" aria-label="保存">
        <button class="save-choice puzzle-save" id="puzzle-save" type="button">
          <span class="save-choice-icon" aria-hidden="true">🧩</span>
          <span><strong>パズルに保存</strong><small>写真にも保存</small></span>
        </button>
        <button class="save-choice phone-save" id="phone-save" type="button">
          <span class="save-choice-icon" aria-hidden="true">↓</span>
          <span><strong>携帯に保存</strong><small>いまの形のまま</small></span>
        </button>
        <button class="save-choice wanko-save" id="wanko-save" type="button">
          <span class="save-choice-icon" aria-hidden="true">🐶</span>
          <span><strong>わんこに登録</strong><small>図鑑とバトルへ</small></span>
        </button>
      </section>

      <section class="canvas-stage" id="canvas-stage">
        <div class="canvas-frame" id="canvas-frame">
          <canvas id="paint-canvas" aria-label="おえかきキャンバス"></canvas>
        </div>
      </section>

      <section class="tools" aria-label="おえかきどうぐ">
        <div class="tool-row primary-tools">
          <button class="tool-button is-active" id="brush" type="button" aria-pressed="true">
            <span class="tool-icon">✎</span><span>ペン</span>
          </button>
          <button class="tool-button" id="eraser" type="button" aria-pressed="false">
            <span class="tool-icon">⌫</span><span>けしゴム</span>
          </button>
          <div class="divider" aria-hidden="true"></div>
          <button class="round-button" id="undo" type="button" aria-label="もどす" disabled>↶</button>
          <button class="round-button" id="redo" type="button" aria-label="やりなおす" disabled>↷</button>
          <button class="round-button clear-button" id="clear" type="button" aria-label="ぜんぶけす">✕</button>
        </div>

        <div class="tool-row colors" id="colors" aria-label="いろ">
          <button class="color is-active" type="button" data-color="#222222" style="--swatch:#222222" aria-label="くろ"></button>
          <button class="color" type="button" data-color="#ef4444" style="--swatch:#ef4444" aria-label="あか"></button>
          <button class="color" type="button" data-color="#f97316" style="--swatch:#f97316" aria-label="オレンジ"></button>
          <button class="color" type="button" data-color="#facc15" style="--swatch:#facc15" aria-label="きいろ"></button>
          <button class="color" type="button" data-color="#22c55e" style="--swatch:#22c55e" aria-label="みどり"></button>
          <button class="color" type="button" data-color="#3b82f6" style="--swatch:#3b82f6" aria-label="あお"></button>
          <button class="color" type="button" data-color="#8b5cf6" style="--swatch:#8b5cf6" aria-label="むらさき"></button>
          <button class="color" type="button" data-color="#ec4899" style="--swatch:#ec4899" aria-label="ピンク"></button>
        </div>

        <div class="tool-row sizes" role="group" aria-label="ペンのふとさ">
          <span class="size-label">ふとさ</span>
          <button type="button" data-size="10"><span class="dot dot-s"></span></button>
          <button type="button" data-size="24" class="is-active"><span class="dot dot-m"></span></button>
          <button type="button" data-size="48"><span class="dot dot-l"></span></button>
        </div>
      </section>
    </main>
  </div>

  <div class="modal crop-modal" id="crop-modal" aria-hidden="true">
    <section class="modal-card crop-card" role="dialog" aria-modal="true" aria-labelledby="crop-title">
      <div class="modal-head">
        <div>
          <p class="modal-kicker">PUZZLE</p>
          <h2 id="crop-title">正方形にしよう</h2>
        </div>
        <button class="modal-close" id="crop-close" type="button" aria-label="とじる">✕</button>
      </div>
      <p class="crop-help">指でうごかして、2本指で大きさをかえられるよ。</p>
      <div class="crop-preview-wrap">
        <canvas id="crop-preview" width="720" height="720" aria-label="正方形の切り抜きプレビュー"></canvas>
        <div class="crop-guide" aria-hidden="true"></div>
      </div>
      <div class="zoom-row">
        <span aria-hidden="true">−</span>
        <input id="crop-zoom" type="range" min="1" max="6" step="0.01" value="1" aria-label="拡大">
        <span aria-hidden="true">＋</span>
      </div>
      <div class="crop-actions">
        <button class="secondary-action" id="crop-reset" type="button">まんなか</button>
        <button class="primary-action" id="crop-confirm" type="button">これで決定</button>
      </div>
    </section>
  </div>

  <div class="modal" id="wanko-modal" aria-hidden="true">
    <section class="modal-card wanko-card" role="dialog" aria-modal="true" aria-labelledby="wanko-title">
      <div class="modal-head">
        <div><p class="modal-kicker">WANKO</p><h2 id="wanko-title">わんこを登録</h2></div>
        <button class="modal-close" id="wanko-close" type="button" aria-label="とじる">✕</button>
      </div>
      <div class="wanko-preview"><img id="wanko-preview-img" alt=""></div>
      <div class="wanko-faction-step" id="wanko-faction-step">
        <p class="wanko-question" id="wanko-faction-help">どっちのわんこ？</p>
        <div class="wanko-factions" role="group" aria-label="わんこの種類">
          <button class="faction-choice" type="button" data-faction="ally">味方</button>
          <button class="faction-choice" type="button" data-faction="enemy">敵</button>
        </div>
      </div>
      <div class="wanko-details is-hidden" id="wanko-details">
        <label class="wanko-name-label" for="wanko-name">なまえ</label>
        <input class="wanko-name-input" id="wanko-name" maxlength="24" placeholder="なまえをつけてね">
        <p class="wanko-note">登録依頼を出すと、パパが強さを考えてゲームに入れてくれるよ。</p>
      </div>
      <p class="wanko-request-status" id="wanko-request-status" role="status" aria-live="polite"></p>
      <div class="crop-actions">
        <button class="secondary-action" id="wanko-library-open" type="button">図鑑を見る</button>
        <button class="primary-action" id="wanko-confirm" type="button" disabled>登録依頼を出す</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="../shared/wanko-cloud-config.js"></script>
  <script src="../shared/wanko-cloud.js"></script>
  <script src="../shared/wanko-library-store.js?v=1"></script>
  <script src="../shared/wanko-library.js"></script>
  <script src="../shared/for-my-sons-db.js?v=2"></script>
  <script src="../shared/character-requests.js?v=2"></script>
  <script src="../shared/profile-manager.js?v=1"></script>
  <script src="../shared/parent-lock.js?v=1"></script>
  <script src="../shared/save-store.js?v=1"></script>
  <script src="../shared/github-sync.js?v=3"></script>
  <script src="../shared/for-my-sons.js?v=2"></script>
  <script src="./app.js?v=7" defer></script>
</body>
</html>
