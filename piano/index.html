<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe7">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ピアノ | For My Sons</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: #1f2937;
      background: linear-gradient(180deg, #f7f3ec 0%, #e9e4da 100%);
      -webkit-font-smoothing: antialiased;
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    .app {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding:
        calc(env(safe-area-inset-top) + 12px)
        12px
        calc(env(safe-area-inset-bottom) + 12px);
    }
    .topbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px 10px;
      flex: 0 0 auto;
    }
    .back {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #263238;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.9);
      text-decoration: none;
      font-size: 24px;
      font-weight: 650;
      box-shadow: 0 4px 12px rgba(55,50,43,.08);
    }
    .title {
      min-width: 0;
    }
    .title h1 {
      margin: 0;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1;
      letter-spacing: -.03em;
    }
    .title p {
      margin: 5px 0 0;
      color: #73706a;
      font-size: 12px;
      font-weight: 650;
    }
    .sound-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 4px 6px;
      flex: 0 0 auto;
    }
    .sound-button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(90,84,75,.16);
      border-radius: 14px;
      background: rgba(255,255,255,.64);
      color: #59544d;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 3px 10px rgba(55,50,43,.06);
      touch-action: manipulation;
    }
    .sound-button[aria-pressed="true"] {
      color: #fff;
      background: #3c3935;
      border-color: #3c3935;
      box-shadow: 0 4px 12px rgba(55,50,43,.18);
    }
    .sound-button:active { transform: scale(.97); }

    .synth-panel {
      display: none;
      flex: 0 0 auto;
      margin: 0 4px 8px;
      padding: 12px 14px 14px;
      border-radius: 20px;
      background: #2d2d2c;
      color: #f6f2ea;
      box-shadow: 0 12px 28px rgba(35,32,28,.18);
    }
    .app.is-custom .sound-picker { display: none; }
    .app.is-custom .synth-panel { display: block; }
    .synth-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .synth-back {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
    }
    .wave-picker {
      display: flex;
      gap: 5px;
      min-width: 0;
    }
    .wave-button {
      min-width: 42px;
      min-height: 38px;
      padding: 0 9px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 11px;
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.72);
      font: inherit;
      font-size: 11px;
      font-weight: 800;
    }
    .wave-button[aria-pressed="true"] {
      background: #f0e8d8;
      color: #262524;
      border-color: #f0e8d8;
    }
    .knob-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }
    .knob-control {
      min-width: 0;
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 4px 0 0;
      outline: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .knob-control:focus-visible .knob {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
    .knob {
      --angle: -135deg;
      position: relative;
      width: clamp(50px, 8vw, 66px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 44%, #555 0 18%, #343433 19% 62%, #181817 63% 100%);
      border: 2px solid #111;
      box-shadow: inset 0 2px 5px rgba(255,255,255,.10), 0 4px 8px rgba(0,0,0,.32);
      transform: rotate(var(--angle));
    }
    .knob::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 7px;
      width: 3px;
      height: 17px;
      border-radius: 3px;
      background: #f3ead9;
      transform: translateX(-50%);
    }
    .knob-name {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .04em;
      color: rgba(255,255,255,.68);
      white-space: nowrap;
    }
    .knob-value {
      font-size: 10px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: #fff;
      white-space: nowrap;
    }
    .app.is-custom .piano-shell {
      flex: 0 0 auto;
      height: clamp(145px, 28vh, 230px);
      min-height: 0;
      padding-top: 0;
    }
    .app.is-custom .keyboard {
      min-height: 0;
      height: 100%;
    }
    .app.is-custom .note-label {
      bottom: 7px;
      font-size: clamp(9px, 1.5vw, 14px);
    }

    .piano-shell {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 8px 0 0;
    }
    .keyboard {
      position: relative;
      width: min(100%, 1180px);
      min-height: 280px;
      display: flex;
      border: 10px solid #2a2928;
      border-bottom-width: 14px;
      border-radius: 20px;
      overflow: hidden;
      background: #2a2928;
      box-shadow: 0 18px 42px rgba(55,50,43,.18);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .white-key {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      border: 0;
      border-right: 1px solid #bdb8ae;
      border-radius: 0 0 9px 9px;
      background: linear-gradient(180deg, #fff 0%, #fbfaf7 70%, #e8e4dc 100%);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,.035);
      color: #67625a;
      touch-action: none;
    }
    .white-key:last-child { border-right: 0; }
    .white-key.is-active {
      background: linear-gradient(180deg, #f1eee8 0%, #e3ded5 100%);
      box-shadow: inset 0 5px 14px rgba(0,0,0,.10);
    }
    .note-label {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      font-size: clamp(10px, 1.8vw, 18px);
      font-weight: 800;
      pointer-events: none;
    }
    .black-key {
      position: absolute;
      top: 0;
      z-index: 3;
      width: 4.8%;
      height: 61%;
      transform: translateX(-50%);
      border: 0;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(180deg, #3c3a38 0%, #171716 78%, #090909 100%);
      box-shadow: 0 6px 8px rgba(0,0,0,.35), inset 0 -5px 0 rgba(255,255,255,.025);
      touch-action: none;
    }
    .black-key.is-active {
      background: linear-gradient(180deg, #242322 0%, #070707 100%);
      box-shadow: 0 2px 3px rgba(0,0,0,.35), inset 0 3px 8px rgba(255,255,255,.04);
      transform: translateX(-50%) translateY(3px);
    }
    .k-cs4 { left: 6.6667%; }
    .k-ds4 { left: 13.3333%; }
    .k-fs4 { left: 26.6667%; }
    .k-gs4 { left: 33.3333%; }
    .k-as4 { left: 40%; }
    .k-cs5 { left: 53.3333%; }
    .k-ds5 { left: 60%; }
    .k-fs5 { left: 73.3333%; }
    .k-gs5 { left: 80%; }
    .k-as5 { left: 86.6667%; }
    .status {
      min-height: 26px;
      padding: 8px 2px 0;
      text-align: center;
      color: #77716a;
      font-size: 12px;
      font-weight: 650;
      flex: 0 0 auto;
    }
    @media (max-width: 700px) {
      .knob-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px 5px; }
      .synth-panel { padding: 10px 10px 12px; }
      .knob { width: 50px; }
      .wave-button { min-width: 36px; padding: 0 7px; }
    }
    @media (orientation: landscape) {
      .app { padding-top: calc(env(safe-area-inset-top) + 8px); }
      .topbar { min-height: 46px; padding-bottom: 6px; }
      .back { width: 40px; height: 40px; }
      .keyboard { min-height: 210px; }
      .app.is-custom .piano-shell { height: clamp(120px, 38vh, 180px); }
      .app.is-custom .keyboard { min-height: 0; }
      .status { padding-top: 5px; }
    }
    @media (max-height: 520px) {
      .title p, .status { display: none; }
      .sound-picker { gap: 5px; padding-bottom: 4px; }
      .sound-button { min-height: 36px; padding: 0 10px; font-size: 12px; }
      .keyboard { min-height: 180px; }
      .app.is-custom .piano-shell { height: 120px; }
      .synth-panel { margin-bottom: 4px; padding: 8px 10px; }
      .synth-head { margin-bottom: 6px; }
      .knob-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .knob { width: 42px; }
      .knob-name, .knob-value { font-size: 9px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <a class="back" href="../" aria-label="ホームにもどる">‹</a>
      <div class="title">
        <h1>ピアノ</h1>
        <p>けんばんを おしてみよう</p>
      </div>
    </header>

    <div class="sound-picker" id="sound-picker" aria-label="音色をえらぶ">
      <button class="sound-button" type="button" data-sound="piano" aria-pressed="true">🎹 ピアノ</button>
      <button class="sound-button" type="button" data-sound="organ" aria-pressed="false">🎵 オルガン</button>
      <button class="sound-button" type="button" data-sound="marimba" aria-pressed="false">🪵 もっきん</button>
      <button class="sound-button" type="button" data-sound="bell" aria-pressed="false">🔔 ベル</button>
      <button class="sound-button" type="button" data-sound="synth" aria-pressed="false">✨ シンセ</button>
      <button class="sound-button" type="button" data-sound="custom" aria-pressed="false">🎛️ シンセカスタム</button>
      <button class="sound-button" type="button" data-sound="recorder" aria-pressed="false">🪈 リコーダー</button>
      <button class="sound-button" type="button" data-sound="violin" aria-pressed="false">🎻 バイオリン</button>
      <button class="sound-button" type="button" data-sound="melodica" aria-pressed="false">🎼 鍵盤ハーモニカ</button>
    </div>

    <section class="synth-panel" id="synth-panel" aria-label="シンセカスタム">
      <div class="synth-head">
        <button class="synth-back" id="synth-back" type="button">← 音色にもどる</button>
        <div class="wave-picker" aria-label="波形">
          <button class="wave-button" type="button" data-wave="sine" aria-pressed="false">SIN</button>
          <button class="wave-button" type="button" data-wave="triangle" aria-pressed="false">TRI</button>
          <button class="wave-button" type="button" data-wave="sawtooth" aria-pressed="true">SAW</button>
          <button class="wave-button" type="button" data-wave="square" aria-pressed="false">SQR</button>
        </div>
      </div>
      <div class="knob-grid">
        <div class="knob-control" tabindex="0" role="slider" aria-label="カットオフ" aria-valuemin="200" aria-valuemax="9000" aria-valuenow="3200" data-param="cutoff" data-min="200" data-max="9000" data-step="50" data-value="3200">
          <div class="knob"></div><div class="knob-name">CUTOFF</div><div class="knob-value"></div>
        </div>
        <div class="knob-control" tabindex="0" role="slider" aria-label="レゾナンス" aria-valuemin="0.2" aria-valuemax="18" aria-valuenow="3.5" data-param="resonance" data-min="0.2" data-max="18" data-step="0.1" data-value="3.5">
          <div class="knob"></div><div class="knob-name">RESONANCE</div><div class="knob-value"></div>
        </div>
        <div class="knob-control" tabindex="0" role="slider" aria-label="アタック" aria-valuemin="0.005" aria-valuemax="1.2" aria-valuenow="0.03" data-param="attack" data-min="0.005" data-max="1.2" data-step="0.005" data-value="0.03">
          <div class="knob"></div><div class="knob-name">ATTACK</div><div class="knob-value"></div>
        </div>
        <div class="knob-control" tabindex="0" role="slider" aria-label="リリース" aria-valuemin="0.03" aria-valuemax="2.5" aria-valuenow="0.45" data-param="release" data-min="0.03" data-max="2.5" data-step="0.01" data-value="0.45">
          <div class="knob"></div><div class="knob-name">RELEASE</div><div class="knob-value"></div>
        </div>
        <div class="knob-control" tabindex="0" role="slider" aria-label="デチューン" aria-valuemin="0" aria-valuemax="40" aria-valuenow="8" data-param="detune" data-min="0" data-max="40" data-step="1" data-value="8">
          <div class="knob"></div><div class="knob-name">DETUNE</div><div class="knob-value"></div>
        </div>
        <div class="knob-control" tabindex="0" role="slider" aria-label="厚み" aria-valuemin="0" aria-valuemax="100" aria-valuenow="55" data-param="thickness" data-min="0" data-max="100" data-step="1" data-value="55">
          <div class="knob"></div><div class="knob-name">THICKNESS</div><div class="knob-value"></div>
        </div>
      </div>
    </section>

    <section class="piano-shell" aria-label="ピアノ">
      <div class="keyboard" id="keyboard">
        <button class="white-key" data-note="C4" data-key="a" aria-label="ド"><span class="note-label">ド</span></button>
        <button class="white-key" data-note="D4" data-key="s" aria-label="レ"><span class="note-label">レ</span></button>
        <button class="white-key" data-note="E4" data-key="d" aria-label="ミ"><span class="note-label">ミ</span></button>
        <button class="white-key" data-note="F4" data-key="f" aria-label="ファ"><span class="note-label">ファ</span></button>
        <button class="white-key" data-note="G4" data-key="g" aria-label="ソ"><span class="note-label">ソ</span></button>
        <button class="white-key" data-note="A4" data-key="h" aria-label="ラ"><span class="note-label">ラ</span></button>
        <button class="white-key" data-note="B4" data-key="j" aria-label="シ"><span class="note-label">シ</span></button>
        <button class="white-key" data-note="C5" data-key="k" aria-label="高いド"><span class="note-label">ド</span></button>
        <button class="white-key" data-note="D5" aria-label="高いレ"><span class="note-label">レ</span></button>
        <button class="white-key" data-note="E5" aria-label="高いミ"><span class="note-label">ミ</span></button>
        <button class="white-key" data-note="F5" aria-label="高いファ"><span class="note-label">ファ</span></button>
        <button class="white-key" data-note="G5" aria-label="高いソ"><span class="note-label">ソ</span></button>
        <button class="white-key" data-note="A5" aria-label="高いラ"><span class="note-label">ラ</span></button>
        <button class="white-key" data-note="B5" aria-label="高いシ"><span class="note-label">シ</span></button>
        <button class="white-key" data-note="C6" aria-label="さらに高いド"><span class="note-label">ド</span></button>

        <button class="black-key k-cs4" data-note="C#4" data-key="w" aria-label="ドのシャープ"></button>
        <button class="black-key k-ds4" data-note="D#4" data-key="e" aria-label="レのシャープ"></button>
        <button class="black-key k-fs4" data-note="F#4" data-key="t" aria-label="ファのシャープ"></button>
        <button class="black-key k-gs4" data-note="G#4" data-key="y" aria-label="ソのシャープ"></button>
        <button class="black-key k-as4" data-note="A#4" data-key="u" aria-label="ラのシャープ"></button>
        <button class="black-key k-cs5" data-note="C#5" aria-label="高いドのシャープ"></button>
        <button class="black-key k-ds5" data-note="D#5" aria-label="高いレのシャープ"></button>
        <button class="black-key k-fs5" data-note="F#5" aria-label="高いファのシャープ"></button>
        <button class="black-key k-gs5" data-note="G#5" aria-label="高いソのシャープ"></button>
        <button class="black-key k-as5" data-note="A#5" aria-label="高いラのシャープ"></button>
      </div>
    </section>

    <div class="status" id="status" aria-live="polite">タップすると おとがでるよ</div>
  </main>

  <script>
    (() => {
      const app = document.getElementById('app');
      const root = document.getElementById('keyboard');
      const status = document.getElementById('status');
      const soundPicker = document.getElementById('sound-picker');
      const synthBack = document.getElementById('synth-back');
      const waveButtons = [...document.querySelectorAll('[data-wave]')];
      const knobControls = [...document.querySelectorAll('.knob-control')];
      const soundButtons = [...soundPicker.querySelectorAll('[data-sound]')];
      const keys = [...root.querySelectorAll('[data-note]')];
      const byKeyboardKey = new Map(keys.filter((el) => el.dataset.key).map((el) => [el.dataset.key, el]));
      const noteIndex = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

      let audioContext = null;
      let master = null;
      let currentSound = 'piano';
      const custom = {
        waveform: 'sawtooth',
        cutoff: 3200,
        resonance: 3.5,
        attack: 0.03,
        release: 0.45,
        detune: 8,
        thickness: 55
      };
      const activeVoices = new Map();
      const pointerNotes = new Map();
      const computerNotes = new Map();

      function frequencyFor(note) {
        const match = note.match(/^([A-G]#?)(\d)$/);
        if (!match) return 440;
        const midi = (Number(match[2]) + 1) * 12 + noteIndex[match[1]];
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function ensureAudio() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) {
            status.textContent = 'このブラウザでは おとをだせません';
            return false;
          }
          audioContext = new AudioCtx();
          master = audioContext.createGain();
          master.gain.value = 0.58;
          master.connect(audioContext.destination);
        }
        if (audioContext.state === 'suspended') audioContext.resume();
        status.textContent = '';
        return true;
      }

      function createOsc(type, frequency, destination, level = 1, detune = 0) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type;
        osc.frequency.value = frequency;
        osc.detune.value = detune;
        gain.gain.value = level;
        osc.connect(gain);
        gain.connect(destination);
        return osc;
      }

      function buildVoice(frequency, now) {
        const output = audioContext.createGain();
        output.connect(master);
        const oscillators = [];
        let release = 0.22;
        let customNodes = null;

        if (currentSound === 'organ') {
          oscillators.push(createOsc('sine', frequency, output, 0.68));
          oscillators.push(createOsc('sine', frequency * 2, output, 0.22));
          oscillators.push(createOsc('sine', frequency * 3, output, 0.10));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.34, now + 0.025);
          output.gain.exponentialRampToValueAtTime(0.27, now + 0.11);
          release = 0.18;
        } else if (currentSound === 'marimba') {
          oscillators.push(createOsc('sine', frequency, output, 0.78));
          oscillators.push(createOsc('sine', frequency * 4, output, 0.11));
          oscillators.push(createOsc('sine', frequency * 7, output, 0.055));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.52, now + 0.008);
          output.gain.exponentialRampToValueAtTime(0.05, now + 0.42);
          output.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);
          release = 0.10;
        } else if (currentSound === 'bell') {
          oscillators.push(createOsc('sine', frequency, output, 0.54));
          oscillators.push(createOsc('sine', frequency * 2.01, output, 0.24));
          oscillators.push(createOsc('sine', frequency * 3.98, output, 0.13));
          oscillators.push(createOsc('sine', frequency * 6.12, output, 0.07));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.42, now + 0.006);
          output.gain.exponentialRampToValueAtTime(0.08, now + 0.55);
          output.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);
          release = 0.35;
        } else if (currentSound === 'custom') {
          const filter = audioContext.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(custom.cutoff, now);
          filter.Q.setValueAtTime(custom.resonance, now);
          filter.connect(output);

          const osc1 = audioContext.createOscillator();
          const osc2 = audioContext.createOscillator();
          const osc1Gain = audioContext.createGain();
          const osc2Gain = audioContext.createGain();

          osc1.type = custom.waveform;
          osc2.type = custom.waveform;
          osc1.frequency.value = frequency;
          osc2.frequency.value = frequency;
          osc1.detune.value = -custom.detune;
          osc2.detune.value = custom.detune;
          osc1Gain.gain.value = 0.50;
          osc2Gain.gain.value = 0.50 * (custom.thickness / 100);

          osc1.connect(osc1Gain);
          osc2.connect(osc2Gain);
          osc1Gain.connect(filter);
          osc2Gain.connect(filter);
          oscillators.push(osc1, osc2);

          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.30, now + Math.max(0.005, custom.attack));
          output.gain.exponentialRampToValueAtTime(0.22, now + Math.max(0.04, custom.attack + 0.12));
          release = custom.release;
          customNodes = { filter, osc1, osc2, osc2Gain };
        } else if (currentSound === 'synth') {
          const filter = audioContext.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(Math.min(7000, frequency * 8), now);
          filter.Q.value = 3.2;
          filter.connect(output);
          oscillators.push(createOsc('sawtooth', frequency, filter, 0.42, -7));
          oscillators.push(createOsc('sawtooth', frequency, filter, 0.42, 7));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.28, now + 0.03);
          output.gain.exponentialRampToValueAtTime(0.18, now + 0.20);
          release = 0.42;
        } else if (currentSound === 'recorder') {
          const filter = audioContext.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(Math.min(5200, frequency * 7), now);
          filter.Q.value = 1.3;
          filter.connect(output);
          oscillators.push(createOsc('sine', frequency, filter, 0.72));
          oscillators.push(createOsc('sine', frequency * 2, filter, 0.15));
          oscillators.push(createOsc('sine', frequency * 3, filter, 0.07));
          oscillators.push(createOsc('triangle', frequency, filter, 0.08, 2));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.25, now + 0.055);
          output.gain.exponentialRampToValueAtTime(0.21, now + 0.18);
          release = 0.16;
        } else if (currentSound === 'violin') {
          const filter = audioContext.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(Math.min(6500, frequency * 9), now);
          filter.Q.value = 1.8;
          filter.connect(output);
          oscillators.push(createOsc('sawtooth', frequency, filter, 0.24, -5));
          oscillators.push(createOsc('sawtooth', frequency, filter, 0.24, 5));
          oscillators.push(createOsc('triangle', frequency * 2, filter, 0.10));
          oscillators.push(createOsc('sine', frequency * 3, filter, 0.045));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.23, now + 0.11);
          output.gain.exponentialRampToValueAtTime(0.19, now + 0.34);
          release = 0.48;
        } else if (currentSound === 'melodica') {
          const filter = audioContext.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(Math.min(5800, frequency * 8), now);
          filter.Q.value = 1.1;
          filter.connect(output);
          oscillators.push(createOsc('square', frequency, filter, 0.18));
          oscillators.push(createOsc('triangle', frequency, filter, 0.42));
          oscillators.push(createOsc('sine', frequency * 2, filter, 0.13));
          oscillators.push(createOsc('sine', frequency * 3, filter, 0.055));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.27, now + 0.045);
          output.gain.exponentialRampToValueAtTime(0.235, now + 0.16);
          release = 0.20;
        } else {
          oscillators.push(createOsc('triangle', frequency, output, 0.78));
          oscillators.push(createOsc('sine', frequency * 2, output, 0.16));
          oscillators.push(createOsc('sine', frequency * 3, output, 0.06));
          output.gain.setValueAtTime(0.0001, now);
          output.gain.exponentialRampToValueAtTime(0.42, now + 0.015);
          output.gain.exponentialRampToValueAtTime(0.18, now + 0.26);
          release = 0.26;
        }

        oscillators.forEach((osc) => osc.start(now));
        return { output, oscillators, release, sound: currentSound, customNodes };
      }

      function startNote(note, token) {
        if (!ensureAudio() || activeVoices.has(token)) return;
        const now = audioContext.currentTime;
        const voice = buildVoice(frequencyFor(note), now);
        activeVoices.set(token, { note, ...voice });
        setKeyActive(note, true);
      }

      function stopNote(token) {
        const voice = activeVoices.get(token);
        if (!voice || !audioContext) return;
        const now = audioContext.currentTime;
        const release = voice.release;

        voice.output.gain.cancelScheduledValues(now);
        voice.output.gain.setValueAtTime(Math.max(voice.output.gain.value, 0.0001), now);
        voice.output.gain.exponentialRampToValueAtTime(0.0001, now + release);
        voice.oscillators.forEach((osc) => {
          try { osc.stop(now + release + 0.04); } catch (_) {}
        });
        activeVoices.delete(token);

        const stillPlaying = [...activeVoices.values()].some((v) => v.note === voice.note);
        if (!stillPlaying) setKeyActive(voice.note, false);
      }

      function stopAllNotes() {
        [...activeVoices.keys()].forEach(stopNote);
        pointerNotes.clear();
        computerNotes.clear();
      }

      function setKeyActive(note, active) {
        const key = keys.find((el) => el.dataset.note === note);
        if (key) key.classList.toggle('is-active', active);
      }

      function formatParam(name, value) {
        if (name === 'cutoff') return Math.round(value) + ' Hz';
        if (name === 'resonance') return Number(value).toFixed(1);
        if (name === 'attack' || name === 'release') return Number(value).toFixed(2) + ' s';
        if (name === 'detune') return Math.round(value) + ' ct';
        if (name === 'thickness') return Math.round(value) + '%';
        return String(value);
      }

      function updateKnob(control, rawValue, updateSound = true) {
        const min = Number(control.dataset.min);
        const max = Number(control.dataset.max);
        const step = Number(control.dataset.step);
        const name = control.dataset.param;
        const value = Math.min(max, Math.max(min, Math.round(rawValue / step) * step));
        const ratio = (value - min) / (max - min);
        const angle = -135 + ratio * 270;
        control.dataset.value = String(value);
        control.setAttribute('aria-valuenow', String(value));
        control.querySelector('.knob').style.setProperty('--angle', angle + 'deg');
        control.querySelector('.knob-value').textContent = formatParam(name, value);
        if (updateSound) {
          custom[name] = value;
          updateActiveCustomVoices();
        }
      }

      function updateActiveCustomVoices() {
        activeVoices.forEach((voice) => {
          if (voice.sound !== 'custom' || !voice.customNodes) return;
          const nodes = voice.customNodes;
          const now = audioContext ? audioContext.currentTime : 0;
          nodes.filter.frequency.setTargetAtTime(custom.cutoff, now, 0.02);
          nodes.filter.Q.setTargetAtTime(custom.resonance, now, 0.02);
          nodes.osc1.type = custom.waveform;
          nodes.osc2.type = custom.waveform;
          nodes.osc1.detune.setTargetAtTime(-custom.detune, now, 0.02);
          nodes.osc2.detune.setTargetAtTime(custom.detune, now, 0.02);
          nodes.osc2Gain.gain.setTargetAtTime(0.50 * (custom.thickness / 100), now, 0.02);
        });
      }

      knobControls.forEach((control) => {
        updateKnob(control, Number(control.dataset.value), false);
        let startY = 0;
        let startValue = 0;

        control.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          startY = event.clientY;
          startValue = Number(control.dataset.value);
          control.setPointerCapture?.(event.pointerId);
        });

        control.addEventListener('pointermove', (event) => {
          if (!control.hasPointerCapture?.(event.pointerId)) return;
          const min = Number(control.dataset.min);
          const max = Number(control.dataset.max);
          const delta = (startY - event.clientY) / 130;
          updateKnob(control, startValue + delta * (max - min));
        });

        control.addEventListener('keydown', (event) => {
          if (!['ArrowUp', 'ArrowRight', 'ArrowDown', 'ArrowLeft'].includes(event.key)) return;
          event.preventDefault();
          const direction = (event.key === 'ArrowUp' || event.key === 'ArrowRight') ? 1 : -1;
          updateKnob(control, Number(control.dataset.value) + direction * Number(control.dataset.step));
        });
      });

      waveButtons.forEach((button) => {
        button.addEventListener('click', () => {
          custom.waveform = button.dataset.wave;
          waveButtons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
          updateActiveCustomVoices();
        });
      });

      function selectSound(sound) {
        stopAllNotes();
        currentSound = sound;
        app.classList.toggle('is-custom', sound === 'custom');
        soundButtons.forEach((item) => item.setAttribute('aria-pressed', String(item.dataset.sound === sound)));
        const button = soundButtons.find((item) => item.dataset.sound === sound);
        if (button) status.textContent = button.textContent.trim() + ' のおと';
      }

      synthBack.addEventListener('click', () => selectSound('synth'));

      soundPicker.addEventListener('click', (event) => {
        const button = event.target.closest('[data-sound]');
        if (!button || button.dataset.sound === currentSound) return;
        selectSound(button.dataset.sound);
      });

      keys.forEach((key) => {
        key.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          const token = 'p:' + event.pointerId;
          pointerNotes.set(event.pointerId, token);
          key.setPointerCapture?.(event.pointerId);
          startNote(key.dataset.note, token);
        });

        const finish = (event) => {
          const token = pointerNotes.get(event.pointerId);
          if (!token) return;
          stopNote(token);
          pointerNotes.delete(event.pointerId);
        };

        key.addEventListener('pointerup', finish);
        key.addEventListener('pointercancel', finish);
        key.addEventListener('lostpointercapture', finish);
      });

      window.addEventListener('keydown', (event) => {
        if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
        const name = event.key.toLowerCase();
        const key = byKeyboardKey.get(name);
        if (!key || computerNotes.has(name)) return;
        event.preventDefault();
        const token = 'k:' + name;
        computerNotes.set(name, token);
        startNote(key.dataset.note, token);
      });

      window.addEventListener('keyup', (event) => {
        const name = event.key.toLowerCase();
        const token = computerNotes.get(name);
        if (!token) return;
        stopNote(token);
        computerNotes.delete(name);
      });

      window.addEventListener('blur', stopAllNotes);
    })();
  </script>
</body>
</html>
