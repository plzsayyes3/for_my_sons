<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee6">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Merge Block</title>
  <link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="icon-button" href="../" aria-label="For My Sonsにもどる">‹</a>
      <div class="title-wrap">
        <p class="eyebrow">FOR MY SONS</p>
        <h1>Merge Block</h1>
      </div>
      <button class="icon-button" id="new-game" type="button" aria-label="ゲームを設定してやり直す">↻</button>
    </header>

    <main class="game-layout">
      <section class="side-panel info-panel" aria-label="ゲーム情報">
        <div class="difficulty" role="group" aria-label="むずかしさ">
          <button type="button" data-level="easy" class="is-active"><strong>やさしい</strong><small>3色</small></button>
          <button type="button" data-level="normal"><strong>ふつう</strong><small>4色</small></button>
          <button type="button" data-level="hard"><strong>むずかしい</strong><small>5色</small></button>
          <button type="button" data-level="extreme"><strong>超むずかしい</strong><small>6色</small></button>
        </div>

        <div class="stats">
          <div class="score-stat"><span>SCORE</span><strong id="score">0</strong></div>
          <div class="best-stat"><span>BEST</span><strong id="best-score">0</strong></div>
          <div class="chain-stat"><span>CHAIN</span><strong id="chain">—</strong></div>
        </div>

        <div class="piece-card next-card">
          <span>NEXT</span>
          <div class="piece-preview" id="next-preview" aria-label="つぎのブロック"></div>
        </div>
      </section>

      <section class="board-column" aria-label="ゲームばん">
        <div class="incoming-label">
          <span>ここから落ちる</span>
          <b>↓</b>
        </div>

        <div class="board-wrap" id="board-wrap">
          <div class="incoming-piece" id="incoming-piece" aria-label="いまのブロック"></div>
          <div class="board-frame" id="board-frame">
            <div id="board" class="board" role="grid" aria-label="Merge Block 9かける9"></div>
          </div>
        </div>

        <p class="board-hint" id="game-status" aria-live="polite">
          盤面を回して、ブロックを中心の重力へ落とそう。
        </p>
      </section>

      <section class="side-panel control-panel" aria-label="コントローラー">
        <div class="piece-card current-card">
          <span>NOW</span>
          <div class="piece-preview" id="current-preview" aria-label="いまのブロック"></div>
        </div>

        <div class="control-group">
          <span class="control-title">盤面を回す</span>
          <div class="two-buttons">
            <button type="button" id="board-left" aria-label="盤面を左に回す"><b>↶</b><small>BOARD</small></button>
            <button type="button" id="board-right" aria-label="盤面を右に回す"><b>↷</b><small>BOARD</small></button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-title">落とす場所</span>
          <div class="move-controls">
            <button type="button" id="move-left" aria-label="ブロックを左へ">←</button>
            <button type="button" id="drop"><small>ここへ</small><strong>DROP</strong></button>
            <button type="button" id="move-right" aria-label="ブロックを右へ">→</button>
          </div>
        </div>

        <p class="rule-note">
          ブロックはいつも上から落ちる。中心線まで来たら中心へ横移動する。2〜3個は別々に重力へ従い、確定後は盤面を回しても崩れない。同じ色が4個以上つながると消える。
        </p>
      </section>
    </main>
  </div>


  <div class="setup-overlay" id="setup-overlay" aria-hidden="true">
    <section class="setup-card" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <p>NEW GAME</p>
      <h2 id="setup-title">むずかしさ</h2>
      <div class="setup-levels" role="group" aria-label="新しいゲームのむずかしさ">
        <button type="button" data-level="easy"><strong>やさしい</strong><small>3色</small></button>
        <button type="button" data-level="normal"><strong>ふつう</strong><small>4色</small></button>
        <button type="button" data-level="hard"><strong>むずかしい</strong><small>5色</small></button>
        <button type="button" data-level="extreme"><strong>超むずかしい</strong><small>6色</small></button>
      </div>
      <button class="setup-cancel" id="setup-cancel" type="button">もどる</button>
    </section>
  </div>

  <div class="game-over" id="game-over" aria-hidden="true">
    <section class="game-over-card" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <p>MERGE BLOCK</p>
      <h2 id="game-over-title">置けない！</h2>
      <span>4方向すべてに置ける場所がなくなったよ。</span>
      <div class="final-score"><small>SCORE</small><strong id="final-score">0</strong></div>
      <button type="button" id="play-again">もういちど</button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=4" defer></script>
</body>
</html>
