<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>こうかおん | For My Sons</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #28313b;
      --muted: #6d7782;
      --paper: #fffaf0;
      --card: #ffffff;
      --line: #eadfca;
      --accent: #ff8a5b;
      --rec: #e94848;
      --shadow: 0 8px 22px rgba(79, 63, 38, .12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    body { min-height: 100dvh; overscroll-behavior: none; }
    button, a { font: inherit; }
    .app {
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
    }
    header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
    .back {
      min-width: 46px; min-height: 46px; border: 1px solid var(--line); border-radius: 15px;
      background: var(--card); color: var(--ink); text-decoration: none; display: grid; place-items: center;
      box-shadow: var(--shadow); font-weight: 900;
    }
    h1 { margin: 0; text-align: center; font-size: clamp(24px, 6vw, 34px); letter-spacing: .05em; }
    .limit {
      min-width: 46px; min-height: 46px; border-radius: 15px; display: grid; place-items: center;
      background: #ffe4d6; color: #a33e1b; font-weight: 900; font-size: 13px;
    }
    .guide {
      margin: 0; min-height: 30px; text-align: center; color: var(--muted); font-weight: 800; font-size: 14px;
    }
    .guide strong { color: var(--rec); }
    .pads {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(96px, 1fr));
      gap: 10px;
    }
    .pad {
      position: relative;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
      color: var(--ink);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      cursor: pointer;
    }
    .pad:active { transform: scale(.985); }
    .pad.has-audio { border-color: #a9d8cd; background: #f2fffb; }
    .pad.playing { border-color: #57b49d; box-shadow: 0 0 0 4px rgba(87,180,157,.16), var(--shadow); }
    .pad.recording { border-color: var(--rec); background: #fff1f1; box-shadow: 0 0 0 4px rgba(233,72,72,.14), var(--shadow); }
    .number { font-size: clamp(34px, 10vw, 52px); line-height: 1; font-weight: 950; }
    .state { font-size: 13px; font-weight: 850; color: var(--muted); }
    .has-audio .state { color: #287c68; }
    .recording .state { color: var(--rec); }
    .bar { position: absolute; inset: auto 0 0; height: 6px; background: transparent; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--rec); transform-origin: left center; }
    .mic-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: currentColor; margin-right: 5px; }
    .recording .mic-dot { animation: pulse .7s ease-in-out infinite alternate; }
    @keyframes pulse { to { opacity: .25; transform: scale(.7); } }
    .toast {
      position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
      transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
      background: rgba(31,37,43,.92); color: #fff; border-radius: 999px;
      padding: 10px 16px; font-weight: 800; font-size: 14px; transition: .2s ease;
      z-index: 20; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-height: 650px) {
      .app { gap: 7px; }
      .pads { grid-template-rows: repeat(4, minmax(76px, 1fr)); gap: 7px; }
      .pad { border-radius: 18px; }
      .number { font-size: 34px; }
      .state { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <a class="back" href="../" aria-label="ホームにもどる">←</a>
      <h1>こうかおん</h1>
      <div class="limit">5秒</div>
    </header>
    <p id="guide" class="guide">からのボタンはタップでろくおん。ろくおんずみはタップでさいせい、<strong>なが押しでろくり直し</strong>。</p>
    <section id="pads" class="pads" aria-label="8このこうかおんボタン"></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    'use strict';

    const SLOT_COUNT = 8;
    const MAX_MS = 5000;
    const LONG_PRESS_MS = 650;
    const DB_NAME = 'for-my-sons-sound-pad-v1';
    const STORE_NAME = 'clips';

    const padsRoot = document.getElementById('pads');
    const guide = document.getElementById('guide');
    const toast = document.getElementById('toast');

    let db = null;
    let recorder = null;
    let stream = null;
    let chunks = [];
    let recordingSlot = null;
    let recordingStartedAt = 0;
    let autoStopTimer = 0;
    let frame = 0;
    let currentAudio = null;
    let currentPlayingSlot = null;
    let suppressClickSlot = null;
    const clips = new Map();
    const urls = new Map();
    const padEls = new Map();
    const longPressTimers = new Map();

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          const nextDb = request.result;
          if (!nextDb.objectStoreNames.contains(STORE_NAME)) {
            nextDb.createObjectStore(STORE_NAME, { keyPath: 'slot' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function readAllClips() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    function saveClip(slot, blob) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ slot, blob, updatedAt: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    function padMarkup(slot) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'pad';
      button.dataset.slot = String(slot);
      button.setAttribute('aria-label', slot + 'ばん。タップでろくおん');
      button.innerHTML =
        '<span class="number">' + slot + '</span>' +
        '<span class="state"><span class="mic-dot"></span><span class="state-text">ろくおん</span></span>' +
        '<span class="bar"><span></span></span>';
      return button;
    }

    function setPadState(slot) {
      const pad = padEls.get(slot);
      if (!pad) return;
      const state = pad.querySelector('.state-text');
      const hasAudio = clips.has(slot);
      const isRecording = recordingSlot === slot;
      const isPlaying = currentPlayingSlot === slot;

      pad.classList.toggle('has-audio', hasAudio && !isRecording);
      pad.classList.toggle('recording', isRecording);
      pad.classList.toggle('playing', isPlaying);
      if (isRecording) {
        state.textContent = 'REC 5.0';
        pad.setAttribute('aria-label', slot + 'ばん。ろくおん中。タップで停止');
      } else if (isPlaying) {
        state.textContent = 'さいせい中';
        pad.setAttribute('aria-label', slot + 'ばん。さいせい中');
      } else if (hasAudio) {
        state.textContent = '▶ さいせい';
        pad.setAttribute('aria-label', slot + 'ばん。タップでさいせい。なが押しでろくり直し');
      } else {
        state.textContent = 'ろくおん';
        pad.setAttribute('aria-label', slot + 'ばん。タップでろくおん');
      }
    }

    function refreshPads() {
      for (let slot = 1; slot <= SLOT_COUNT; slot += 1) setPadState(slot);
    }

    function getMimeType() {
      if (!window.MediaRecorder) return '';
      const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
      return candidates.find(type => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) || '';
    }

    function stopTracks() {
      if (!stream) return;
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    function stopPlayback() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      const old = currentPlayingSlot;
      currentPlayingSlot = null;
      if (old) setPadState(old);
    }

    async function playSlot(slot) {
      if (recordingSlot !== null) return;
      const record = clips.get(slot);
      if (!record || !record.blob) return;

      stopPlayback();
      let url = urls.get(slot);
      if (!url) {
        url = URL.createObjectURL(record.blob);
        urls.set(slot, url);
      }

      const audio = new Audio(url);
      currentAudio = audio;
      currentPlayingSlot = slot;
      setPadState(slot);
      audio.onended = () => {
        currentAudio = null;
        currentPlayingSlot = null;
        setPadState(slot);
      };
      audio.onerror = () => {
        currentAudio = null;
        currentPlayingSlot = null;
        setPadState(slot);
        showToast('さいせいできませんでした');
      };

      try {
        await audio.play();
      } catch (_) {
        currentAudio = null;
        currentPlayingSlot = null;
        setPadState(slot);
        showToast('もういちどタップしてね');
      }
    }

    function updateRecordingUi() {
      if (recordingSlot === null) return;
      const elapsed = Math.min(MAX_MS, performance.now() - recordingStartedAt);
      const remaining = Math.max(0, MAX_MS - elapsed);
      const pad = padEls.get(recordingSlot);
      if (pad) {
        pad.querySelector('.state-text').textContent = 'REC ' + (remaining / 1000).toFixed(1);
        pad.querySelector('.bar > span').style.width = ((elapsed / MAX_MS) * 100) + '%';
      }
      if (elapsed < MAX_MS) frame = requestAnimationFrame(updateRecordingUi);
    }

    async function startRecording(slot) {
      if (recordingSlot !== null) return;
      stopPlayback();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        showToast('このブラウザではろくおんできません');
        return;
      }

      try {
        guide.innerHTML = '<strong>マイクをつかいます</strong>。はじめてのときは「許可」をえらんでね。';
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = getMimeType();
        recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        chunks = [];
        recordingSlot = slot;
        recordingStartedAt = performance.now();

        recorder.ondataavailable = event => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        };
        recorder.onerror = () => {
          showToast('ろくおんでエラーがおきました');
          finishRecording(false);
        };
        recorder.onstop = async () => {
          const finishedSlot = recordingSlot;
          const type = recorder && recorder.mimeType ? recorder.mimeType : (mimeType || 'audio/mp4');
          const blob = new Blob(chunks, { type });
          cancelAnimationFrame(frame);
          clearTimeout(autoStopTimer);
          stopTracks();
          recorder = null;
          chunks = [];
          recordingSlot = null;

          if (finishedSlot && blob.size > 0) {
            try {
              await saveClip(finishedSlot, blob);
              const oldUrl = urls.get(finishedSlot);
              if (oldUrl) URL.revokeObjectURL(oldUrl);
              urls.delete(finishedSlot);
              clips.set(finishedSlot, { slot: finishedSlot, blob });
              showToast(finishedSlot + 'ばんにほぞんしたよ');
            } catch (_) {
              showToast('ほぞんできませんでした');
            }
          }
          guide.innerHTML = 'からのボタンはタップでろくおん。ろくおんずみはタップでさいせい、<strong>なが押しでろくり直し</strong>。';
          refreshPads();
          for (const pad of padEls.values()) {
            pad.querySelector('.bar > span').style.width = '0';
          }
        };

        recorder.start();
        refreshPads();
        updateRecordingUi();
        autoStopTimer = setTimeout(stopRecording, MAX_MS);
      } catch (error) {
        stopTracks();
        recorder = null;
        recordingSlot = null;
        refreshPads();
        guide.innerHTML = 'マイクがつかえません。Safariの設定で、このページの<strong>マイクを許可</strong>してね。';
        showToast('マイクをつかえませんでした');
      }
    }

    function stopRecording() {
      if (!recorder || recorder.state === 'inactive') return;
      try { recorder.stop(); } catch (_) {}
    }

    function finishRecording(save) {
      if (!save) chunks = [];
      stopRecording();
    }

    function handlePadClick(slot) {
      if (suppressClickSlot === slot) {
        suppressClickSlot = null;
        return;
      }
      if (recordingSlot !== null) {
        if (recordingSlot === slot) stopRecording();
        return;
      }
      if (clips.has(slot)) playSlot(slot);
      else startRecording(slot);
    }

    function cancelLongPress(slot) {
      const timer = longPressTimers.get(slot);
      if (timer) clearTimeout(timer);
      longPressTimers.delete(slot);
    }

    function armLongPress(slot) {
      cancelLongPress(slot);
      if (!clips.has(slot) || recordingSlot !== null) return;
      const timer = setTimeout(() => {
        longPressTimers.delete(slot);
        suppressClickSlot = slot;
        if (navigator.vibrate) navigator.vibrate(35);
        startRecording(slot);
      }, LONG_PRESS_MS);
      longPressTimers.set(slot, timer);
    }

    async function init() {
      for (let slot = 1; slot <= SLOT_COUNT; slot += 1) {
        const pad = padMarkup(slot);
        padEls.set(slot, pad);
        padsRoot.appendChild(pad);

        pad.addEventListener('click', () => handlePadClick(slot));
        pad.addEventListener('pointerdown', () => armLongPress(slot));
        pad.addEventListener('pointerup', () => cancelLongPress(slot));
        pad.addEventListener('pointercancel', () => cancelLongPress(slot));
        pad.addEventListener('pointerleave', () => cancelLongPress(slot));
        pad.addEventListener('contextmenu', event => event.preventDefault());
      }

      try {
        db = await openDb();
        const saved = await readAllClips();
        saved.forEach(item => {
          if (item && item.slot && item.blob) clips.set(item.slot, item);
        });
      } catch (_) {
        showToast('ほぞん機能をひらけませんでした');
      }
      refreshPads();
    }

    window.addEventListener('pagehide', () => {
      stopPlayback();
      stopTracks();
      for (const url of urls.values()) URL.revokeObjectURL(url);
    });

    init();
  })();
  </script>
</body>
</html>
