<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9ecbd8">
  <meta name="color-scheme" content="light">
  <title>ゲーム要望 | For My Sons</title>
  <link rel="stylesheet" href="../styles.css?v=4">
  <link rel="stylesheet" href="../shared/for-my-sons.css?v=3">
  <link rel="stylesheet" href="./requests.css?v=1">
</head>
<body>
  <main class="requests-screen">
    <header class="requests-hero">
      <a class="requests-back" href="../">← ホーム</a>
      <div>
        <p class="eyebrow">PAPA INBOX</p>
        <h1>ゲーム要望</h1>
        <p class="requests-copy">子どもたちから届いたゲームのアイデアや「パパにお願い」を確認します。</p>
      </div>
      <div class="requests-profile">
        <span id="current-profile-indicator">プレイヤー: 未設定</span>
        <button id="parent-settings-button" type="button">⚙️ おうちの人設定</button>
      </div>
    </header>
    <section id="parent-request-history" class="papa-history requests-history" aria-label="ゲーム要望一覧"></section>
  </main>
  <aside id="parent-settings-panel" class="parent-settings-panel" hidden></aside>

  <script src="../shared/for-my-sons-db.js?v=4"></script>
  <script src="../shared/profile-manager.js?v=2"></script>
  <script src="../shared/parent-lock.js?v=3"></script>
  <script src="../shared/save-store.js?v=2"></script>
  <script src="../shared/github-sync.js?v=9"></script>
  <script src="../shared/character-requests.js?v=5"></script>
  <script src="../shared/parent-requests.js?v=4"></script>
  <script src="../shared/for-my-sons.js?v=13"></script>
  <script src="../shared/settings-view.js?v=6"></script>
  <script src="../shared/parent-history-view.js?v=3"></script>
  <script src="./requests.js?v=1" defer></script>
</body>
</html>
