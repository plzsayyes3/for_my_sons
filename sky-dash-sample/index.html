<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#59c7ff">
<title>Sky Dash Sample</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#66cfff;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:#fff;font-weight:950;text-shadow:0 2px 4px rgba(14,64,139,.85)}
.panel{position:absolute;background:linear-gradient(180deg,rgba(38,132,236,.96),rgba(19,73,171,.96));border:3px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 6px 0 rgba(0,55,140,.28),0 10px 24px rgba(0,65,150,.18);padding:9px 13px}
#speed{top:max(12px,env(safe-area-inset-top));left:12px;font-size:17px}
#distance{top:max(12px,env(safe-area-inset-top));right:12px;text-align:center;font-size:11px;letter-spacing:.04em}
#distance b{display:block;color:#ffe05d;font-size:23px;line-height:1.05;margin-top:2px}
#stars{left:12px;top:78px;font-size:16px}
#score{right:12px;top:78px;font-size:16px}
#score b{color:#ffe05d}
#scorePop{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%) scale(.8);font-size:34px;font-weight:1000;opacity:0;transition:.18s;text-shadow:0 3px 6px rgba(0,0,0,.22)}
#scorePop.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#scorePop.plus{color:#71ff9c}
#scorePop.minus{color:#ff7d72}
#stageInfo{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;min-width:128px;padding:7px 12px}
#stageInfo b{display:block;font-size:16px;line-height:1.05}
#stageInfo small{font-size:10px;opacity:.9}
#progressBox{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(36vw,330px);height:13px;background:#153f96;border:2px solid #fff;border-radius:99px;overflow:hidden}
#progress{height:100%;width:0;background:linear-gradient(90deg,#63f1ff,#fff05d)}
#clearLayer{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.96);transition:.2s}
#clearLayer.show{opacity:1;transform:scale(1)}
.clearCard{min-width:min(78vw,360px);padding:22px 28px;text-align:center;border-radius:28px;background:rgba(255,255,255,.96);border:5px solid #ffe05c;box-shadow:0 18px 50px rgba(0,55,140,.3);color:#1556aa;text-shadow:none}
.clearCard .pref{font-size:20px;font-weight:950}
.clearCard strong{display:block;font-size:44px;line-height:1;color:#ffac22;margin:8px 0}
.clearScore{font-size:30px;font-weight:1000;color:#1556aa;margin:6px 0}
.clearScore span{color:#ffac22}
.clearStars{font-size:24px;letter-spacing:4px;min-height:30px;margin-bottom:6px}
.clearReward{margin:8px auto 10px;padding:10px 12px;border-radius:16px;background:#fff7d6;color:#54709c;font-size:14px;font-weight:900;line-height:1.35}
.clearReward span,.clearReward b,.clearReward strong,.clearReward small{display:block}
.clearReward b{color:#1556aa;font-size:16px;margin-top:3px}
.clearReward strong{color:#ff9e1d;font-size:23px;margin-top:2px}
.clearReward small{font-size:12px;margin-top:4px}
.clearCard p{margin:0;font-size:16px;font-weight:900;color:#54709c}
.clearActions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
.clearAction{pointer-events:auto;border:0;border-radius:999px;padding:14px 18px;font-size:18px;font-weight:1000}
#continueBtn{background:linear-gradient(#ffe66a,#ffb52d);color:#174c85;box-shadow:0 5px 0 #c88400}
#quitBtn{background:#e9eef6;color:#53657f;box-shadow:0 5px 0 #c5cedc}
#countdown{min-height:22px;margin-top:12px;font-size:17px;font-weight:1000;color:#1556aa}
#boost{position:absolute;top:23%;left:50%;transform:translate(-50%,-50%) scale(.75);font-size:38px;color:#fff35c;opacity:0;transition:.12s}
#boost.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.controls{position:fixed;inset:0;z-index:10;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border:4px solid #fff;color:#fff;font-weight:1000;text-shadow:0 2px 3px #15549a;box-shadow:0 7px 0 rgba(0,70,155,.42),0 10px 24px rgba(0,83,183,.18);touch-action:none;user-select:none}
.move{top:50%;transform:translateY(-50%);width:78px;height:78px;border-radius:50%;font-size:39px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 28%,#87dcff,#238bf2 72%)}
#left{left:max(14px,env(safe-area-inset-left))}
#right{right:max(14px,env(safe-area-inset-right))}
#jump{left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;font-size:17px;line-height:1.05;background:radial-gradient(circle at 35% 28%,#ffed68,#ff9b21 70%);text-shadow:0 2px 2px #a95200;box-shadow:0 7px 0 rgba(180,89,0,.5),0 12px 28px rgba(255,137,0,.25)}
#jump span{display:block;font-size:35px;margin-bottom:2px}
#startLayer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(rgba(73,184,255,.12),rgba(11,53,134,.42))}
.card{width:min(500px,90vw);background:rgba(247,253,255,.97);color:#174b8e;border-radius:28px;padding:25px;text-align:center;box-shadow:0 24px 70px rgba(0,44,105,.35)}
.card h1{margin:0;font-size:42px;color:#1971cd;letter-spacing:-.03em}
.card p{font-weight:850;line-height:1.55;color:#54709c}
#run{border:0;border-radius:999px;padding:15px 35px;background:linear-gradient(#fff17a,#ffb927);color:#174c85;font-size:22px;font-weight:1000;box-shadow:0 7px 0 #c98800}
.startActions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
#shopOpen{border:0;border-radius:999px;padding:13px 24px;background:#e8f5ff;color:#1556aa;font-size:18px;font-weight:1000;box-shadow:0 5px 0 #b9d6e9}
.startWallet{margin-top:12px;font-size:14px;font-weight:950;color:#59779b}
#itemButton{left:max(16px,env(safe-area-inset-left));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 126px);min-width:98px;height:58px;border-radius:20px;background:linear-gradient(#82e6ff,#328dde);font-size:12px;padding:7px 10px;line-height:1.1}
#itemButton b{display:block;font-size:16px;margin-top:2px}
#itemButton:disabled{opacity:.82}
#shopLayer{position:fixed;inset:0;z-index:35;background:linear-gradient(180deg,#dff5ff,#f8fdff);color:#174b8e;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden;touch-action:pan-y}
#shopLayer[hidden]{display:none}
.shopShell{height:100%;max-width:920px;margin:0 auto;display:grid;grid-template-rows:auto 1fr;background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:26px;box-shadow:0 20px 55px rgba(21,86,145,.22);overflow:hidden}
.shopHeader{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid #d7ebf8;background:#f7fcff}
.shopHeader h2{margin:0;flex:1;font-size:24px}
.shopBalance{font-size:17px;font-weight:1000;color:#f39b22;white-space:nowrap}
#shopClose{border:0;border-radius:999px;background:#e9f1f8;color:#45647e;padding:10px 15px;font-weight:950}
.shopBody{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px}
.shopSection{margin-bottom:24px}
.shopSection h3{margin:0 0 10px;font-size:18px}
.shopGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shopCard{min-width:0;border:2px solid #dcecf7;border-radius:20px;background:#fff;padding:12px;display:grid;grid-template-columns:42px 1fr;gap:9px;box-shadow:0 4px 12px rgba(23,87,140,.08)}
.shopCard.placeholder{background:#f4f7fa;border-style:dashed}
.shopIcon{width:42px;height:42px;border-radius:14px;background:#eaf7ff;display:flex;align-items:center;justify-content:center;font-size:25px}
.shopCard h4{margin:0;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.shopCard p{margin:5px 0 8px;color:#617a98;font-size:12px;font-weight:750;line-height:1.4}
.shopMeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:950}
.shopActions{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.shopBuy,.shopEquip{flex:1;border:0;border-radius:14px;padding:10px 8px;font-weight:1000;font-size:13px}
.shopBuy{background:#ffdb58;color:#174b8e}
.shopBuy:disabled{background:#e5ebf1;color:#8493a2}
.shopEquip{background:#dff5ff;color:#17629a}
.shopEquip.equipped{background:#dff7df;color:#287343}
#shopStatus{min-height:22px;margin:0 0 10px;font-size:13px;font-weight:900;color:#587597}
#status{min-height:22px;margin-top:14px;font-size:13px;font-weight:800;color:#61799b}
#error{position:fixed;z-index:40;left:12px;right:12px;bottom:12px;display:none;background:#7b1730;color:#fff;border-radius:14px;padding:12px;font:700 12px/1.4 system-ui}

/* Pattern 1 "Pop Sky" + Pattern 2 "Adventure Badge" */
:root{--stage-accent:#ff665e;--hud-blue:#176db5;--hud-deep:#0d4f91;--cream:#fffdf4}
html,body{-webkit-text-size-adjust:100%}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(235,247,255,.94));border:2px solid rgba(255,255,255,.98);border-radius:18px;box-shadow:0 5px 0 rgba(16,87,151,.18),0 10px 22px rgba(26,88,145,.17);color:var(--hud-deep);text-shadow:none}
#speed{border-left:5px solid #42c8ff}
#distance{border-right:5px solid #ffd84d}
#distance b{color:#f39b22}
#stageInfo{border-bottom:4px solid var(--stage-accent);box-shadow:0 5px 0 rgba(16,87,151,.18),0 10px 22px rgba(26,88,145,.17)}
#progressBox{background:rgba(16,72,127,.32);border:2px solid rgba(255,255,255,.94);box-shadow:0 3px 10px rgba(25,72,126,.15)}
#progress{background:linear-gradient(90deg,var(--stage-accent),#ffe467 72%,#fff9bf)}
#stars,#score{color:var(--hud-deep)}
#score b{color:#f39b22}
.btn{border:4px solid rgba(255,255,255,.98);box-shadow:0 7px 0 rgba(10,79,145,.26),0 12px 24px rgba(21,91,153,.16)}
.move{background:radial-gradient(circle at 35% 28%,#99e5ff,#318eea 72%)}
#jump{background:radial-gradient(circle at 35% 28%,#fff39a,#ffae35 72%);box-shadow:0 7px 0 rgba(190,104,10,.42),0 12px 28px rgba(255,155,33,.22)}
.card{border:4px solid rgba(255,255,255,.9);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(243,250,255,.97));box-shadow:0 22px 60px rgba(16,72,125,.26)}
.card h1::before{content:"JAPAN RUN · 47 STAGES";display:block;margin-bottom:6px;font-size:11px;letter-spacing:.18em;color:#6b86a6}
#run{border:2px solid #fff7c5}
.clearCard{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(250,253,255,.98));border:4px solid #ffe166;box-shadow:0 18px 46px rgba(12,69,122,.25)}
#boost{font-size:34px;letter-spacing:.06em;text-shadow:0 0 8px #32dfff,0 0 18px #387bff}
body.boosting #progress{background:linear-gradient(90deg,#35efff,#7a7bff,#ff5fd2,#fff45e)}
body.boosting .panel{box-shadow:0 0 0 2px rgba(102,242,255,.36),0 0 18px rgba(83,137,255,.34)}
#clearLayer.neon-clear .clearCard{box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 24px rgba(64,225,255,.62),0 0 46px rgba(255,91,206,.28)}
#clearLayer.neon-clear .clearStars{text-shadow:0 0 10px #66e7ff,0 0 16px #ff76d5}
@media(min-width:701px) and (max-width:1100px){
 .move{width:82px;height:82px}
 #jump{width:112px;height:112px}
 #progressBox{width:min(42vw,360px)}
}

@media(max-width:700px){
 .shopGrid{grid-template-columns:1fr}
 .shopBody{padding:12px}
 .shopHeader{padding:12px}
 .shopHeader h2{font-size:20px}
 .shopBalance{font-size:15px}
 #speed{top:max(10px,env(safe-area-inset-top));left:10px;font-size:13px;padding:7px 9px;white-space:nowrap}
 #distance{top:max(10px,env(safe-area-inset-top));right:10px;padding:6px 9px;min-width:84px}
 #distance b{font-size:19px}
 #stageInfo{top:calc(max(10px,env(safe-area-inset-top)) + 52px);left:50%;min-width:132px;padding:6px 12px}
 #stageInfo b{font-size:15px}
 #stageInfo small{font-size:9px}
 #stars{top:calc(max(10px,env(safe-area-inset-top)) + 96px);left:10px;font-size:13px;padding:6px 9px}
 #score{top:calc(max(10px,env(safe-area-inset-top)) + 96px);right:10px;font-size:13px;padding:6px 9px}
 #progressBox{top:calc(max(10px,env(safe-area-inset-top)) + 138px);width:calc(100% - 92px);max-width:330px;height:11px}
 #scorePop{top:35%;font-size:30px}
 .move{width:72px;height:72px;font-size:36px}
 #jump{width:108px;height:108px}
}
@media(max-width:380px){
 #speed{font-size:12px;padding:6px 8px}
 #distance{min-width:78px;padding:5px 8px}
 #distance b{font-size:17px}
 #stageInfo{top:calc(max(10px,env(safe-area-inset-top)) + 48px);min-width:124px;padding:5px 10px}
 #stars,#score{top:calc(max(10px,env(safe-area-inset-top)) + 88px);font-size:12px;padding:5px 8px}
 #progressBox{top:calc(max(10px,env(safe-area-inset-top)) + 126px);width:calc(100% - 70px)}
}
@media(orientation:landscape){
 #itemButton{left:auto;right:max(132px,calc(env(safe-area-inset-right) + 116px));bottom:max(24px,env(safe-area-inset-bottom));height:54px}
 .move{top:auto;bottom:max(24px,env(safe-area-inset-bottom));transform:none}
 #left{left:max(20px,env(safe-area-inset-left))}
 #right{left:calc(env(safe-area-inset-left) + 104px);right:auto}
 #jump{left:auto;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));transform:none;width:98px;height:98px}
 #stageInfo{top:max(14px,env(safe-area-inset-top))}
 #progressBox{top:max(54px,calc(env(safe-area-inset-top) + 40px))}
 #stars{top:auto;bottom:max(128px,calc(env(safe-area-inset-bottom) + 110px))}
 #score{top:auto;right:max(128px,calc(env(safe-area-inset-right) + 110px));bottom:max(128px,calc(env(safe-area-inset-bottom) + 110px))}
}
@media(max-height:500px) and (orientation:landscape){
 .move{width:66px;height:66px;bottom:max(14px,env(safe-area-inset-bottom))}
 #left{left:max(16px,env(safe-area-inset-left))}
 #right{left:calc(env(safe-area-inset-left) + 88px)}
 #jump{width:82px;height:82px;right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font-size:13px}
 #jump span{font-size:26px}
 #stageInfo{top:max(8px,env(safe-area-inset-top))}
 #progressBox{top:max(48px,calc(env(safe-area-inset-top) + 36px))}
 #stars{bottom:max(98px,calc(env(safe-area-inset-bottom) + 86px))}
 #score{right:max(108px,calc(env(safe-area-inset-right) + 94px));bottom:max(98px,calc(env(safe-area-inset-bottom) + 86px))}
}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="panel" id="speed">⚡ Speed Lv <b id="level">1</b></div>
  <div class="panel" id="distance">GOALまで<b id="meters">500m</b></div>
  <div class="panel" id="stageInfo"><b id="prefecture">東京都</b><small id="stageNo">1 / 47</small></div>
  <div id="progressBox"><div id="progress"></div></div>
  <div class="panel" id="stars">⭐ <span id="starCount">0</span></div>
  <div class="panel" id="score">SCORE <b id="scoreValue">100</b></div>
  <div id="scorePop"></div>
  <div id="boost">BOOST!</div>
</div>
<div class="controls">
  <button class="btn move" id="left" aria-label="左へ">←</button>
  <button class="btn move" id="right" aria-label="右へ">→</button>
  <button class="btn" id="jump" aria-label="ジャンプ"><span>↑</span>JUMP</button>
  <button class="btn" id="itemButton" type="button" hidden aria-label="お助けアイテム">ITEM<b>--</b></button>
</div>
<div id="clearLayer" aria-live="polite">
  <div class="clearCard">
    <div class="pref" id="clearPref">東京都</div>
    <strong id="clearTitle">GOAL!</strong>
    <div class="clearScore">SCORE <span id="clearScore">100</span> / 100</div>
    <div class="clearStars" id="clearStars">★★★</div>
    <div class="clearReward" id="clearReward">クリアボーナス</div>
    <p id="nextPref">つぎは 神奈川県</p>
    <div class="clearActions">
      <button class="clearAction" id="continueBtn" type="button">すすむ（3秒後スタート）</button>
      <button class="clearAction" id="quitBtn" type="button">やめる</button>
    </div>
    <div id="countdown"></div>
  </div>
</div>
<div id="startLayer">
  <div class="card">
    <h1>SKY DASH</h1>
    <p>空の道を走って、どんどん加速。<br>左右とジャンプだけで遊べます。</p>
    <div class="startActions">
      <button id="run">▶ RUN!</button>
      <button id="shopOpen" type="button">🛒 SHOP</button>
    </div>
    <div class="startWallet">所持 ⭐ <span id="startStarCount">0</span></div>
    <div id="status">前進は自動です。</div>
    <div id="papaRequestMount"></div>
  </div>
</div>
<div id="shopLayer" hidden aria-label="Sky Dash ショップ">
  <div class="shopShell">
    <header class="shopHeader">
      <h2>🛒 SKY SHOP</h2>
      <div class="shopBalance">⭐ <span id="shopStars">0</span></div>
      <button id="shopClose" type="button">もどる</button>
    </header>
    <div class="shopBody">
      <div id="shopStatus" aria-live="polite"></div>
      <section class="shopSection"><h3>ずっと使える パワーアップ</h3><div class="shopGrid" id="upgradeShop"></div></section>
      <section class="shopSection"><h3>お助けアイテム</h3><div class="shopGrid" id="consumableShop"></div></section>
      <section class="shopSection"><h3>みらいのアイテム</h3><div class="shopGrid" id="futureShop"></div></section>
    </div>
  </div>
</div>
<div id="error"></div>
<script src="../shared/for-my-sons-db.js?v=3"></script>
<script src="../shared/profile-manager.js?v=2"></script>
<script src="../shared/save-store.js?v=2"></script>
<script src="../shared/github-sync.js?v=9"></script>
<script src="../shared/parent-requests.js?v=1"></script>
<script src="../shared/parent-request-view.js?v=1"></script>
<script src="./star-wallet.js?v=2"></script>
<script src="./shop-system.js?v=1"></script>
<script type="module">
const runButton=document.getElementById('run');
const startLayer=document.getElementById('startLayer');
const status=document.getElementById('status');
const errorBox=document.getElementById('error');
const shopOpen=document.getElementById('shopOpen'),shopClose=document.getElementById('shopClose'),shopLayer=document.getElementById('shopLayer'),shopStatus=document.getElementById('shopStatus');
const upgradeShop=document.getElementById('upgradeShop'),consumableShop=document.getElementById('consumableShop'),futureShop=document.getElementById('futureShop');
const {BASE_CLEAR_REWARD,getClearBonusMultiplier,getClearReward,createStarWallet,createClearRewardGuard}=globalThis.SkyDashStarWallet;
const {SHOP_ITEMS,STAR_DOUBLE_MS,INVINCIBLE_MS,createDefaultState,createShopStore,getItemByEffect,getPrice,getConsumableCount,getStarPickupRange,getBoostDuration,getDrinkHeal,getJumpVelocity,getRoadStarAmount,resolveObstacleImpact}=globalThis.SkyDashShopSystem;
let started=false;
let starWallet=null,walletPromise=null,shopStore=null,shopPromise=null,saveStore=null,currentProfile=null;
let sharedContextPromise=null;
let shopState=createDefaultState();

function showWalletError(err){
  errorBox.style.display='block';
  errorBox.textContent='星データの保存エラー: '+String(err);
}

function updateWalletDisplays(stars){
  document.getElementById('starCount').textContent=stars;
  document.getElementById('startStarCount').textContent=stars;
  document.getElementById('shopStars').textContent=stars;
}

function ensureSharedContext(){
  if(sharedContextPromise)return sharedContextPromise;
  sharedContextPromise=(async()=>{
    const db=await globalThis.ForMySonsDB.openDatabase();
    const profileManager=globalThis.ForMySonsProfile.createProfileManager(db);
    const profile=await profileManager.current();
    const sharedSaveStore=globalThis.ForMySonsSaveStore.createSaveStore(db,profileManager);
    const sync=globalThis.ForMySonsGithubSync.createGithubSync({
      fetch:globalThis.fetch,
      tokenProvider:async()=>(await db.get('settings','githubToken'))?.value||'',
      saveStore:sharedSaveStore,
      profileManager
    });
    const parentRequests=globalThis.ForMySonsParentRequests.createParentRequestService({
      db,
      profileManager,
      sync
    });
    return {db,profileManager,profile,saveStore:sharedSaveStore,sync,parentRequests};
  })().catch(err=>{sharedContextPromise=null;throw err});
  return sharedContextPromise;
}

async function setupParentRequest(){
  try{
    const {parentRequests}=await ensureSharedContext();
    globalThis.ForMySonsParentRequestView.mount({
      container:document.getElementById('papaRequestMount'),
      service:parentRequests,
      appId:'sky-dash',
      gameName:'Sky Dash'
    });
  }catch(err){
    console.warn('Papa request form unavailable.',err);
  }
}

async function loadStarWallet(){
  const context=await ensureSharedContext();
  currentProfile=context.profile;
  saveStore=context.saveStore;
  starWallet=createStarWallet(saveStore,{
    profileId:currentProfile.id,
    onChange:updateWalletDisplays,
    onError:showWalletError
  });
  await starWallet.loadStarWallet();
  return starWallet;
}

function ensureStarWallet(){
  if(starWallet)return Promise.resolve(starWallet);
  if(!walletPromise)walletPromise=loadStarWallet().catch(err=>{walletPromise=null;throw err});
  return walletPromise;
}

async function loadShopStore(){
  await ensureStarWallet();
  shopStore=createShopStore(saveStore,starWallet,{
    profileId:currentProfile.id,
    onChange:next=>{shopState=next;renderShop()},
    onError:showWalletError
  });
  shopState=await shopStore.loadShopState();
  renderShop();
  return shopStore;
}

function ensureShopStore(){
  if(shopStore)return Promise.resolve(shopStore);
  if(!shopPromise)shopPromise=loadShopStore().catch(err=>{shopPromise=null;throw err});
  return shopPromise;
}

setupParentRequest();
ensureShopStore().catch(err=>console.warn('Sky Shop preload unavailable.',err));

function shopCard(item){
  const level=item.type==='upgrade'?(shopState.upgrades[item.effect]||0):0;
  const count=item.type==='consumable'?getConsumableCount(shopState,item.effect):0;
  const price=getPrice(item,shopState);
  const maxed=item.type==='upgrade'&&price==null;
  const equipped=item.type==='consumable'&&shopState.selectedConsumable===item.effect;
  const meta=item.type==='upgrade'?'Lv '+level+' / '+item.maxLevel:item.type==='consumable'?'所持 '+count:'COMING SOON';
  const buyLabel=item.type==='placeholder'?'購入できません':maxed?'MAX':'⭐ '+price+' で購入';
  const buyDisabled=item.type==='placeholder'||maxed||price==null||starWallet&&starWallet.getStars()<price;
  const equip=item.type==='consumable'?'<button class="shopEquip '+(equipped?'equipped':'')+'" data-equip="'+item.effect+'" '+(count<=0?'disabled':'')+'>'+(equipped?'装備中':'もっていく')+'</button>':'';
  return '<article class="shopCard '+(item.type==='placeholder'?'placeholder':'')+'"><div class="shopIcon">'+item.icon+'</div><div><h4>'+item.name+'</h4><p>'+item.description+'</p><div class="shopMeta"><span>'+meta+'</span></div></div><div class="shopActions"><button class="shopBuy" data-buy="'+item.id+'" '+(buyDisabled?'disabled':'')+'>'+buyLabel+'</button>'+equip+'</div></article>';
}

function renderShop(){
  if(!upgradeShop)return;
  upgradeShop.innerHTML=SHOP_ITEMS.filter(x=>x.type==='upgrade').map(shopCard).join('');
  consumableShop.innerHTML=SHOP_ITEMS.filter(x=>x.type==='consumable').map(shopCard).join('');
  futureShop.innerHTML=SHOP_ITEMS.filter(x=>x.type==='placeholder').map(shopCard).join('');
}

shopOpen.addEventListener('click',async()=>{
  shopOpen.disabled=true;shopStatus.textContent='ショップを準備中…';
  try{
    await ensureShopStore();
    renderShop();shopStatus.textContent='パワーアップやアイテムをえらべます。';shopLayer.hidden=false;
  }catch(err){showWalletError(err);shopStatus.textContent='ショップを開けませんでした。'}
  finally{shopOpen.disabled=false}
});
shopClose.addEventListener('click',()=>{shopLayer.hidden=true});

shopLayer.addEventListener('click',async e=>{
  const buy=e.target.closest?.('[data-buy]');
  const equip=e.target.closest?.('[data-equip]');
  if(buy){
    buy.disabled=true;shopStatus.textContent='購入中…';
    try{
      const result=await shopStore.purchase(buy.dataset.buy);
      shopStatus.textContent=result.ok?'購入しました！':result.reason==='insufficient-stars'?'星がたりません':result.reason==='max-level'?'レベルMAXです':'この商品はまだ買えません';
    }catch(err){showWalletError(err);shopStatus.textContent='購入を保存できませんでした。'}
    renderShop();
    return;
  }
  if(equip){
    const ok=shopStore.selectConsumable(equip.dataset.equip);
    shopStatus.textContent=ok?'次のステージに持っていきます。':'先にアイテムを購入してください。';
    renderShop();
  }
});

runButton.addEventListener('click',async()=>{
  if(started)return;
  started=true;runButton.disabled=true;runButton.textContent='LOADING...';status.textContent='ゲームデータを準備中…';
  try{
    await ensureShopStore();
    status.textContent='3Dワールドを準備中…';
    const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
    initGame(THREE);startLayer.style.display='none';
  }catch(err){
    started=false;runButton.disabled=false;runButton.textContent='↻ RETRY';status.textContent='ゲームを準備できませんでした。';
    errorBox.style.display='block';errorBox.textContent='読み込みエラー: '+String(err);
  }
});

 const state={totalDistance:0,stageDistance:0,stageIndex:0,level:1,score:100,targetX:0,y:0,vy:0,boost:0,transition:false,last:performance.now()};
 const press={left:false,right:false};
 const levelEl=document.getElementById('level'),meters=document.getElementById('meters'),starCount=document.getElementById('starCount'),progress=document.getElementById('progress'),boost=document.getElementById('boost');
 const scoreValue=document.getElementById('scoreValue'),scorePop=document.getElementById('scorePop');
 const prefectureEl=document.getElementById('prefecture'),stageNoEl=document.getElementById('stageNo'),clearLayer=document.getElementById('clearLayer'),clearPref=document.getElementById('clearPref'),nextPref=document.getElementById('nextPref');
 const clearTitle=document.getElementById('clearTitle'),clearScoreEl=document.getElementById('clearScore'),clearStarsEl=document.getElementById('clearStars'),clearRewardEl=document.getElementById('clearReward');
 const continueBtn=document.getElementById('continueBtn'),quitBtn=document.getElementById('quitBtn'),countdownEl=document.getElementById('countdown');
 let pendingNextIndex=null,countdownTimer=null,stageRunId=1;
 const clearRewardGuard=createClearRewardGuard(amount=>starWallet.addStars(amount));

 const ENVIRONMENT_PALETTES={
   city:{sky:0x78d8ff,fog:0xc8efff,road:0xecc995,edge:0xf6b644,ground:0x72ca68},
   sea:{sky:0x69d9f2,fog:0xc9f5f6,road:0xf0d2a0,edge:0xf3b84b,ground:0x77cf75},
   mountain:{sky:0x8ad5ef,fog:0xd6f0e9,road:0xe6c996,edge:0xe7a943,ground:0x62b75d},
   river:{sky:0x83d6ef,fog:0xd1f1ef,road:0xe8ca98,edge:0xe6ad49,ground:0x6bc86b}
 };
 const stageDecor=new THREE.Group();scene.add(stageDecor);
 const stageMovers=[];
 function clearStageDecor(){
   while(stageDecor.children.length){
     const obj=stageDecor.children.pop();
     obj.traverse?.(n=>{n.geometry?.dispose?.();if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>m.dispose?.())}});
   }
   stageMovers.length=0;
 }
 function addMover(obj,wrap=340){obj.userData.wrap=wrap;stageDecor.add(obj);stageMovers.push(obj);return obj}
 function mat(color,roughness=.8){return new THREE.MeshStandardMaterial({color,roughness})}
 function accentCss(value){return "#"+value.toString(16).padStart(6,"0")}
 function setStagePalette(stage){
   const primary=ENVIRONMENT_PALETTES[stage.environment]||ENVIRONMENT_PALETTES.city;
   const secondary=stage.mix?ENVIRONMENT_PALETTES[stage.mix]:null;
   const blend=(key)=>secondary?new THREE.Color(primary[key]).lerp(new THREE.Color(secondary[key]),.28):new THREE.Color(primary[key]);
   scene.background.copy(blend("sky"));scene.fog.color.copy(blend("fog"));
   roadMat.color.copy(blend("road"));edgeMat.color.copy(blend("edge"));grassMat.color.copy(blend("ground"));
   document.documentElement.style.setProperty("--stage-accent",accentCss(stage.accent));
 }
 function addCityScenery(stage){
   const colors=[0xeaf3fa,0xc6d9ea,0xf5e5cc,0xacc4df,0xded5ed];
   const mats=colors.map(c=>mat(c,.82));
   const count=stage.landmark==="tokyo"?18:12;
   for(let i=0;i<count;i++){
     const h=4+(i%5)*1.65;
     const building=new THREE.Mesh(new THREE.BoxGeometry(3+(i%3)*.7,h,3.2),mats[i%mats.length]);
     building.position.set((i%2?1:-1)*(10.6+(i%4)*1.8),h/2+.35,-20-i*17);
     addMover(building,360);
   }
   if(stage.landmark==="tokyo"){
     const tower=new THREE.Group();
     for(let i=0;i<5;i++){
       const section=new THREE.Mesh(new THREE.CylinderGeometry(.28+i*.07,.52+i*.09,1.55,6),mat(i%2?0xffffff:0xee5d52,.6));
       section.position.y=.8+i*1.5;tower.add(section);
     }
     const deck=new THREE.Mesh(new THREE.BoxGeometry(2.6,.38,1.45),mat(0xffffff,.5));deck.position.y=5.15;tower.add(deck);
     const mast=new THREE.Mesh(new THREE.CylinderGeometry(.13,.22,3.0,6),mat(0xee5d52,.55));mast.position.y=7.0;tower.add(mast);
     tower.position.set(-13,.25,-105);addMover(tower,360);
   }
 }
 function addSeaScenery(stage){
   const waterMat=mat(0x2daedb,.38);waterMat.transparent=true;waterMat.opacity=.9;
   [-14,14].forEach((x,i)=>{
     const water=new THREE.Mesh(new THREE.BoxGeometry(14,.28,360),i===0?waterMat:waterMat.clone());water.position.set(x,-.72,-145);stageDecor.add(water);
   });
   const hullMat=mat(0xffffff,.62),sailMat=mat(0xffe28a,.7);
   for(let i=0;i<4;i++){
     const boat=new THREE.Group();
     const hull=new THREE.Mesh(new THREE.BoxGeometry(1.8,.42,3.2),hullMat);boat.add(hull);
     const mast=new THREE.Mesh(new THREE.BoxGeometry(.08,2,.08),mat(0x80543a,.8));mast.position.y=1.05;boat.add(mast);
     const sail=new THREE.Mesh(new THREE.ConeGeometry(.75,1.7,3),sailMat);sail.position.set(.42,1.2,0);sail.rotation.z=-.18;boat.add(sail);
     boat.position.set((i%2?1:-1)*(12.5+(i%2)*2),.1,-45-i*72);addMover(boat,360);
   }
   if(stage.landmark==="kanagawa"){
     const bridge=new THREE.Group(),bridgeMat=mat(0xf5f7fa,.55),cableMat=mat(0xd9e5ef,.5);
     const deck=new THREE.Mesh(new THREE.BoxGeometry(18,.42,2),bridgeMat);deck.position.y=3.2;bridge.add(deck);
     [-7,7].forEach(x=>{
       const p=new THREE.Mesh(new THREE.BoxGeometry(.7,7,.7),bridgeMat);p.position.set(x,3.7,0);bridge.add(p);
       const cable=new THREE.Mesh(new THREE.TorusGeometry(3.5,.08,6,20,Math.PI),cableMat);cable.rotation.z=Math.PI;cable.position.set(x,6.0,0);bridge.add(cable);
     });
     bridge.position.set(0,.25,-118);addMover(bridge,360);
     const skylineMat=mat(0xb8d1e0,.8);
     for(let i=0;i<6;i++){const h=3+(i%3)*1.4;const b=new THREE.Mesh(new THREE.BoxGeometry(2.4,h,2.4),skylineMat);b.position.set(11+i*1.7,h/2,-175-i*9);addMover(b,360)}
   }
 }
 function addMountainScenery(stage){
   const mountainMats=[mat(0x6c9b72,.95),mat(0x7da57c,.95),mat(0x5f8f6d,.95)];
   for(let i=0;i<10;i++){
     const scale=1+(i%4)*.22;
     const mountain=new THREE.Mesh(new THREE.ConeGeometry(5.2*scale,9.5*scale,6),mountainMats[i%mountainMats.length]);
     mountain.position.set((i%2?1:-1)*(14+(i%3)*4),3.8*scale,-30-i*34);addMover(mountain,390);
   }
   if(stage.landmark==="yamanashi"){
     const icon=new THREE.Group();
     const body=new THREE.Mesh(new THREE.ConeGeometry(10.5,15,7),mat(0x638a78,.95));body.position.y=6.5;icon.add(body);
     const snow=new THREE.Mesh(new THREE.ConeGeometry(4.25,5.5,7),mat(0xf9fbf5,.75));snow.position.y=12.1;icon.add(snow);
     icon.position.set(-15,-.3,-128);addMover(icon,390);
   }
   if(stage.landmark==="shizuoka"){
     const icon=new THREE.Group();
     const body=new THREE.Mesh(new THREE.ConeGeometry(8.7,13.5,7),mat(0x5c8b77,.95));body.position.y=5.9;icon.add(body);
     const snow=new THREE.Mesh(new THREE.ConeGeometry(3.45,4.8,7),mat(0xffffff,.72));snow.position.y=10.9;icon.add(snow);
     icon.position.set(16,-.6,-150);addMover(icon,390);
   }
 }
 function addRiverScenery(){
   const riverMat=mat(0x36add3,.42);riverMat.transparent=true;riverMat.opacity=.9;
   const river=new THREE.Mesh(new THREE.BoxGeometry(10,.24,360),riverMat);river.position.set(-13,-.7,-145);stageDecor.add(river);
   const bankMat=mat(0x87cd70,.9);
   const bank=new THREE.Mesh(new THREE.BoxGeometry(3,.46,360),bankMat);bank.position.set(-7.8,-.5,-145);stageDecor.add(bank);
   const bridgeMat=mat(0xe9dcc5,.78);
   for(let i=0;i<3;i++){
     const bridge=new THREE.Mesh(new THREE.BoxGeometry(10,.32,2.6),bridgeMat);bridge.position.set(-13,.2,-70-i*95);addMover(bridge,360);
   }
 }
 function applyStageTheme(index){
   clearStageDecor();
   const stage=STAGE_ROUTE[index]||STAGE_ROUTE[0];
   prefectureEl.textContent=stage.name;
   stageNoEl.textContent=(index+1)+" / "+PREFECTURES.length;
   resetChallengeObjects();
   setStagePalette(stage);
   const environments=[stage.environment,stage.mix].filter(Boolean);
   trees.forEach((tree,i)=>tree.visible=environments.includes("mountain")||environments.includes("river")||(environments.includes("city")&&i%4===0)||(environments.includes("sea")&&i%7===0));
   islands.forEach(island=>island.visible=false);
   castle.visible=false;
   if(environments.includes("city"))addCityScenery(stage);
   if(environments.includes("sea"))addSeaScenery(stage);
   if(environments.includes("mountain"))addMountainScenery(stage);
   if(environments.includes("river"))addRiverScenery(stage);
 }

 const finishGate=new THREE.Group();
 const finishWhite=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45});
 const finishGold=new THREE.MeshStandardMaterial({color:0xffd83f,emissive:0x8a5b00,emissiveIntensity:.4});
 [-4.3,4.3].forEach(x=>{
   const pillar=new THREE.Mesh(new THREE.BoxGeometry(.75,6,.75),finishWhite);pillar.position.set(x,3,0);finishGate.add(pillar);
 });
 const topBar=new THREE.Mesh(new THREE.BoxGeometry(9.3,.8,.8),finishGold);topBar.position.y=6.1;finishGate.add(topBar);
 const flagL=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.0,.08),finishGold);flagL.position.set(-3.1,6.9,0);finishGate.add(flagL);
 const flagR=flagL.clone();flagR.position.x=3.1;finishGate.add(flagR);
 finishGate.visible=false;scene.add(finishGate);

 function startNextStageAfterCountdown(){
   if(pendingNextIndex===null)return;
   continueBtn.disabled=true;quitBtn.disabled=true;
   let count=3;
   countdownEl.textContent=count+"";
   countdownTimer=setInterval(()=>{
     count-=1;
     if(count>0){
       countdownEl.textContent=count+"";
       return;
     }
     clearInterval(countdownTimer);countdownTimer=null;
     countdownEl.textContent="GO!";
     setTimeout(()=>{
       state.stageIndex=pendingNextIndex;state.stageDistance=0;state.score=100;scoreValue.textContent="100";state.targetX=0;player.position.x=0;finishGate.visible=false;stageRunId+=1;
       prepareStageItem();
       applyStageTheme(state.stageIndex);
       clearLayer.classList.remove('show','neon-clear');
       countdownEl.textContent="";
       continueBtn.disabled=false;quitBtn.disabled=false;
       pendingNextIndex=null;state.transition=false;state.last=performance.now();
     },350);
   },1000);
 }
 continueBtn.addEventListener('click',startNextStageAfterCountdown);
 quitBtn.addEventListener('click',async()=>{
   if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}
   quitBtn.disabled=true;
   try{await Promise.all([starWallet.flush(),shopStore?.flush?.()])}catch(err){showWalletError(err)}
   location.href="../";
 });

 function triggerClear(){
   if(state.transition)return;
   state.transition=true;press.left=false;press.right=false;
   clearPref.textContent=PREFECTURES[state.stageIndex];
   clearScoreEl.textContent=state.score;
   const rating=state.score===100?"★★★":state.score>=90?"★★★":state.score>=80?"★★☆":state.score>=70?"★☆☆":"";
   clearStarsEl.textContent=rating;
   clearLayer.classList.toggle('neon-clear',state.score>=90);
   const passed=state.score>=PASS_SCORE;
   const multiplier=getClearBonusMultiplier(state.score);
   const clearReward=getClearReward(state.score);
   clearRewardGuard.grant(stageRunId,state.score);
   const nextIndex=state.stageIndex+1;
   clearTitle.textContent=state.score===100?"PERFECT!":state.score===99?"GREAT!":passed?"CLEAR!":"GOAL!";
   if(passed){
     clearRewardEl.innerHTML='<span>クリアボーナス</span><b>'+BASE_CLEAR_REWARD+'⭐ × '+multiplier.toFixed(1)+'</b><strong>+'+clearReward+'⭐</strong>';
     pendingNextIndex=nextIndex<PREFECTURES.length?nextIndex:null;
     continueBtn.hidden=pendingNextIndex===null;
     continueBtn.textContent="すすむ（3秒後スタート）";
     if(pendingNextIndex!==null){
       nextPref.textContent="つぎは "+PREFECTURES[nextIndex];
     }else{
       nextPref.textContent="東京から北海道まで 47都道府県クリア！";
     }
   }else{
     clearRewardEl.innerHTML='<span>クリアボーナスなし</span><small>道中で獲得した星は保持されます。</small>';
     pendingNextIndex=state.stageIndex;
     continueBtn.hidden=false;
     continueBtn.textContent="もういちど（3秒後スタート）";
     nextPref.textContent="あと "+(PASS_SCORE-state.score)+"点で つぎへ！";
   }
   quitBtn.disabled=false;continueBtn.disabled=false;countdownEl.textContent="";
   clearLayer.classList.add('show');
 }
 applyStageTheme(0);

 const itemButton=document.getElementById('itemButton');
 const runEffects={itemUsed:false,invincibleUntil:0,starDoubleUntil:0};
 function selectedStageItem(){return getItemByEffect(shopState.selectedConsumable)}
 function updateStageItemButton(){
   const item=selectedStageItem();
   if(!item){itemButton.hidden=true;return}
   itemButton.hidden=false;
   const count=getConsumableCount(shopState,item.effect);
   const automatic=item.activation==='auto-hit';
   itemButton.disabled=automatic||runEffects.itemUsed||count<=0;
   itemButton.innerHTML=(automatic?'AUTO':'ITEM')+'<b>'+item.icon+' '+count+'</b>';
 }
 function prepareStageItem(){
   runEffects.itemUsed=false;runEffects.invincibleUntil=0;runEffects.starDoubleUntil=0;
   updateStageItemButton();
 }
 function consumeStageItem(effect){
   if(runEffects.itemUsed||shopState.selectedConsumable!==effect)return false;
   if(!shopStore.consumeSelected(effect))return false;
   runEffects.itemUsed=true;updateStageItemButton();return true;
 }
 itemButton.addEventListener('pointerdown',e=>{
   e.preventDefault();
   const item=selectedStageItem();
   if(!item||item.activation!=='manual'||runEffects.itemUsed)return;
   if(item.effect==='starDouble'&&consumeStageItem('starDouble'))runEffects.starDoubleUntil=performance.now()+STAR_DOUBLE_MS;
   else if(item.effect==='invincible'&&consumeStageItem('invincible'))runEffects.invincibleUntil=performance.now()+INVINCIBLE_MS;
   else if(item.effect==='boostBottle'&&consumeStageItem('boostBottle'))doBoost();
 });
 prepareStageItem();

 function jump(){if(state.y<=.02)state.vy=getJumpVelocity(shopState)}
 function bindHold(id,key){
   const el=document.getElementById(id);
   el.addEventListener('pointerdown',e=>{e.preventDefault();press[key]=true;el.setPointerCapture?.(e.pointerId)});
   ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>press[key]=false));
 }
 bindHold('left','left');bindHold('right','right');
 document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
 addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')press.left=true;if(e.key==='ArrowRight'||e.key==='d')press.right=true;if(e.code==='Space'){e.preventDefault();jump()}});
 addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')press.left=false;if(e.key==='ArrowRight'||e.key==='d')press.right=false});

 function doBoost(){
   const duration=getBoostDuration(shopState,1.25);
   state.boost=Math.max(state.boost,duration);
   boost.classList.add('show');document.body.classList.add('boosting');
   setTimeout(()=>{boost.classList.remove('show');document.body.classList.remove('boosting')},Math.min(900,470+(duration-1.25)*300));
 }

 function applyObstacleHit(){
   let impact=resolveObstacleImpact({
     state:shopState,
     selectedEffect:shopState.selectedConsumable,
     itemUsed:runEffects.itemUsed,
     invincibleActive:runEffects.invincibleUntil>performance.now()
   });
   if(impact.blockedBy==='invincible'){showScorePop('MUTEKI!','plus');return 0}
   if(impact.consumeEffect==='scoreGuard'){
     if(consumeStageItem('scoreGuard')){showScorePop('GUARD!','plus');return 0}
     impact=resolveObstacleImpact({state:shopState,itemUsed:true,invincibleActive:false});
   }
   if(impact.damage===10)changeScore(-10);else if(impact.damage>0)changeScore(-impact.damage);
   if(impact.consumeEffect==='startEnergy'&&consumeStageItem('startEnergy')&&impact.recovery>0){
     if(impact.recovery===5)changeScore(5);else changeScore(impact.recovery);
   }
   return impact.damage;
 }

 function frame(now){
   requestAnimationFrame(frame);
   const dt=Math.min((now-state.last)/1000,.034);state.last=now;
   const grow=Math.min(1,Math.sqrt(state.totalDistance/TOTAL_ROUTE)),speed=12+grow*18+(state.boost>0?11:0);
   if(state.boost>0)state.boost-=dt;
   const dz=state.transition?0:speed*dt;
   if(!state.transition){
     const gained=dz*.9;state.totalDistance+=gained;state.stageDistance+=gained;
     if(state.stageDistance>=STAGE_LENGTH)triggerClear();
   }

   const lateral=(press.right?1:0)-(press.left?1:0);
   state.targetX=THREE.MathUtils.clamp(state.targetX+lateral*8.3*dt,-4.0,4.0);
   player.position.x=THREE.MathUtils.lerp(player.position.x,state.targetX,1-Math.pow(.001,dt));

   state.vy-=22*dt;state.y+=state.vy*dt;if(state.y<0){state.y=0;state.vy=0}
   player.position.y=.3+state.y;

   const cycle=now*.0155*(1+speed/24);
   legL.rotation.x=Math.sin(cycle)*.78;legR.rotation.x=-Math.sin(cycle)*.78;
   armL.rotation.x=-Math.sin(cycle)*.6;armR.rotation.x=Math.sin(cycle)*.6;
   torso.rotation.z=-player.position.x*.025;

   segments.forEach(g=>{g.position.z+=dz;if(g.position.z>segLen)g.position.z-=segLen*segments.length});
   trees.forEach(g=>{g.position.z+=dz;if(g.position.z>16)g.position.z-=320});
   clouds.forEach(g=>{g.position.z+=dz*.45;if(g.position.z>26)g.position.z-=350});
   islands.forEach(g=>{g.position.z+=dz*.35;if(g.position.z>32)g.position.z-=330});
   castle.position.z+=dz*.18;if(castle.position.z>8)castle.position.z=-150;
   stageMovers.forEach(o=>{o.position.z+=dz;if(o.position.z>28)o.position.z-=o.userData.wrap||330});
   const remaining=Math.max(0,STAGE_LENGTH-state.stageDistance);
   finishGate.visible=remaining<=120&&!state.transition;
   if(finishGate.visible)finishGate.position.set(0,.35,player.position.z-(remaining/.9));
   rings.forEach(r=>{r.position.z+=dz;if(r.position.z>20)r.position.z-=300});
   obstacles.forEach((o,i)=>{
     o.position.z+=dz;
     if(o.position.z>12){o.position.z-=430;o.position.x=laneXs[(i+state.stageIndex+Math.floor(state.stageDistance/120))%3];o.userData.hit=false;o.visible=true}
     if(!state.transition&&!o.userData.hit&&Math.abs(o.position.z-player.position.z)<1.15&&Math.abs(o.position.x-player.position.x)<1.05&&state.y<1.05){
       o.userData.hit=true;applyObstacleHit();player.rotation.z=(player.position.x-o.position.x)*.08;
       setTimeout(()=>player.rotation.z=0,180);
     }
   });
   drinks.forEach((d,i)=>{
     d.position.z+=dz;d.rotation.y+=dt*2.8;
     if(d.position.z>12){d.position.z-=430;d.position.x=laneXs[(i+1+state.stageIndex)%3];d.userData.taken=false;d.visible=true}
     if(!state.transition&&!d.userData.taken&&Math.abs(d.position.z-player.position.z)<1.25&&Math.abs(d.position.x-player.position.x)<1.0&&state.y<2.0){
       d.userData.taken=true;d.visible=false;
       const heal=getDrinkHeal(shopState);if(heal===5)changeScore(5);else changeScore(heal);
     }
   });
   const starRange=getStarPickupRange(shopState);
   stars.forEach(s=>{s.position.z+=dz;s.rotation.x+=dt*2.5;s.rotation.y+=dt*4;if(s.position.z>10){s.position.z-=265;s.position.x=(Math.floor(Math.random()*3)-1)*2.25;s.visible=true}if(s.visible&&Math.abs(s.position.z-player.position.z)<starRange.z&&Math.abs(s.position.x-player.position.x)<starRange.x&&state.y<2.2){s.visible=false;const amount=getRoadStarAmount(runEffects.starDoubleUntil>now);if(amount===1)starWallet.addStars(1);else starWallet.addStars(amount)}});
   pads.forEach(p=>{p.position.z+=dz;if(p.position.z>15)p.position.z-=220;if(Math.abs(p.position.z-player.position.z)<1.8&&Math.abs(player.position.x)<3&&state.y<.7&&state.boost<=0)doBoost()});
   trails.forEach((t,i)=>{t.material.opacity=.08+grow*.36+(state.boost>0?.28:0);t.scale.z=1+grow*1.8+(state.boost>0?1.5:0);t.position.x=player.position.x+((i%3)-1)*.74});

   const portrait=innerHeight>innerWidth;
   camera.fov=(portrait?58:64)+grow*11+(state.boost>0?7:0);camera.updateProjectionMatrix();
   camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.26,.08);
   camera.position.y=(portrait?5.7:5.35)+state.y*.12;
   camera.position.z=portrait?11.7:10.4;
   camera.lookAt(player.position.x*.14,1.75,portrait?-16:-14);

   const lv=Math.min(100,1+Math.floor(state.totalDistance/(TOTAL_ROUTE/99)));if(lv!==state.level){state.level=lv;levelEl.textContent=lv}
   meters.textContent=Math.max(0,Math.ceil(STAGE_LENGTH-state.stageDistance))+'m';
   progress.style.width=Math.min(100,state.stageDistance/STAGE_LENGTH*100)+'%';
   renderer.render(scene,camera);
 }
 requestAnimationFrame(frame);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.35))});
}
</script>
