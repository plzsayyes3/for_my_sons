<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#59c7ff">
<title>Sky Dash Sample</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#66cfff;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;color:#fff;font-weight:950;text-shadow:0 2px 4px rgba(14,64,139,.85)}
.panel{position:absolute;background:linear-gradient(180deg,rgba(38,132,236,.96),rgba(19,73,171,.96));border:3px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 6px 0 rgba(0,55,140,.28),0 10px 24px rgba(0,65,150,.18);padding:9px 13px}
#speed{top:max(12px,env(safe-area-inset-top));left:12px;font-size:17px}
#distance{top:max(12px,env(safe-area-inset-top));right:12px;text-align:center;font-size:11px;letter-spacing:.04em}
#distance b{display:block;color:#ffe05d;font-size:23px;line-height:1.05;margin-top:2px}
#stars{left:12px;top:78px;font-size:16px}
#stageInfo{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;min-width:128px;padding:7px 12px}
#stageInfo b{display:block;font-size:16px;line-height:1.05}
#stageInfo small{font-size:10px;opacity:.9}
#progressBox{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(36vw,330px);height:13px;background:#153f96;border:2px solid #fff;border-radius:99px;overflow:hidden}
#progress{height:100%;width:0;background:linear-gradient(90deg,#63f1ff,#fff05d)}
#clearLayer{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.96);transition:.2s}
#clearLayer.show{opacity:1;transform:scale(1)}
.clearCard{min-width:min(78vw,360px);padding:22px 28px;text-align:center;border-radius:28px;background:rgba(255,255,255,.96);border:5px solid #ffe05c;box-shadow:0 18px 50px rgba(0,55,140,.3);color:#1556aa;text-shadow:none}
.clearCard .pref{font-size:20px;font-weight:950}
.clearCard strong{display:block;font-size:44px;line-height:1;color:#ffac22;margin:8px 0}
.clearCard p{margin:0;font-size:16px;font-weight:900;color:#54709c}
#boost{position:absolute;top:23%;left:50%;transform:translate(-50%,-50%) scale(.75);font-size:38px;color:#fff35c;opacity:0;transition:.12s}
#boost.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.controls{position:fixed;inset:0;z-index:10;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border:4px solid #fff;color:#fff;font-weight:1000;text-shadow:0 2px 3px #15549a;box-shadow:0 7px 0 rgba(0,70,155,.42),0 10px 24px rgba(0,83,183,.18);touch-action:none;user-select:none}
.move{top:50%;transform:translateY(-50%);width:78px;height:78px;border-radius:50%;font-size:39px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 28%,#87dcff,#238bf2 72%)}
#left{left:max(14px,env(safe-area-inset-left))}
#right{right:max(14px,env(safe-area-inset-right))}
#jump{left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;font-size:17px;line-height:1.05;background:radial-gradient(circle at 35% 28%,#ffed68,#ff9b21 70%);text-shadow:0 2px 2px #a95200;box-shadow:0 7px 0 rgba(180,89,0,.5),0 12px 28px rgba(255,137,0,.25)}
#jump span{display:block;font-size:35px;margin-bottom:2px}
#startLayer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(rgba(73,184,255,.12),rgba(11,53,134,.42))}
.card{width:min(500px,90vw);background:rgba(247,253,255,.97);color:#174b8e;border-radius:28px;padding:25px;text-align:center;box-shadow:0 24px 70px rgba(0,44,105,.35)}
.card h1{margin:0;font-size:42px;color:#1971cd;letter-spacing:-.03em}
.card p{font-weight:850;line-height:1.55;color:#54709c}
#run{border:0;border-radius:999px;padding:15px 35px;background:linear-gradient(#fff17a,#ffb927);color:#174c85;font-size:22px;font-weight:1000;box-shadow:0 7px 0 #c98800}
#status{min-height:22px;margin-top:14px;font-size:13px;font-weight:800;color:#61799b}
#error{position:fixed;z-index:40;left:12px;right:12px;bottom:12px;display:none;background:#7b1730;color:#fff;border-radius:14px;padding:12px;font:700 12px/1.4 system-ui}
@media(max-width:700px){
 #stageInfo{top:58px}
 #progressBox{top:100px;width:52vw;height:12px}
 #speed{font-size:14px;padding:7px 10px}
 #distance{padding:7px 9px}
 #distance b{font-size:20px}
 #stars{top:61px;font-size:14px;padding:7px 10px}
 .move{width:72px;height:72px;font-size:36px}
 #jump{width:108px;height:108px}
}
@media(orientation:landscape){
 .move{top:auto;bottom:24px;transform:none}
 #left{left:20px}
 #right{left:104px;right:auto}
 #jump{left:auto;right:20px;transform:none;width:98px;height:98px}
 #stageInfo{top:14px}
 #progressBox{top:54px}
 #stars{top:auto;bottom:128px}
}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="panel" id="speed">⚡ Speed Lv <b id="level">1</b></div>
  <div class="panel" id="distance">GOALまで<b id="meters">500m</b></div>
  <div class="panel" id="stageInfo"><b id="prefecture">東京都</b><small id="stageNo">1 / 47</small></div>
  <div id="progressBox"><div id="progress"></div></div>
  <div class="panel" id="stars">⭐ <span id="starCount">0</span></div>
  <div id="boost">BOOST!</div>
</div>
<div class="controls">
  <button class="btn move" id="left" aria-label="左へ">←</button>
  <button class="btn move" id="right" aria-label="右へ">→</button>
  <button class="btn" id="jump" aria-label="ジャンプ"><span>↑</span>JUMP</button>
</div>
<div id="clearLayer" aria-live="polite">
  <div class="clearCard">
    <div class="pref" id="clearPref">東京都</div>
    <strong>CLEAR!</strong>
    <p id="nextPref">つぎは 神奈川県</p>
  </div>
</div>
<div id="startLayer">
  <div class="card">
    <h1>SKY DASH</h1>
    <p>空の道を走って、どんどん加速。<br>左右とジャンプだけで遊べます。</p>
    <button id="run">▶ RUN!</button>
    <div id="status">前進は自動です。</div>
  </div>
</div>
<div id="error"></div>
<script type="module">
const runButton=document.getElementById('run');
const startLayer=document.getElementById('startLayer');
const status=document.getElementById('status');
const errorBox=document.getElementById('error');
let started=false;

runButton.addEventListener('click',async()=>{
  if(started)return;
  started=true;runButton.disabled=true;runButton.textContent='LOADING...';status.textContent='3Dワールドを準備中…';
  try{
    const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js');
    initGame(THREE);startLayer.style.display='none';
  }catch(err){
    started=false;runButton.disabled=false;runButton.textContent='↻ RETRY';status.textContent='3Dエンジンを読み込めませんでした。';
    errorBox.style.display='block';errorBox.textContent='読み込みエラー: '+String(err);
  }
});

function initGame(THREE){
 const host=document.getElementById('game');
 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x72d8ff);
 scene.fog=new THREE.Fog(0xb9ebff,50,190);

 const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 host.appendChild(renderer.domElement);

 const camera=new THREE.PerspectiveCamera(61,innerWidth/innerHeight,.1,420);
 camera.position.set(0,5.6,10.8);

 const hemi=new THREE.HemisphereLight(0xf1fbff,0x5e9859,2.4);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-8,18,8);sun.castShadow=true;scene.add(sun);

 const roadMat=new THREE.MeshStandardMaterial({color:0xf3d29c,roughness:.74});
 const edgeMat=new THREE.MeshStandardMaterial({color:0xf4b63f,roughness:.58,metalness:.08});
 const grassMat=new THREE.MeshStandardMaterial({color:0x69d65e,roughness:.9});
 const railMat=new THREE.MeshStandardMaterial({color:0x9f6534,roughness:.82});
 const stoneMat=new THREE.MeshStandardMaterial({color:0xe9e1cd,roughness:.88});

 const segments=[],segLen=22;
 for(let i=0;i<14;i++){
   const g=new THREE.Group();
   const road=new THREE.Mesh(new THREE.BoxGeometry(10.5,.42,segLen),roadMat);road.receiveShadow=true;g.add(road);
   [-5.35,5.35].forEach(x=>{
     const edge=new THREE.Mesh(new THREE.BoxGeometry(.35,.58,segLen),edgeMat);edge.position.set(x,.08,0);g.add(edge);
     const rail=new THREE.Mesh(new THREE.BoxGeometry(.22,.55,segLen),railMat);rail.position.set(x,.66,0);g.add(rail);
   });
   const leftIsland=new THREE.Mesh(new THREE.BoxGeometry(7,.85,segLen),grassMat);leftIsland.position.set(-9.2,-.2,0);g.add(leftIsland);
   const rightIsland=leftIsland.clone();rightIsland.position.x=9.2;g.add(rightIsland);
   g.position.z=-i*segLen;scene.add(g);segments.push(g);
 }

 const trunkMat=new THREE.MeshStandardMaterial({color:0x986039});
 const leafMat=new THREE.MeshStandardMaterial({color:0x38c96b,roughness:.84});
 const trees=[];
 for(let i=0;i<48;i++){
   const g=new THREE.Group();
   const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.31,1.7,8),trunkMat);trunk.position.y=.84;g.add(trunk);
   const top1=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,8),leafMat);top1.position.set(0,2.0,0);top1.scale.set(1.2,.9,1);g.add(top1);
   const top2=new THREE.Mesh(new THREE.SphereGeometry(.8,12,8),leafMat);top2.position.set(.45,2.3,.1);g.add(top2);
   g.position.set((i%2?1:-1)*(8.4+Math.random()*4.7),.36,-8-i*6.5);scene.add(g);trees.push(g);
 }

 const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.96});
 const clouds=[];
 for(let i=0;i<20;i++){
   const g=new THREE.Group();
   [[0,0,0,1.2],[1,.05,0,.85],[-1,.02,0,.8],[.25,.35,0,.72]].forEach(v=>{
     const m=new THREE.Mesh(new THREE.SphereGeometry(1.2*v[3],12,8),cloudMat);m.position.set(v[0],v[1],v[2]);g.add(m);
   });
   g.position.set((Math.random()-.5)*64,-6.2-Math.random()*2.4,-i*18);g.scale.setScalar(1.8+Math.random()*2.3);scene.add(g);clouds.push(g);
 }

 function addFloatingIsland(x,y,z,scale=1){
   const g=new THREE.Group();
   const rock=new THREE.Mesh(new THREE.ConeGeometry(3.2*scale,5.5*scale,10),new THREE.MeshStandardMaterial({color:0xb77d5d,roughness:.95}));
   rock.rotation.x=Math.PI;rock.position.y=-2.3*scale;g.add(rock);
   const cap=new THREE.Mesh(new THREE.CylinderGeometry(3.1*scale,3.4*scale,.75*scale,12),grassMat);g.add(cap);
   const tree=new THREE.Mesh(new THREE.SphereGeometry(.9*scale,10,8),leafMat);tree.position.set(.6*scale,1.2*scale,0);g.add(tree);
   g.position.set(x,y,z);scene.add(g);return g;
 }
 const islands=[addFloatingIsland(-17,4,-55,.85),addFloatingIsland(18,7,-84,1.1),addFloatingIsland(-20,9,-125,.75),addFloatingIsland(19,5,-165,.9)];

 // castle silhouette
 const castle=new THREE.Group();
 const castleBase=new THREE.Mesh(new THREE.BoxGeometry(13,5,5),stoneMat);castleBase.position.y=2.5;castle.add(castleBase);
 const towerMat=new THREE.MeshStandardMaterial({color:0xf6efe1,roughness:.72});
 const roofMat=new THREE.MeshStandardMaterial({color:0x4d65d8,roughness:.45});
 [-4.7,-1.6,1.6,4.7].forEach((x,i)=>{
   const t=new THREE.Mesh(new THREE.CylinderGeometry(.95,1.12,6+(i%2)*1.5,12),towerMat);t.position.set(x,4.6+(i%2)*.75,0);castle.add(t);
   const roof=new THREE.Mesh(new THREE.ConeGeometry(1.35,2.2,12),roofMat);roof.position.set(x,8.2+(i%2)*1.5,0);castle.add(roof);
 });
 const gate=new THREE.Mesh(new THREE.TorusGeometry(1.5,.28,12,28,Math.PI),new THREE.MeshStandardMaterial({color:0xffd84e,emissive:0xb87d00,emissiveIntensity:.6}));
 gate.rotation.z=Math.PI;gate.position.set(0,1.9,2.6);castle.add(gate);
 castle.position.set(0,4,-128);castle.scale.setScalar(1.15);scene.add(castle);

 // improved character
 const player=new THREE.Group();
 const skin=new THREE.MeshStandardMaterial({color:0xffc49e,roughness:.72});
 const hoodieRed=new THREE.MeshStandardMaterial({color:0xf14d49,roughness:.68});
 const hoodieDark=new THREE.MeshStandardMaterial({color:0xc93238,roughness:.72});
 const denim=new THREE.MeshStandardMaterial({color:0x2f76c9,roughness:.72});
 const shoeRed=new THREE.MeshStandardMaterial({color:0xe9453a,roughness:.52});
 const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5});
 const hairMat=new THREE.MeshStandardMaterial({color:0x4d2b1d,roughness:.8});
 const packBlue=new THREE.MeshStandardMaterial({color:0x2672c8,roughness:.58});
 const starGold=new THREE.MeshStandardMaterial({color:0xffdb3f,emissive:0x7b4a00,emissiveIntensity:.28});

 // torso/hood
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.53,.95,6,12),hoodieRed);torso.position.y=1.65;torso.scale.set(1.06,1,1);torso.castShadow=true;player.add(torso);
 const hood=new THREE.Mesh(new THREE.TorusGeometry(.49,.16,8,18,Math.PI*1.15),hoodieDark);hood.rotation.x=Math.PI/2;hood.rotation.z=.9;hood.position.set(0,2.26,.19);player.add(hood);

 // head + ears
 const head=new THREE.Mesh(new THREE.SphereGeometry(.58,18,14),skin);head.position.y=2.75;head.castShadow=true;player.add(head);
 [-.56,.56].forEach(x=>{const ear=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),skin);ear.position.set(x,2.73,0);player.add(ear)});

 // layered hair clumps
 const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.62,16,10,0,Math.PI*2,0,Math.PI*.58),hairMat);hairCap.position.y=2.92;player.add(hairCap);
 const hairClumps=[];
 [[-.34,3.16,.08,.28],[0,3.22,.12,.31],[.35,3.15,.08,.27],[-.53,2.99,.04,.22],[.5,2.98,.03,.22]].forEach(v=>{
   const c=new THREE.Mesh(new THREE.ConeGeometry(v[3],.58,7),hairMat);c.position.set(v[0],v[1],v[2]);c.rotation.z=(v[0]||0)*.55;c.rotation.x=.18;player.add(c);hairClumps.push(c);
 });

 // arms/hands
 const armL=new THREE.Group(),armR=new THREE.Group();
 const upperL=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.68,5,8),hoodieRed);upperL.position.y=-.24;armL.add(upperL);
 const handL=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),skin);handL.position.y=-.78;armL.add(handL);
 armL.position.set(-.67,1.95,0);armL.rotation.z=.26;player.add(armL);
 const upperR=upperL.clone(),handR=handL.clone();armR.add(upperR,handR);armR.position.set(.67,1.95,0);armR.rotation.z=-.26;player.add(armR);

 // shorts/legs
 const shorts=new THREE.Mesh(new THREE.BoxGeometry(1.0,.48,.8),denim);shorts.position.y=1.02;shorts.rotation.x=.05;player.add(shorts);
 const legL=new THREE.Group(),legR=new THREE.Group();
 function buildLeg(g){
   const calf=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.58,5,8),skin);calf.position.y=-.25;g.add(calf);
   const sock=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.28,10),white);sock.position.y=-.69;g.add(sock);
   const shoe=new THREE.Mesh(new THREE.BoxGeometry(.48,.3,.78),shoeRed);shoe.position.set(0,-.88,-.18);shoe.rotation.x=-.08;g.add(shoe);
   const sole=new THREE.Mesh(new THREE.BoxGeometry(.5,.1,.8),white);sole.position.set(0,-1.02,-.16);g.add(sole);
 }
 buildLeg(legL);buildLeg(legR);legL.position.set(-.27,.92,0);legR.position.set(.27,.92,0);player.add(legL,legR);

 // backpack + star
 const pack=new THREE.Mesh(new THREE.BoxGeometry(.95,1.0,.34),packBlue);pack.position.set(0,1.69,.65);pack.geometry.translate(0,0,0);player.add(pack);
 const packTop=new THREE.Mesh(new THREE.SphereGeometry(.48,12,8),packBlue);packTop.scale.y=.45;packTop.position.set(0,2.13,.65);player.add(packTop);
 const star=new THREE.Mesh(new THREE.IcosahedronGeometry(.23,0),starGold);star.position.set(0,1.72,.86);star.scale.z=.35;player.add(star);
 const strapMat=new THREE.MeshStandardMaterial({color:0x9a5e35,roughness:.7});
 [-.34,.34].forEach(x=>{const st=new THREE.Mesh(new THREE.BoxGeometry(.09,.82,.08),strapMat);st.position.set(x,1.76,.46);st.rotation.z=x*.28;player.add(st)});

 player.position.set(0,.3,3);player.scale.setScalar(1.06);scene.add(player);

 const starMat=new THREE.MeshStandardMaterial({color:0xffd631,emissive:0x9e5a00,emissiveIntensity:.4});
 const starGeo=new THREE.IcosahedronGeometry(.42,0),stars=[];
 for(let i=0;i<24;i++){const s=new THREE.Mesh(starGeo,starMat);s.position.set((i%3-1)*2.25,1.3,-12-i*11);scene.add(s);stars.push(s)}

 const padMat=new THREE.MeshStandardMaterial({color:0x168fff,emissive:0x0754d9,emissiveIntensity:.9});
 const yellow=new THREE.MeshBasicMaterial({color:0xffe454}),pads=[];
 [-35,-108,-182].forEach(z=>{
   const g=new THREE.Group();
   const base=new THREE.Mesh(new THREE.BoxGeometry(5.2,.16,4),padMat);base.position.y=.35;g.add(base);
   for(let i=0;i<3;i++){const line=new THREE.Mesh(new THREE.BoxGeometry(3.7,.05,.32),yellow);line.position.set(0,.46,-.85+i*.85);g.add(line)}
   g.position.z=z;scene.add(g);pads.push(g);
 });

 const ringMat=new THREE.MeshStandardMaterial({color:0xffc528,emissive:0x7a4300,emissiveIntensity:.35,metalness:.35});
 const rings=[];
 for(let i=0;i<7;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(2.1,.24,12,26),ringMat);r.position.set(i%2?8:-8,4,-28-i*40);r.rotation.y=Math.PI/2;scene.add(r);rings.push(r)}

 const trails=[];
 for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,5+i*.4),new THREE.MeshBasicMaterial({color:i%2?0x6fefff:0xffffff,transparent:true,opacity:.1}));m.position.set(0,.55+i*.23,5+i*.35);scene.add(m);trails.push(m)}

 const PREFECTURES=["東京都","神奈川県","山梨県","静岡県","愛知県","岐阜県","三重県","滋賀県","京都府","大阪府","兵庫県","鳥取県","島根県","山口県","福岡県","佐賀県","長崎県","熊本県","鹿児島県","沖縄県","宮崎県","大分県","愛媛県","高知県","徳島県","香川県","岡山県","広島県","和歌山県","奈良県","福井県","石川県","富山県","長野県","新潟県","群馬県","埼玉県","千葉県","茨城県","栃木県","福島県","山形県","宮城県","岩手県","秋田県","青森県","北海道"];
 const STAGE_LENGTH=500;
 const TOTAL_ROUTE=STAGE_LENGTH*PREFECTURES.length;
 const state={totalDistance:0,stageDistance:0,stageIndex:0,count:0,level:1,targetX:0,y:0,vy:0,boost:0,transition:false,last:performance.now()};
 const press={left:false,right:false};
 const levelEl=document.getElementById('level'),meters=document.getElementById('meters'),starCount=document.getElementById('starCount'),progress=document.getElementById('progress'),boost=document.getElementById('boost');
 const prefectureEl=document.getElementById('prefecture'),stageNoEl=document.getElementById('stageNo'),clearLayer=document.getElementById('clearLayer'),clearPref=document.getElementById('clearPref'),nextPref=document.getElementById('nextPref');

 const stageDecor=new THREE.Group();scene.add(stageDecor);
 const stageMovers=[];
 function clearStageDecor(){
   while(stageDecor.children.length){
     const obj=stageDecor.children.pop();
     obj.traverse?.(n=>{n.geometry?.dispose?.();if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>m.dispose?.())}});
   }
   stageMovers.length=0;
 }
 function addMover(obj,wrap=330){obj.userData.wrap=wrap;stageDecor.add(obj);stageMovers.push(obj);return obj}
 function applyStageTheme(index){
   clearStageDecor();
   const name=PREFECTURES[index];
   prefectureEl.textContent=name;
   stageNoEl.textContent=(index+1)+" / "+PREFECTURES.length;
   if(index===0){
     scene.background.set(0x75d7ff);scene.fog.color.set(0xbdeeff);
     roadMat.color.set(0xf0c995);edgeMat.color.set(0xf2b23b);grassMat.color.set(0x67ce62);
     const cityColors=[0xdde8f4,0xb8cee2,0xf3e3ca,0xa9bad5];
     for(let i=0;i<22;i++){
       const h=4+(i%5)*1.7;
       const m=new THREE.Mesh(new THREE.BoxGeometry(3+(i%3),h,3.4),new THREE.MeshStandardMaterial({color:cityColors[i%cityColors.length],roughness:.82}));
       m.position.set((i%2?1:-1)*(10.5+(i%4)*1.8),h/2+.4,-22-i*14);addMover(m,330);
     }
     const tower=new THREE.Group();
     const mastMat=new THREE.MeshStandardMaterial({color:0xf05a4f,roughness:.6});
     const mast=new THREE.Mesh(new THREE.CylinderGeometry(.32,.65,9,8),mastMat);mast.position.y=4.5;tower.add(mast);
     const deck=new THREE.Mesh(new THREE.BoxGeometry(3,.45,1.6),new THREE.MeshStandardMaterial({color:0xffffff}));deck.position.y=5.7;tower.add(deck);
     tower.position.set(-13,.3,-110);addMover(tower,330);
   }else if(index===1){
     scene.background.set(0x65d9f1);scene.fog.color.set(0xb8f3f4);
     roadMat.color.set(0xf4d7a1);edgeMat.color.set(0xf0b345);grassMat.color.set(0x6ccf70);
     const waterMat=new THREE.MeshStandardMaterial({color:0x35b7e8,roughness:.35,metalness:.08,transparent:true,opacity:.88});
     [-14,14].forEach(x=>{
       const water=new THREE.Mesh(new THREE.BoxGeometry(15,.35,330),waterMat.clone());water.position.set(x,-1.0,-135);stageDecor.add(water);
     });
     const bridgeMat=new THREE.MeshStandardMaterial({color:0xf4f6fa,roughness:.6});
     for(let i=0;i<8;i++){
       const p=new THREE.Group();
       const column=new THREE.Mesh(new THREE.BoxGeometry(.7,5,.7),bridgeMat);column.position.y=2.5;p.add(column);
       const cable=new THREE.Mesh(new THREE.TorusGeometry(2.4,.08,6,18,Math.PI),new THREE.MeshStandardMaterial({color:0xe8eef7}));cable.rotation.z=Math.PI;cable.position.set(0,4.5,0);p.add(cable);
       p.position.set((i%2?1:-1)*12,.4,-30-i*38);addMover(p,340);
     }
   }else{
     const hue=(index*29)%360;
     const bg=new THREE.Color().setHSL(hue/360,.55,.72);
     scene.background.copy(bg);scene.fog.color.copy(bg.clone().lerp(new THREE.Color(0xffffff),.48));
     roadMat.color.setHSL(((hue+35)%360)/360,.45,.72);
     edgeMat.color.setHSL(((hue+5)%360)/360,.72,.56);
     grassMat.color.setHSL(((hue+110)%360)/360,.45,.52);
   }
 }

 const finishGate=new THREE.Group();
 const finishWhite=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.45});
 const finishGold=new THREE.MeshStandardMaterial({color:0xffd83f,emissive:0x8a5b00,emissiveIntensity:.4});
 [-4.3,4.3].forEach(x=>{
   const pillar=new THREE.Mesh(new THREE.BoxGeometry(.75,6,.75),finishWhite);pillar.position.set(x,3,0);finishGate.add(pillar);
 });
 const topBar=new THREE.Mesh(new THREE.BoxGeometry(9.3,.8,.8),finishGold);topBar.position.y=6.1;finishGate.add(topBar);
 const flagL=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.0,.08),finishGold);flagL.position.set(-3.1,6.9,0);finishGate.add(flagL);
 const flagR=flagL.clone();flagR.position.x=3.1;finishGate.add(flagR);
 finishGate.visible=false;scene.add(finishGate);

 function triggerClear(){
   if(state.transition)return;
   state.transition=true;press.left=false;press.right=false;
   clearPref.textContent=PREFECTURES[state.stageIndex];
   const nextIndex=state.stageIndex+1;
   nextPref.textContent=nextIndex<PREFECTURES.length?"つぎは "+PREFECTURES[nextIndex]:"日本一周 COMPLETE!";
   clearLayer.classList.add('show');
   setTimeout(()=>{
     if(nextIndex<PREFECTURES.length){
       state.stageIndex=nextIndex;state.stageDistance=0;state.targetX=0;player.position.x=0;finishGate.visible=false;
       applyStageTheme(state.stageIndex);
       clearLayer.classList.remove('show');state.transition=false;state.last=performance.now();
     }else{
       nextPref.textContent="東京から北海道まで 47都道府県クリア！";
     }
   },1700);
 }
 applyStageTheme(0);

 function jump(){if(state.y<=.02)state.vy=9.3}
 function bindHold(id,key){
   const el=document.getElementById(id);
   el.addEventListener('pointerdown',e=>{e.preventDefault();press[key]=true;el.setPointerCapture?.(e.pointerId)});
   ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>press[key]=false));
 }
 bindHold('left','left');bindHold('right','right');
 document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
 addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')press.left=true;if(e.key==='ArrowRight'||e.key==='d')press.right=true;if(e.code==='Space'){e.preventDefault();jump()}});
 addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')press.left=false;if(e.key==='ArrowRight'||e.key==='d')press.right=false});

 function doBoost(){state.boost=1.25;boost.classList.add('show');setTimeout(()=>boost.classList.remove('show'),470)}

 function frame(now){
   requestAnimationFrame(frame);
   const dt=Math.min((now-state.last)/1000,.034);state.last=now;
   const grow=Math.min(1,Math.sqrt(state.totalDistance/TOTAL_ROUTE)),speed=12+grow*18+(state.boost>0?11:0);
   if(state.boost>0)state.boost-=dt;
   const dz=state.transition?0:speed*dt;
   if(!state.transition){
     const gained=dz*.9;state.totalDistance+=gained;state.stageDistance+=gained;
     if(state.stageDistance>=STAGE_LENGTH)triggerClear();
   }

   const lateral=(press.right?1:0)-(press.left?1:0);
   state.targetX=THREE.MathUtils.clamp(state.targetX+lateral*8.3*dt,-4.0,4.0);
   player.position.x=THREE.MathUtils.lerp(player.position.x,state.targetX,1-Math.pow(.001,dt));

   state.vy-=22*dt;state.y+=state.vy*dt;if(state.y<0){state.y=0;state.vy=0}
   player.position.y=.3+state.y;

   const cycle=now*.0155*(1+speed/24);
   legL.rotation.x=Math.sin(cycle)*.78;legR.rotation.x=-Math.sin(cycle)*.78;
   armL.rotation.x=-Math.sin(cycle)*.6;armR.rotation.x=Math.sin(cycle)*.6;
   torso.rotation.z=-player.position.x*.025;

   segments.forEach(g=>{g.position.z+=dz;if(g.position.z>segLen)g.position.z-=segLen*segments.length});
   trees.forEach(g=>{g.position.z+=dz;if(g.position.z>16)g.position.z-=320});
   clouds.forEach(g=>{g.position.z+=dz*.45;if(g.position.z>26)g.position.z-=350});
   islands.forEach(g=>{g.position.z+=dz*.35;if(g.position.z>32)g.position.z-=330});
   castle.position.z+=dz*.18;if(castle.position.z>8)castle.position.z=-150;
   stageMovers.forEach(o=>{o.position.z+=dz;if(o.position.z>28)o.position.z-=o.userData.wrap||330});
   const remaining=Math.max(0,STAGE_LENGTH-state.stageDistance);
   finishGate.visible=remaining<=120&&!state.transition;
   if(finishGate.visible)finishGate.position.set(0,.35,player.position.z-(remaining/.9));
   rings.forEach(r=>{r.position.z+=dz;if(r.position.z>20)r.position.z-=300});
   stars.forEach(s=>{s.position.z+=dz;s.rotation.x+=dt*2.5;s.rotation.y+=dt*4;if(s.position.z>10){s.position.z-=265;s.position.x=(Math.floor(Math.random()*3)-1)*2.25;s.visible=true}if(s.visible&&Math.abs(s.position.z-player.position.z)<1.35&&Math.abs(s.position.x-player.position.x)<1.05&&state.y<2.2){s.visible=false;state.count++;starCount.textContent=state.count}});
   pads.forEach(p=>{p.position.z+=dz;if(p.position.z>15)p.position.z-=220;if(Math.abs(p.position.z-player.position.z)<1.8&&Math.abs(player.position.x)<3&&state.y<.7&&state.boost<=0)doBoost()});
   trails.forEach((t,i)=>{t.material.opacity=.08+grow*.36+(state.boost>0?.28:0);t.scale.z=1+grow*1.8+(state.boost>0?1.5:0);t.position.x=player.position.x+((i%3)-1)*.74});

   const portrait=innerHeight>innerWidth;
   camera.fov=(portrait?58:64)+grow*11+(state.boost>0?7:0);camera.updateProjectionMatrix();
   camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.26,.08);
   camera.position.y=(portrait?5.7:5.35)+state.y*.12;
   camera.position.z=portrait?11.7:10.4;
   camera.lookAt(player.position.x*.14,1.75,portrait?-16:-14);

   const lv=Math.min(100,1+Math.floor(state.totalDistance/(TOTAL_ROUTE/99)));if(lv!==state.level){state.level=lv;levelEl.textContent=lv}
   meters.textContent=Math.max(0,Math.ceil(STAGE_LENGTH-state.stageDistance))+'m';
   progress.style.width=Math.min(100,state.stageDistance/STAGE_LENGTH*100)+'%';
   renderer.render(scene,camera);
 }
 requestAnimationFrame(frame);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
}
</script>
</body>
</html>
