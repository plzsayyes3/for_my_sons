<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スライム | For My Sons</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ece9e2;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  #landscape-root {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    transform-origin: 50% 50%;
    background: #ece9e2;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* Portrait gets no portrait composition at all. Render one landscape stage
     and rotate that stage as a whole. */
  @media (orientation: portrait) {
    #landscape-root {
      left: 50%;
      top: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  }

  .hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .chip {
    border: 1px solid rgba(30,34,40,.12);
    background: rgba(255,255,255,.66);
    color: #27313a;
    border-radius: 999px;
    padding: 9px 12px;
    font-size: 12px;
    line-height: 1;
    box-shadow: 0 8px 26px rgba(34,38,44,.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  button.chip {
    pointer-events: auto;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  a.chip {
    pointer-events: auto;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .hint {
    margin-left: auto;
    opacity: .72;
  }
  .loading {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    color: #59636b;
    font-size: 13px;
    letter-spacing: .04em;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .loading.hide { opacity: 0; }
</style>
</head>
<body>
<div id="landscape-root">
  <canvas id="scene" aria-label="Rady translucent jelly 3D sample"></canvas>

  <div class="hud">
    <a class="chip" href="../" aria-label="For My Sonsにもどる">‹ HOME</a>
    <button class="chip" id="reset" type="button">RESET</button>
    <button class="chip" id="gravity" type="button">GRAVITY ON</button>
    <button class="chip" id="motion" type="button">ジャイロ OFF</button>
    <div class="chip hint">画面を傾ける・引っぱる・つまむ・飛ばす</div>
  </div>

  <div class="loading" id="loading">3D JELLY LOADING…</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const root = document.getElementById("landscape-root");
const canvas = document.getElementById("scene");
const loading = document.getElementById("loading");
const resetButton = document.getElementById("reset");
const gravityButton = document.getElementById("gravity");
const motionButton = document.getElementById("motion");

function landscapeViewport() {
  return innerWidth >= innerHeight
    ? { width: innerWidth, height: innerHeight, rotated: false }
    : { width: innerHeight, height: innerWidth, rotated: true };
}

let viewport = landscapeViewport();

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(viewport.width, viewport.height, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeae3);

const VIEW_HEIGHT = 3.05;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 50);

function applyCameraFraming() {
  const aspect = viewport.width / viewport.height;
  camera.left = -VIEW_HEIGHT * aspect * 0.5;
  camera.right = VIEW_HEIGHT * aspect * 0.5;
  camera.top = VIEW_HEIGHT * 0.5;
  camera.bottom = -VIEW_HEIGHT * 0.5;
  camera.updateProjectionMatrix();
}

camera.position.set(0, 1.18, 7.2);
camera.lookAt(0, 1.18, 0);
applyCameraFraming();

const clock = new THREE.Clock();

// -----------------------------------------------------------------------------
// Studio lighting
// -----------------------------------------------------------------------------

scene.add(new THREE.HemisphereLight(0xffffff, 0x9b826a, 2.15));

const keyLight = new THREE.DirectionalLight(0xffffff, 4.3);
keyLight.position.set(-3.6, 6.8, 4.8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.1;
keyLight.shadow.camera.far = 16;
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xd8efff, 7.0, 10, 2);
fillLight.position.set(3.2, 3.4, 3.2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xfff2d6, 6.0, 9, 2);
rimLight.position.set(-2.4, 2.2, -2.8);
scene.add(rimLight);

// -----------------------------------------------------------------------------
// Background / room
// -----------------------------------------------------------------------------

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 8),
  new THREE.MeshStandardMaterial({
    color: 0xf0ede7,
    roughness: 0.92,
    metalness: 0
  })
);
backWall.position.set(0, 2.5, -3.6);
backWall.receiveShadow = true;
scene.add(backWall);

// Soft "window" light panel in the background, mainly visible through the jelly.
const windowGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.5, 2.3),
  new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.72,
    depthWrite: false
  })
);
windowGlow.position.set(2.25, 2.15, -3.54);
scene.add(windowGlow);

// -----------------------------------------------------------------------------
// Desk: this is the physical ground at y = 0.
// -----------------------------------------------------------------------------

const TABLE_Y = 0;
const TABLE_THICKNESS = 0.42;

function makeWoodTexture() {
  const size = 512;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");

  const g = x.createLinearGradient(0, 0, size, 0);
  g.addColorStop(0, "#d8b890");
  g.addColorStop(.45, "#e4c7a3");
  g.addColorStop(1, "#cfaa7f");
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);

  // deterministic grain, no animation/flicker.
  for (let i = 0; i < 75; i++) {
    const y = (i * 71) % size;
    const width = 0.6 + ((i * 17) % 21) / 15;
    const alpha = 0.025 + ((i * 13) % 11) / 500;

    x.strokeStyle = `rgba(91,60,35,${alpha})`;
    x.lineWidth = width;
    x.beginPath();

    for (let px = -20; px <= size + 20; px += 18) {
      const wave =
        Math.sin((px + i * 19) * 0.025) * 2.2 +
        Math.sin((px + i * 7) * 0.071) * 0.9;
      if (px === -20) x.moveTo(px, y + wave);
      else x.lineTo(px, y + wave);
    }
    x.stroke();
  }

  for (let i = 0; i < 6; i++) {
    const px = 55 + i * 83;
    const py = 72 + ((i * 107) % 330);
    x.strokeStyle = "rgba(100,64,38,.055)";
    x.lineWidth = 2;
    x.beginPath();
    x.ellipse(px, py, 18 + i * 1.7, 5.5, -.12, 0, Math.PI * 2);
    x.stroke();
  }

  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.6, 1.65);
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

const woodTexture = makeWoodTexture();

const desk = new THREE.Mesh(
  new THREE.BoxGeometry(8.2, TABLE_THICKNESS, 5.0),
  new THREE.MeshStandardMaterial({
    map: woodTexture,
    color: 0xffffff,
    roughness: 0.58,
    metalness: 0
  })
);
desk.position.set(0, TABLE_Y - TABLE_THICKNESS / 2, 0);
desk.receiveShadow = true;
scene.add(desk);

// A darker front edge makes the object read as an actual table rather than a plane.
const deskFront = new THREE.Mesh(
  new THREE.BoxGeometry(8.24, 0.16, 0.12),
  new THREE.MeshStandardMaterial({
    color: 0xb78d65,
    roughness: 0.72
  })
);
deskFront.position.set(0, -0.18, 2.49);
scene.add(deskFront);

// Two minimal legs, visible mainly on taller screens.
const legMaterial = new THREE.MeshStandardMaterial({
  color: 0x9f7958,
  roughness: 0.78
});
for (const x of [-2.85, 2.85]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 2.8, 0.48),
    legMaterial
  );
  leg.position.set(x, -1.56, 0.85);
  leg.castShadow = true;
  scene.add(leg);
}

// -----------------------------------------------------------------------------
// Clear container: no water. The jelly lives inside a transparent acrylic box.
// -----------------------------------------------------------------------------

const CONTAINER = {
  halfX: 2.42,
  halfZ: 0.78,
  height: 2.35,
  wall: 0.035
};

const containerGroup = new THREE.Group();
scene.add(containerGroup);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xeaf8ff,
  roughness: 0.055,
  metalness: 0,
  transmission: 0.88,
  transparent: true,
  opacity: 0.095,
  thickness: 0.08,
  ior: 1.45,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  depthWrite: false,
  side: THREE.DoubleSide
});

const rimMaterial = new THREE.MeshStandardMaterial({
  color: 0xa8c5d1,
  roughness: 0.32,
  transparent: true,
  opacity: 0.55,
  depthWrite: false
});

function addGlassPanel(geometry, x, y, z) {
  const panel = new THREE.Mesh(geometry, glassMaterial);
  panel.position.set(x, y, z);
  panel.renderOrder = 5;
  containerGroup.add(panel);
  return panel;
}

addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.wall, CONTAINER.height, CONTAINER.halfZ * 2),
  -CONTAINER.halfX, CONTAINER.height * 0.5, 0
);
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.wall, CONTAINER.height, CONTAINER.halfZ * 2),
  CONTAINER.halfX, CONTAINER.height * 0.5, 0
);
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.halfX * 2, CONTAINER.height, CONTAINER.wall),
  0, CONTAINER.height * 0.5, -CONTAINER.halfZ
);
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.halfX * 2, CONTAINER.height, CONTAINER.wall),
  0, CONTAINER.height * 0.5, CONTAINER.halfZ
);

// Very faint clear lid: visually subtle, physically keeps thrown jelly inside.
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.halfX * 2, CONTAINER.wall, CONTAINER.halfZ * 2),
  0, CONTAINER.height, 0
);

const rimH = CONTAINER.height;
for (const x of [-CONTAINER.halfX, CONTAINER.halfX]) {
  for (const z of [-CONTAINER.halfZ, CONTAINER.halfZ]) {
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, rimH, 0.025),
      rimMaterial
    );
    post.position.set(x, rimH * 0.5, z);
    containerGroup.add(post);
  }
}

for (const y of [0.015, CONTAINER.height]) {
  const frontRim = new THREE.Mesh(
    new THREE.BoxGeometry(CONTAINER.halfX * 2, 0.025, 0.025),
    rimMaterial
  );
  frontRim.position.set(0, y, CONTAINER.halfZ);
  containerGroup.add(frontRim);

  const backRim = frontRim.clone();
  backRim.position.z = -CONTAINER.halfZ;
  containerGroup.add(backRim);

  const leftRim = new THREE.Mesh(
    new THREE.BoxGeometry(0.025, 0.025, CONTAINER.halfZ * 2),
    rimMaterial
  );
  leftRim.position.set(-CONTAINER.halfX, y, 0);
  containerGroup.add(leftRim);

  const rightRim = leftRim.clone();
  rightRim.position.x = CONTAINER.halfX;
  containerGroup.add(rightRim);
}

// -----------------------------------------------------------------------------
// Contact shadow texture
// -----------------------------------------------------------------------------

function makeShadowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(128, 128, 4, 128, 128, 124);
  g.addColorStop(0, "rgba(20,18,16,.34)");
  g.addColorStop(.4, "rgba(20,18,16,.18)");
  g.addColorStop(1, "rgba(20,18,16,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

const blobShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.65, 1.28),
  new THREE.MeshBasicMaterial({
    map: makeShadowTexture(),
    transparent: true,
    depthWrite: false,
    opacity: .34
  })
);
blobShadow.rotation.x = -Math.PI / 2;
blobShadow.position.y = TABLE_Y + 0.004;
scene.add(blobShadow);

// -----------------------------------------------------------------------------
// Rady jelly: true WebGL mesh with physical transmission.
// -----------------------------------------------------------------------------

const jellyGroup = new THREE.Group();
scene.add(jellyGroup);

const jellyGeometry = new THREE.SphereGeometry(0.62, 36, 28);
const positionAttribute = jellyGeometry.attributes.position;
const basePositions = new Float32Array(positionAttribute.array.length);
basePositions.set(positionAttribute.array);

const jellyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xeaf6fb,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.93,
  transparent: true,
  opacity: 0.96,
  thickness: 1.55,
  ior: 1.36,
  clearcoat: 1,
  clearcoatRoughness: 0.075,
  attenuationColor: new THREE.Color(0xc9e5ef),
  attenuationDistance: 2.4,
  specularIntensity: 1.0,
  specularColor: new THREE.Color(0xffffff),
  side: THREE.FrontSide
});

const jelly = new THREE.Mesh(jellyGeometry, jellyMaterial);
jelly.castShadow = true;
jelly.receiveShadow = false;
jellyGroup.add(jelly);

// A very faint inner mass makes the body feel denser like warabi-mochi.
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.47, 28, 20),
  new THREE.MeshPhysicalMaterial({
    color: 0xd6edf4,
    roughness: 0.16,
    transmission: 0.75,
    transparent: true,
    opacity: 0.11,
    thickness: 0.7,
    ior: 1.32,
    depthWrite: false
  })
);
core.scale.set(1.0, 0.92, 0.96);
jellyGroup.add(core);

// -----------------------------------------------------------------------------
// Rady face, slightly embedded in the front of the translucent mesh.
// -----------------------------------------------------------------------------

const face = new THREE.Group();
jellyGroup.add(face);

const faceMaterial = new THREE.MeshBasicMaterial({
  color: 0x3b4b57,
  transparent: true,
  opacity: 0.95,
  depthTest: false,
  depthWrite: false
});

const eyeGeometry = new THREE.SphereGeometry(0.038, 14, 10);

const leftEye = new THREE.Mesh(eyeGeometry, faceMaterial);
const rightEye = new THREE.Mesh(eyeGeometry, faceMaterial);
leftEye.scale.set(1.0, 0.65, 0.55);
rightEye.scale.copy(leftEye.scale);
face.add(leftEye, rightEye);
leftEye.renderOrder = 20;
rightEye.renderOrder = 20;

const mouthCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.050, 0.013, 0),
  new THREE.Vector3(-0.020, -0.010, 0.014),
  new THREE.Vector3(0.020, -0.010, 0.014),
  new THREE.Vector3(0.050, 0.013, 0)
]);

const mouth = new THREE.Mesh(
  new THREE.TubeGeometry(mouthCurve, 14, 0.008, 6, false),
  faceMaterial
);
face.add(mouth);
mouth.renderOrder = 20;

// -----------------------------------------------------------------------------
// Body dynamics — 2.5D PBD soft body
// -----------------------------------------------------------------------------

const FIXED_DT = 1 / 120;
const SOLVER_ITERATIONS = 8;
const PARTICLE_DAMPING = 0.994;
const REST_RADIUS = 0.62;
const SOFT_START_Y = 1.42;

const state = {
  position: new THREE.Vector3(0, SOFT_START_Y, 0),
  velocity: new THREE.Vector3(),

  gravityOn: true,
  dragging: false,
  pinching: false,
  touchFloat: 0,

  grabTarget: new THREE.Vector2(),
  grabTargetSoft: new THREE.Vector2(),
  grabVelocity: new THREE.Vector2(),
  grabWeights: null,

  pinchAmount: 0,
  pinchTarget: 0,
  pinchVelocity: 0,
  pinchStartDistance: 0,

  motion: {
    enabled: false,
    permission: "unknown",
    gravityX: 0,
    gravityY: 0,
    linearX: 0,
    linearY: 0,
    linearZ: 0
  }
};

class SoftParticle {
  constructor(restX, restY, x, y, ring = 0) {
    this.restX = restX;
    this.restY = restY;
    this.x = x;
    this.y = y;
    this.px = x;
    this.py = y;
    this.ring = ring;
    this.contact = 0;
  }

  integrate(ax, ay, dt) {
    const vx = (this.x - this.px) * PARTICLE_DAMPING;
    const vy = (this.y - this.py) * PARTICLE_DAMPING;

    this.px = this.x;
    this.py = this.y;

    this.x += vx + ax * dt * dt;
    this.y += vy + ay * dt * dt;
    this.contact = 0;
  }
}

let softParticles = [];
let softConstraints = [];
let outerIndices = [];
let restArea = 1;
let vertexInfluences = [];
let faceInfluences = null;
let normalUpdateFrame = 0;

function softCentroid() {
  let x = 0;
  let y = 0;
  for (const p of softParticles) {
    x += p.x;
    y += p.y;
  }
  return {
    x: x / softParticles.length,
    y: y / softParticles.length
  };
}

function polygonAreaFrom(indices, rest = false) {
  let sum = 0;
  for (let i = 0; i < indices.length; i++) {
    const a = softParticles[indices[i]];
    const b = softParticles[indices[(i + 1) % indices.length]];
    const ax = rest ? a.restX : a.x;
    const ay = rest ? a.restY : a.y;
    const bx = rest ? b.restX : b.x;
    const by = rest ? b.restY : b.y;
    sum += ax * by - bx * ay;
  }
  return Math.abs(sum * 0.5);
}

function addSoftConstraint(a, b, stiffness) {
  const pa = softParticles[a];
  const pb = softParticles[b];
  softConstraints.push({
    a,
    b,
    rest: Math.hypot(pb.restX - pa.restX, pb.restY - pa.restY),
    stiffness
  });
}

function buildSoftTopology() {
  softParticles = [];
  softConstraints = [];
  outerIndices = [];

  const add = (rx, ry, ring) => {
    softParticles.push(new SoftParticle(rx, ry, rx, SOFT_START_Y + ry, ring));
    return softParticles.length - 1;
  };

  add(0, 0, 0);

  const rings = [
    { radius: 0.21, count: 6, ring: 1 },
    { radius: 0.41, count: 12, ring: 2 },
    { radius: REST_RADIUS, count: 18, ring: 3 }
  ];

  for (const spec of rings) {
    for (let i = 0; i < spec.count; i++) {
      const angle = -Math.PI / 2 + i / spec.count * Math.PI * 2;
      const idx = add(
        Math.cos(angle) * spec.radius,
        Math.sin(angle) * spec.radius,
        spec.ring
      );
      if (spec.ring === 3) outerIndices.push(idx);
    }
  }

  // Dense local links give us a continuous pudding interior. Long links are
  // intentionally weak so the body can fold and stretch before recovering.
  for (let i = 0; i < softParticles.length; i++) {
    for (let j = i + 1; j < softParticles.length; j++) {
      const a = softParticles[i];
      const b = softParticles[j];
      const d = Math.hypot(b.restX - a.restX, b.restY - a.restY);

      if (d < 0.265) addSoftConstraint(i, j, 0.31);
      else if (d < 0.425) addSoftConstraint(i, j, 0.048);
    }
  }

  restArea = polygonAreaFrom(outerIndices, true);
  buildVertexInfluences();
}

function buildInfluenceFor(restX, restY, count = 6) {
  const sigma = 0.255;
  const candidates = softParticles.map((p, index) => {
    const dx = restX - p.restX;
    const dy = restY - p.restY;
    const d2 = dx * dx + dy * dy;
    return {
      index,
      d2,
      weight: Math.exp(-d2 / (2 * sigma * sigma))
    };
  });

  candidates.sort((a, b) => a.d2 - b.d2);
  const selected = candidates.slice(0, count);
  const total = selected.reduce((sum, item) => sum + item.weight, 0) || 1;

  return selected.map(item => ({
    index: item.index,
    weight: item.weight / total
  }));
}

function buildVertexInfluences() {
  vertexInfluences = new Array(positionAttribute.count);

  for (let i = 0; i < positionAttribute.count; i++) {
    const ix = i * 3;
    vertexInfluences[i] = buildInfluenceFor(
      basePositions[ix],
      basePositions[ix + 1],
      6
    );
  }

  faceInfluences = buildInfluenceFor(0, -0.015, 7);
}

function softMetrics() {
  const c = softCentroid();

  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  let vx = 0;
  let vy = 0;
  let contacts = 0;

  for (const p of softParticles) {
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x);
    maxY = Math.max(maxY, p.y);
    vx += (p.x - p.px) / FIXED_DT;
    vy += (p.y - p.py) / FIXED_DT;
    if (p.contact) contacts++;
  }

  return {
    c,
    minX,
    minY,
    maxX,
    maxY,
    width: maxX - minX,
    height: maxY - minY,
    vx: vx / softParticles.length,
    vy: vy / softParticles.length,
    contacts,
    area: polygonAreaFrom(outerIndices, false)
  };
}

function resetJelly() {
  if (!softParticles.length) buildSoftTopology();

  const centerX = 0;
  const centerY = SOFT_START_Y;

  for (const p of softParticles) {
    p.x = centerX + p.restX;
    p.y = centerY + p.restY;
    p.px = p.x;
    p.py = p.y;
    p.contact = 0;
  }

  state.position.set(centerX, centerY, 0);
  state.velocity.set(0, 0, 0);
  state.dragging = false;
  state.pinching = false;
  state.touchFloat = 0;
  state.grabWeights = null;
  state.grabVelocity.set(0, 0);
  state.pinchAmount = 0;
  state.pinchTarget = 0;
  state.pinchVelocity = 0;
  state.pinchStartDistance = 0;

  state.motion.gravityX = 0;
  state.motion.gravityY = 0;
  state.motion.linearX = 0;
  state.motion.linearY = 0;
  state.motion.linearZ = 0;
}

function solveDistanceConstraint(c) {
  const a = softParticles[c.a];
  const b = softParticles[c.b];

  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 0.00001;
  const diff = (len - c.rest) / len;
  const amount = diff * 0.5 * c.stiffness;

  const ox = dx * amount;
  const oy = dy * amount;

  a.x += ox;
  a.y += oy;
  b.x -= ox;
  b.y -= oy;
}

function solveAreaPressure() {
  const c = softCentroid();
  const area = polygonAreaFrom(outerIndices, false);
  const error = THREE.MathUtils.clamp((restArea - area) / restArea, -0.7, 0.7);
  const pressure = 0.034;

  for (const index of outerIndices) {
    const p = softParticles[index];
    const dx = p.x - c.x;
    const dy = p.y - c.y;
    p.x += dx * error * pressure;
    p.y += dy * error * pressure;
  }
}

function solveShapeMemory() {
  const c = softCentroid();
  const strength = 0.007;

  for (const p of softParticles) {
    const targetX = c.x + p.restX;
    const targetY = c.y + p.restY;

    const ringSoftness = p.ring === 3 ? 0.72 : 1;
    p.x += (targetX - p.x) * strength * ringSoftness;
    p.y += (targetY - p.y) * strength * ringSoftness;
  }
}

function solvePinch(dt) {
  const stiffness = state.pinching ? 25 : 9;
  const damping = state.pinching ? 6.5 : 2.7;
  const delta = state.pinchTarget - state.pinchAmount;

  state.pinchVelocity +=
    (delta * stiffness - state.pinchVelocity * damping) * dt;
  state.pinchAmount += state.pinchVelocity * dt;
  state.pinchAmount = THREE.MathUtils.clamp(state.pinchAmount, -0.48, 0.58);

  if (Math.abs(state.pinchAmount) < 0.001) return;

  const c = softCentroid();
  const scaleX = THREE.MathUtils.clamp(1 - state.pinchAmount * 0.30, 0.78, 1.20);
  const scaleY = THREE.MathUtils.clamp(1 + state.pinchAmount * 0.22, 0.80, 1.28);
  const correction = state.pinching ? 0.045 : 0.012;

  for (const p of softParticles) {
    const tx = c.x + p.restX * scaleX;
    const ty = c.y + p.restY * scaleY;
    p.x += (tx - p.x) * correction;
    p.y += (ty - p.y) * correction;
  }
}

function applyGrabConstraint() {
  if (!state.dragging || !state.grabWeights) return;

  let ax = 0;
  let ay = 0;
  let total = 0;

  for (let i = 0; i < softParticles.length; i++) {
    const w = state.grabWeights[i];
    if (w < 0.001) continue;
    ax += softParticles[i].x * w;
    ay += softParticles[i].y * w;
    total += w;
  }

  if (total <= 0) return;

  ax /= total;
  ay /= total;

  let dx = state.grabTargetSoft.x - ax;
  let dy = state.grabTargetSoft.y - ay;

  const length = Math.hypot(dx, dy);
  const maxPull = 1.15;
  if (length > maxPull) {
    dx *= maxPull / length;
    dy *= maxPull / length;
  }

  for (let i = 0; i < softParticles.length; i++) {
    const w = state.grabWeights[i];
    if (w < 0.001) continue;

    // The touched patch leads strongly. Neighbor constraints make the rest of
    // the pudding arrive later, which is the key difference from mesh scaling.
    const strength = 0.19 * w;
    softParticles[i].x += dx * strength;
    softParticles[i].y += dy * strength;
  }
}

function collideParticle(p) {
  const margin = 0.028;
  const minX = -CONTAINER.halfX + margin;
  const maxX = CONTAINER.halfX - margin;
  const minY = TABLE_Y + margin;
  const maxY = CONTAINER.height - margin;

  if (p.x < minX) {
    const vx = p.x - p.px;
    p.x = minX;
    p.px = p.x + vx * 0.08;
    p.contact |= 1;
  } else if (p.x > maxX) {
    const vx = p.x - p.px;
    p.x = maxX;
    p.px = p.x + vx * 0.08;
    p.contact |= 1;
  }

  if (p.y < minY) {
    const vx = p.x - p.px;
    const vy = p.y - p.py;
    p.y = minY;
    p.py = p.y + vy * 0.045;
    p.px = p.x - vx * 0.91;
    p.contact |= 2;
  } else if (p.y > maxY) {
    const vy = p.y - p.py;
    p.y = maxY;
    p.py = p.y + vy * 0.045;
    p.contact |= 4;
  }
}

function screenAngle() {
  if (screen.orientation && Number.isFinite(screen.orientation.angle)) {
    return ((screen.orientation.angle % 360) + 360) % 360;
  }

  if (typeof window.orientation === "number") {
    return ((window.orientation % 360) + 360) % 360;
  }

  return 0;
}

function deviceVectorToStage(x, y) {
  const angle = screenAngle();

  let sx = x;
  let sy = y;

  if (angle === 90) {
    sx = -y;
    sy = x;
  } else if (angle === 180) {
    sx = -x;
    sy = -y;
  } else if (angle === 270) {
    sx = y;
    sy = -x;
  }

  // When iOS keeps the physical viewport portrait while our entire app is
  // rendered as a clockwise landscape stage, rotate the sensor axes by the
  // exact same transform. Sensor force then always matches what the eye sees.
  if (viewport.rotated) {
    return { x: sy, y: -sx };
  }

  return { x: sx, y: sy };
}

function onDeviceMotion(event) {
  if (!state.motion.enabled) return;

  const g = event.accelerationIncludingGravity || {};
  const linear = event.acceleration || {};

  const gravityStage = deviceVectorToStage(
    Number.isFinite(g.x) ? g.x : 0,
    Number.isFinite(g.y) ? g.y : 0
  );

  const linearStage = deviceVectorToStage(
    Number.isFinite(linear.x) ? linear.x : 0,
    Number.isFinite(linear.y) ? linear.y : 0
  );

  const gravityMix = 0.12;
  state.motion.gravityX += (gravityStage.x - state.motion.gravityX) * gravityMix;
  state.motion.gravityY += (gravityStage.y - state.motion.gravityY) * gravityMix;

  const linearMix = 0.30;
  state.motion.linearX += (linearStage.x - state.motion.linearX) * linearMix;
  state.motion.linearY += (linearStage.y - state.motion.linearY) * linearMix;
  state.motion.linearZ += (
    (Number.isFinite(linear.z) ? linear.z : 0) - state.motion.linearZ
  ) * linearMix;
}

async function tryLandscapeLock() {
  try {
    if (screen.orientation?.lock) await screen.orientation.lock("landscape");
  } catch (_) {
    // iPhone Safari commonly rejects orientation lock. The rotated landscape
    // stage remains the source of truth in that case.
  }
}

async function enableMotion() {
  await tryLandscapeLock();

  try {
    if (
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ) {
      const permission = await DeviceMotionEvent.requestPermission();
      state.motion.permission = permission;

      if (permission !== "granted") {
        motionButton.textContent = "ジャイロ NG";
        return false;
      }
    }

    if (typeof DeviceMotionEvent === "undefined") {
      state.motion.permission = "unsupported";
      motionButton.textContent = "センサーなし";
      return false;
    }

    state.motion.enabled = true;
    state.motion.permission = "granted";
    addEventListener("devicemotion", onDeviceMotion, { passive: true });
    motionButton.textContent = "ジャイロ ON";
    return true;
  } catch (error) {
    console.warn("Motion sensor unavailable.", error);
    state.motion.permission = "error";
    motionButton.textContent = "ジャイロ ERROR";
    return false;
  }
}

function disableMotion() {
  state.motion.enabled = false;
  removeEventListener("devicemotion", onDeviceMotion);

  state.motion.gravityX = 0;
  state.motion.gravityY = 0;
  state.motion.linearX = 0;
  state.motion.linearY = 0;
  state.motion.linearZ = 0;

  motionButton.textContent = "ジャイロ OFF";
}

function externalAcceleration() {
  if (state.dragging) {
    state.touchFloat = 1;
  } else {
    state.touchFloat = Math.max(0, state.touchFloat - FIXED_DT * 1.8);
  }

  const releaseScale = state.dragging
    ? 0.08
    : THREE.MathUtils.lerp(1.0, 0.32, state.touchFloat);

  let ax = 0;
  let ay = state.gravityOn ? -7.7 * releaseScale : 0;

  if (state.gravityOn && state.motion.enabled) {
    // DeviceMotion reports support acceleration. Negating it gives gravity.
    // These axes are already transformed into the rendered landscape stage.
    ax = THREE.MathUtils.clamp(-state.motion.gravityX / 9.81, -1, 1) *
      7.7 * releaseScale;
    ay = THREE.MathUtils.clamp(-state.motion.gravityY / 9.81, -1, 1) *
      7.7 * releaseScale;
  }

  if (state.motion.enabled) {
    // Inertial kick from moving the container itself. Unlike tilt this is
    // intentionally short and is what makes the mass slosh into the walls.
    ax += THREE.MathUtils.clamp(-state.motion.linearX, -7, 7) * 0.52;
    ay += THREE.MathUtils.clamp(-state.motion.linearY, -7, 7) * 0.52;
  }

  if (state.dragging) {
    ax *= 0.24;
    ay *= 0.24;
  }

  return { ax, ay };
}

function physicsStep() {
  const { ax, ay } = externalAcceleration();

  if (state.dragging) {
    const follow = 1 - Math.exp(-19 * FIXED_DT);
    state.grabTargetSoft.x +=
      (state.grabTarget.x - state.grabTargetSoft.x) * follow;
    state.grabTargetSoft.y +=
      (state.grabTarget.y - state.grabTargetSoft.y) * follow;
  }

  for (const p of softParticles) {
    p.integrate(ax, ay, FIXED_DT);
  }

  for (let iteration = 0; iteration < SOLVER_ITERATIONS; iteration++) {
    for (const c of softConstraints) {
      solveDistanceConstraint(c);
    }

    solveAreaPressure();
    solveShapeMemory();
    solvePinch(FIXED_DT);

    if ((iteration & 1) === 0) {
      applyGrabConstraint();
    }

    for (const p of softParticles) {
      collideParticle(p);
    }
  }

  const m = softMetrics();
  state.position.set(m.c.x, m.c.y, 0);
  state.velocity.set(m.vx, m.vy, 0);
}

function sampleDisplacement(influences, centroid) {
  let dx = 0;
  let dy = 0;

  for (const influence of influences) {
    const p = softParticles[influence.index];
    dx += (
      p.x - centroid.x - p.restX
    ) * influence.weight;
    dy += (
      p.y - centroid.y - p.restY
    ) * influence.weight;
  }

  return { x: dx, y: dy };
}

function deformJelly(time) {
  const m = softMetrics();
  const array = positionAttribute.array;

  const safeArea = Math.max(m.area, restArea * 0.34);
  const thicknessScale = THREE.MathUtils.clamp(
    Math.sqrt(restArea / safeArea),
    0.72,
    1.48
  );

  const zKick = state.motion.enabled
    ? THREE.MathUtils.clamp(-state.motion.linearZ * 0.012, -0.07, 0.07)
    : 0;

  for (let i = 0; i < positionAttribute.count; i++) {
    const ix = i * 3;
    const bx = basePositions[ix];
    const by = basePositions[ix + 1];
    const bz = basePositions[ix + 2];

    const displacement = sampleDisplacement(vertexInfluences[i], m.c);

    let x = bx + displacement.x * 1.04;
    let y = by + displacement.y * 1.04;
    let z = bz * (thicknessScale + zKick);

    // Only a tiny skin flow remains. The large deformation now comes from
    // the particle body itself, not from fake global squash/stretch.
    const theta = Math.atan2(bz, bx);
    const skin =
      Math.sin(time * 2.35 + theta * 1.7 + by * 3.6) *
      (0.0032 + Math.min(Math.hypot(m.vx, m.vy), 5) * 0.0007);

    const radial = Math.hypot(bx, bz) || 1;
    x += bx / radial * skin;
    z += bz / radial * skin;

    array[ix] = x;
    array[ix + 1] = y;
    array[ix + 2] = z;
  }

  positionAttribute.needsUpdate = true;

  normalUpdateFrame++;
  if ((normalUpdateFrame & 1) === 0) {
    jellyGeometry.computeVertexNormals();
  }

  jellyGroup.position.set(m.c.x, m.c.y, 0);

  const widthScale = THREE.MathUtils.clamp(m.width / (REST_RADIUS * 2), 0.60, 1.65);
  const heightScale = THREE.MathUtils.clamp(m.height / (REST_RADIUS * 2), 0.60, 1.65);

  core.scale.set(
    widthScale * 0.82,
    heightScale * 0.82,
    thicknessScale * 0.78
  );
  core.position.set(0, 0, 0);

  const faceD = sampleDisplacement(faceInfluences, m.c);
  face.position.set(
    faceD.x * 0.78,
    faceD.y * 0.78,
    0.628 * thicknessScale + 0.018
  );
  face.rotation.z = THREE.MathUtils.clamp(-m.vx * 0.014, -0.16, 0.16);
  face.scale.set(
    THREE.MathUtils.clamp(widthScale, 0.72, 1.35),
    THREE.MathUtils.clamp(heightScale, 0.72, 1.35),
    1
  );

  leftEye.position.set(-0.142, 0.052, 0);
  rightEye.position.set(0.142, 0.052, 0);
  mouth.position.set(0, -0.047, 0.006);

  const heightFromFloor = Math.max(0, m.minY - TABLE_Y);
  blobShadow.position.x = m.c.x;
  blobShadow.position.z = 0;
  blobShadow.scale.set(
    THREE.MathUtils.clamp(widthScale * 0.95, 0.55, 1.55),
    THREE.MathUtils.clamp(0.72 + (1 - heightScale) * 0.25, 0.55, 1.10),
    1
  );
  blobShadow.material.opacity = THREE.MathUtils.clamp(
    0.34 - heightFromFloor * 0.15,
    0.05,
    0.34
  );
}

buildSoftTopology();

// -----------------------------------------------------------------------------
// Pointer interaction — grab local particles, pinch the body, throw on release
// -----------------------------------------------------------------------------

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const tempRayPoint = new THREE.Vector3();
const activePointers = new Map();

let lastGrabWorld = new THREE.Vector2();
let lastGrabTime = performance.now();

function setPointerNDC(event) {
  let nx;
  let ny;

  if (viewport.rotated) {
    nx = event.clientY / innerHeight;
    ny = 1 - event.clientX / innerWidth;
  } else {
    nx = event.clientX / innerWidth;
    ny = event.clientY / innerHeight;
  }

  pointerNDC.x = nx * 2 - 1;
  pointerNDC.y = -(ny * 2 - 1);
}

function pointerToFrontPlane(event) {
  setPointerNDC(event);
  raycaster.setFromCamera(pointerNDC, camera);

  if (!raycaster.ray.intersectPlane(interactionPlane, tempRayPoint)) {
    return null;
  }

  return tempRayPoint;
}

function makeParticleGrabWeights(x, y) {
  const sigma = 0.31;
  const weights = new Float32Array(softParticles.length);
  let max = 0;

  for (let i = 0; i < softParticles.length; i++) {
    const p = softParticles[i];
    const dx = p.x - x;
    const dy = p.y - y;
    const d2 = dx * dx + dy * dy;
    const w = Math.exp(-d2 / (2 * sigma * sigma));
    weights[i] = w;
    if (w > max) max = w;
  }

  if (max <= 0.001) return null;

  for (let i = 0; i < weights.length; i++) {
    weights[i] /= max;
  }

  return weights;
}

function pointerDistance() {
  const values = [...activePointers.values()];
  if (values.length < 2) return 0;

  const a = values[0];
  const b = values[1];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function beginPinchIfPossible() {
  if (activePointers.size < 2) return false;

  const distance = pointerDistance();
  if (distance <= 0) return false;

  state.pinching = true;
  state.dragging = false;
  state.grabWeights = null;
  state.pinchStartDistance = distance;
  state.pinchTarget = 0;
  state.pinchVelocity += 0.03;

  return true;
}

canvas.addEventListener("pointerdown", event => {
  tryLandscapeLock();

  if (!state.motion.enabled && state.motion.permission === "unknown") {
    enableMotion();
  }

  activePointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (activePointers.size >= 2 && beginPinchIfPossible()) {
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    return;
  }

  setPointerNDC(event);
  raycaster.setFromCamera(pointerNDC, camera);

  const hits = raycaster.intersectObject(jelly, false);
  if (!hits.length) return;

  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);

  const hit = hits[0];
  const weights = makeParticleGrabWeights(hit.point.x, hit.point.y);
  if (!weights) return;

  state.dragging = true;
  state.touchFloat = 1;
  state.grabWeights = weights;
  state.grabTarget.set(hit.point.x, hit.point.y);
  state.grabTargetSoft.copy(state.grabTarget);
  state.grabVelocity.set(0, 0);

  lastGrabWorld.copy(state.grabTarget);
  lastGrabTime = performance.now();

  // A touch dents the local particle patch rather than scaling the whole mesh.
  const c = softCentroid();
  for (let i = 0; i < softParticles.length; i++) {
    const w = weights[i];
    if (w < 0.06) continue;

    const p = softParticles[i];
    const dx = p.x - c.x;
    const dy = p.y - c.y;
    p.x -= dx * 0.010 * w;
    p.y -= dy * 0.010 * w;
  }
});

canvas.addEventListener("pointermove", event => {
  if (activePointers.has(event.pointerId)) {
    activePointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });
  }

  if (state.pinching && activePointers.size >= 2) {
    const distance = pointerDistance();

    if (state.pinchStartDistance > 0 && distance > 0) {
      const ratio = distance / state.pinchStartDistance;
      state.pinchTarget = THREE.MathUtils.clamp(
        (1 - ratio) * 1.55,
        -0.44,
        0.56
      );
    }

    return;
  }

  if (!state.dragging) return;

  const world = pointerToFrontPlane(event);
  if (!world) return;

  const now = performance.now();
  const elapsed = Math.max(0.008, (now - lastGrabTime) / 1000);

  state.grabVelocity.set(
    (world.x - lastGrabWorld.x) / elapsed,
    (world.y - lastGrabWorld.y) / elapsed
  );

  const speed = state.grabVelocity.length();
  if (speed > 7.0) state.grabVelocity.multiplyScalar(7.0 / speed);

  state.grabTarget.set(
    THREE.MathUtils.clamp(
      world.x,
      -CONTAINER.halfX + 0.03,
      CONTAINER.halfX - 0.03
    ),
    THREE.MathUtils.clamp(
      world.y,
      TABLE_Y + 0.03,
      CONTAINER.height - 0.03
    )
  );

  lastGrabWorld.set(world.x, world.y);
  lastGrabTime = now;
});

function releasePointer(event) {
  activePointers.delete(event.pointerId);

  if (state.pinching) {
    if (activePointers.size < 2) {
      state.pinching = false;
      state.pinchTarget = 0;
      state.pinchVelocity += -state.pinchAmount * 0.20;
    }
    return;
  }

  if (!state.dragging || !state.grabWeights) return;

  const throwX = THREE.MathUtils.clamp(state.grabVelocity.x, -6.0, 6.0);
  const throwY = THREE.MathUtils.clamp(state.grabVelocity.y, -6.0, 6.0);

  for (let i = 0; i < softParticles.length; i++) {
    const w = state.grabWeights[i];
    if (w < 0.01) continue;

    const p = softParticles[i];
    const currentVX = (p.x - p.px) / FIXED_DT;
    const currentVY = (p.y - p.py) / FIXED_DT;

    const vx = currentVX + throwX * 0.42 * w;
    const vy = currentVY + throwY * 0.42 * w;

    p.px = p.x - vx * FIXED_DT;
    p.py = p.y - vy * FIXED_DT;
  }

  state.dragging = false;
  state.touchFloat = 1;
  state.grabWeights = null;
  state.grabVelocity.set(0, 0);
}

canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);

// -----------------------------------------------------------------------------
// UI
// -----------------------------------------------------------------------------

resetButton.addEventListener("click", resetJelly);

gravityButton.addEventListener("click", () => {
  state.gravityOn = !state.gravityOn;
  gravityButton.textContent = state.gravityOn ? "GRAVITY ON" : "GRAVITY OFF";
});

motionButton.addEventListener("click", async () => {
  if (state.motion.enabled) disableMotion();
  else await enableMotion();
});

function resizeLandscapeStage() {
  viewport = landscapeViewport();
  applyCameraFraming();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(viewport.width, viewport.height, false);
}

addEventListener("resize", resizeLandscapeStage);
screen.orientation?.addEventListener?.("change", resizeLandscapeStage);

// -----------------------------------------------------------------------------
// Main loop
// -----------------------------------------------------------------------------

let last = performance.now();
let accumulator = 0;

function animate(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  accumulator += dt;

  let steps = 0;
  while (accumulator >= FIXED_DT && steps < 6) {
    physicsStep();
    accumulator -= FIXED_DT;
    steps++;
  }

  deformJelly(now / 1000);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

resizeLandscapeStage();
resetJelly();
deformJelly(0);
renderer.render(scene, camera);
loading.classList.add("hide");
setTimeout(() => loading.remove(), 350);
requestAnimationFrame(animate);
</script>
</body>
