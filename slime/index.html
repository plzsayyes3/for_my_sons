<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スライム | For My Sons</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ece9e2;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
    overscroll-behavior: none;
  }
  #landscape-root {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    transform-origin: 50% 50%;
    background: #ece9e2;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* Portrait gets no portrait composition at all. Render one landscape stage
     and rotate that stage as a whole. */
  @media (orientation: portrait) {
    #landscape-root {
      left: 50%;
      top: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  }

  .hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .chip {
    border: 1px solid rgba(30,34,40,.12);
    background: rgba(255,255,255,.66);
    color: #27313a;
    border-radius: 999px;
    padding: 9px 12px;
    font-size: 12px;
    line-height: 1;
    box-shadow: 0 8px 26px rgba(34,38,44,.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  button.chip {
    pointer-events: auto;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  a.chip {
    pointer-events: auto;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .hint {
    margin-left: auto;
    opacity: .72;
  }
  .loading {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    color: #59636b;
    font-size: 13px;
    letter-spacing: .04em;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .loading.hide { opacity: 0; }
</style>
</head>
<body>
<div id="landscape-root">
  <canvas id="scene" aria-label="Rady translucent jelly 3D sample"></canvas>

  <div class="hud">
    <a class="chip" href="../" aria-label="For My Sonsにもどる">‹ HOME</a>
    <button class="chip" id="reset" type="button">RESET</button>
    <button class="chip" id="gravity" type="button">GRAVITY ON</button>
    <button class="chip" id="motion" type="button">ジャイロ OFF</button>
    <div class="chip hint">画面を傾ける・引っぱる・つまむ・飛ばす</div>
  </div>

  <div class="loading" id="loading">3D JELLY LOADING…</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const root = document.getElementById("landscape-root");
const canvas = document.getElementById("scene");
const loading = document.getElementById("loading");
const resetButton = document.getElementById("reset");
const gravityButton = document.getElementById("gravity");
const motionButton = document.getElementById("motion");

function landscapeViewport() {
  return innerWidth >= innerHeight
    ? { width: innerWidth, height: innerHeight, rotated: false }
    : { width: innerHeight, height: innerWidth, rotated: true };
}

let viewport = landscapeViewport();

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(viewport.width, viewport.height, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeae3);

const camera = new THREE.PerspectiveCamera(28, viewport.width / viewport.height, 0.05, 50);
// Front-on composition: no looking down into the box. The container is read as
// a clear case seen straight from the front.
camera.position.set(0, 1.18, 7.2);
camera.lookAt(0, 1.18, 0);

const clock = new THREE.Clock();

// -----------------------------------------------------------------------------
// Studio lighting
// -----------------------------------------------------------------------------

scene.add(new THREE.HemisphereLight(0xffffff, 0x9b826a, 2.15));

const keyLight = new THREE.DirectionalLight(0xffffff, 4.3);
keyLight.position.set(-3.6, 6.8, 4.8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.1;
keyLight.shadow.camera.far = 16;
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xd8efff, 7.0, 10, 2);
fillLight.position.set(3.2, 3.4, 3.2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xfff2d6, 6.0, 9, 2);
rimLight.position.set(-2.4, 2.2, -2.8);
scene.add(rimLight);

// -----------------------------------------------------------------------------
// Background / room
// -----------------------------------------------------------------------------

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 8),
  new THREE.MeshStandardMaterial({
    color: 0xf0ede7,
    roughness: 0.92,
    metalness: 0
  })
);
backWall.position.set(0, 2.5, -3.6);
backWall.receiveShadow = true;
scene.add(backWall);

// Soft "window" light panel in the background, mainly visible through the jelly.
const windowGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.5, 2.3),
  new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.72,
    depthWrite: false
  })
);
windowGlow.position.set(2.25, 2.15, -3.54);
scene.add(windowGlow);

// -----------------------------------------------------------------------------
// Desk: this is the physical ground at y = 0.
// -----------------------------------------------------------------------------

const TABLE_Y = 0;
const TABLE_THICKNESS = 0.42;

function makeWoodTexture() {
  const size = 512;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");

  const g = x.createLinearGradient(0, 0, size, 0);
  g.addColorStop(0, "#d8b890");
  g.addColorStop(.45, "#e4c7a3");
  g.addColorStop(1, "#cfaa7f");
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);

  // deterministic grain, no animation/flicker.
  for (let i = 0; i < 75; i++) {
    const y = (i * 71) % size;
    const width = 0.6 + ((i * 17) % 21) / 15;
    const alpha = 0.025 + ((i * 13) % 11) / 500;

    x.strokeStyle = `rgba(91,60,35,${alpha})`;
    x.lineWidth = width;
    x.beginPath();

    for (let px = -20; px <= size + 20; px += 18) {
      const wave =
        Math.sin((px + i * 19) * 0.025) * 2.2 +
        Math.sin((px + i * 7) * 0.071) * 0.9;
      if (px === -20) x.moveTo(px, y + wave);
      else x.lineTo(px, y + wave);
    }
    x.stroke();
  }

  for (let i = 0; i < 6; i++) {
    const px = 55 + i * 83;
    const py = 72 + ((i * 107) % 330);
    x.strokeStyle = "rgba(100,64,38,.055)";
    x.lineWidth = 2;
    x.beginPath();
    x.ellipse(px, py, 18 + i * 1.7, 5.5, -.12, 0, Math.PI * 2);
    x.stroke();
  }

  const texture = new THREE.CanvasTexture(c);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.6, 1.65);
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

const woodTexture = makeWoodTexture();

const desk = new THREE.Mesh(
  new THREE.BoxGeometry(8.2, TABLE_THICKNESS, 5.0),
  new THREE.MeshStandardMaterial({
    map: woodTexture,
    color: 0xffffff,
    roughness: 0.58,
    metalness: 0
  })
);
desk.position.set(0, TABLE_Y - TABLE_THICKNESS / 2, 0);
desk.receiveShadow = true;
scene.add(desk);

// A darker front edge makes the object read as an actual table rather than a plane.
const deskFront = new THREE.Mesh(
  new THREE.BoxGeometry(8.24, 0.16, 0.12),
  new THREE.MeshStandardMaterial({
    color: 0xb78d65,
    roughness: 0.72
  })
);
deskFront.position.set(0, -0.18, 2.49);
scene.add(deskFront);

// Two minimal legs, visible mainly on taller screens.
const legMaterial = new THREE.MeshStandardMaterial({
  color: 0x9f7958,
  roughness: 0.78
});
for (const x of [-2.85, 2.85]) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 2.8, 0.48),
    legMaterial
  );
  leg.position.set(x, -1.56, 0.85);
  leg.castShadow = true;
  scene.add(leg);
}

// -----------------------------------------------------------------------------
// Clear container: no water. The jelly lives inside a transparent acrylic box.
// -----------------------------------------------------------------------------

const CONTAINER = {
  halfX: 2.42,
  halfZ: 0.78,
  height: 2.35,
  wall: 0.035
};

const containerGroup = new THREE.Group();
scene.add(containerGroup);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xeaf8ff,
  roughness: 0.055,
  metalness: 0,
  transmission: 0.88,
  transparent: true,
  opacity: 0.095,
  thickness: 0.08,
  ior: 1.45,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  depthWrite: false,
  side: THREE.DoubleSide
});

const rimMaterial = new THREE.MeshStandardMaterial({
  color: 0xa8c5d1,
  roughness: 0.32,
  transparent: true,
  opacity: 0.55,
  depthWrite: false
});

function addGlassPanel(geometry, x, y, z) {
  const panel = new THREE.Mesh(geometry, glassMaterial);
  panel.position.set(x, y, z);
  panel.renderOrder = 5;
  containerGroup.add(panel);
  return panel;
}

addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.wall, CONTAINER.height, CONTAINER.halfZ * 2),
  -CONTAINER.halfX, CONTAINER.height * 0.5, 0
);
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.wall, CONTAINER.height, CONTAINER.halfZ * 2),
  CONTAINER.halfX, CONTAINER.height * 0.5, 0
);
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.halfX * 2, CONTAINER.height, CONTAINER.wall),
  0, CONTAINER.height * 0.5, -CONTAINER.halfZ
);
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.halfX * 2, CONTAINER.height, CONTAINER.wall),
  0, CONTAINER.height * 0.5, CONTAINER.halfZ
);

// Very faint clear lid: visually subtle, physically keeps thrown jelly inside.
addGlassPanel(
  new THREE.BoxGeometry(CONTAINER.halfX * 2, CONTAINER.wall, CONTAINER.halfZ * 2),
  0, CONTAINER.height, 0
);

const rimH = CONTAINER.height;
for (const x of [-CONTAINER.halfX, CONTAINER.halfX]) {
  for (const z of [-CONTAINER.halfZ, CONTAINER.halfZ]) {
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, rimH, 0.025),
      rimMaterial
    );
    post.position.set(x, rimH * 0.5, z);
    containerGroup.add(post);
  }
}

for (const y of [0.015, CONTAINER.height]) {
  const frontRim = new THREE.Mesh(
    new THREE.BoxGeometry(CONTAINER.halfX * 2, 0.025, 0.025),
    rimMaterial
  );
  frontRim.position.set(0, y, CONTAINER.halfZ);
  containerGroup.add(frontRim);

  const backRim = frontRim.clone();
  backRim.position.z = -CONTAINER.halfZ;
  containerGroup.add(backRim);

  const leftRim = new THREE.Mesh(
    new THREE.BoxGeometry(0.025, 0.025, CONTAINER.halfZ * 2),
    rimMaterial
  );
  leftRim.position.set(-CONTAINER.halfX, y, 0);
  containerGroup.add(leftRim);

  const rightRim = leftRim.clone();
  rightRim.position.x = CONTAINER.halfX;
  containerGroup.add(rightRim);
}

// -----------------------------------------------------------------------------
// Contact shadow texture
// -----------------------------------------------------------------------------

function makeShadowTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(128, 128, 4, 128, 128, 124);
  g.addColorStop(0, "rgba(20,18,16,.34)");
  g.addColorStop(.4, "rgba(20,18,16,.18)");
  g.addColorStop(1, "rgba(20,18,16,0)");
  x.fillStyle = g;
  x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

const blobShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1.65, 1.28),
  new THREE.MeshBasicMaterial({
    map: makeShadowTexture(),
    transparent: true,
    depthWrite: false,
    opacity: .34
  })
);
blobShadow.rotation.x = -Math.PI / 2;
blobShadow.position.y = TABLE_Y + 0.004;
scene.add(blobShadow);

// -----------------------------------------------------------------------------
// Rady jelly: true WebGL mesh with physical transmission.
// -----------------------------------------------------------------------------

const jellyGroup = new THREE.Group();
scene.add(jellyGroup);

const jellyGeometry = new THREE.SphereGeometry(0.62, 36, 28);
const positionAttribute = jellyGeometry.attributes.position;
const basePositions = new Float32Array(positionAttribute.array.length);
basePositions.set(positionAttribute.array);

const jellyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xeaf6fb,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.93,
  transparent: true,
  opacity: 0.96,
  thickness: 1.55,
  ior: 1.36,
  clearcoat: 1,
  clearcoatRoughness: 0.075,
  attenuationColor: new THREE.Color(0xc9e5ef),
  attenuationDistance: 2.4,
  specularIntensity: 1.0,
  specularColor: new THREE.Color(0xffffff),
  side: THREE.FrontSide
});

const jelly = new THREE.Mesh(jellyGeometry, jellyMaterial);
jelly.castShadow = true;
jelly.receiveShadow = false;
jellyGroup.add(jelly);

// A very faint inner mass makes the body feel denser like warabi-mochi.
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.47, 28, 20),
  new THREE.MeshPhysicalMaterial({
    color: 0xd6edf4,
    roughness: 0.16,
    transmission: 0.75,
    transparent: true,
    opacity: 0.11,
    thickness: 0.7,
    ior: 1.32,
    depthWrite: false
  })
);
core.scale.set(1.0, 0.92, 0.96);
jellyGroup.add(core);

// -----------------------------------------------------------------------------
// Rady face, slightly embedded in the front of the translucent mesh.
// -----------------------------------------------------------------------------

const face = new THREE.Group();
jellyGroup.add(face);

const faceMaterial = new THREE.MeshBasicMaterial({
  color: 0x3b4b57,
  transparent: true,
  opacity: 0.95,
  depthTest: false,
  depthWrite: false
});

const eyeGeometry = new THREE.SphereGeometry(0.038, 14, 10);

const leftEye = new THREE.Mesh(eyeGeometry, faceMaterial);
const rightEye = new THREE.Mesh(eyeGeometry, faceMaterial);
leftEye.scale.set(1.0, 0.65, 0.55);
rightEye.scale.copy(leftEye.scale);
face.add(leftEye, rightEye);
leftEye.renderOrder = 20;
rightEye.renderOrder = 20;

const mouthCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.050, 0.013, 0),
  new THREE.Vector3(-0.020, -0.010, 0.014),
  new THREE.Vector3(0.020, -0.010, 0.014),
  new THREE.Vector3(0.050, 0.013, 0)
]);

const mouth = new THREE.Mesh(
  new THREE.TubeGeometry(mouthCurve, 14, 0.008, 6, false),
  faceMaterial
);
face.add(mouth);
mouth.renderOrder = 20;

// -----------------------------------------------------------------------------
// Body dynamics
// -----------------------------------------------------------------------------

const state = {
  position: new THREE.Vector3(0, 2.65, 0),
  velocity: new THREE.Vector3(0, 0, 0),

  // springy shape variables
  squash: 0,
  squashVelocity: 0,
  wobbleX: 0,
  wobbleXVelocity: 0,
  wobbleZ: 0,
  wobbleZVelocity: 0,

  gravityOn: true,
  dragging: false,
  pinching: false,
  pinchAmount: 0,
  pinchVelocity: 0,
  pinchTarget: 0,
  pinchStartDistance: 0,

  grabBase: new THREE.Vector3(),
  grabTarget: new THREE.Vector3(),
  grabTargetSoft: new THREE.Vector3(),
  grabTargetVelocity: new THREE.Vector3(),
  lastGrabTarget: new THREE.Vector3(),

  // Touching makes the jelly feel lighter for a moment.
  touchFloat: 0,

  motion: {
    enabled: false,
    permission: "unknown",
    gravityX: 0,
    gravityY: 0,
    linearX: 0,
    linearY: 0,
    linearZ: 0
  },

  // shape weight for each vertex around the touched area
  grabWeights: new Float32Array(positionAttribute.count)
};

const NATURAL_RADIUS_Y = 0.60;

function currentShapeScale() {
  const sy = THREE.MathUtils.clamp(1 - state.squash, 0.40, 1.72);
  const lateral = 1 / Math.sqrt(Math.max(0.36, sy));
  return {
    sx: THREE.MathUtils.clamp(lateral, 0.66, 1.74),
    sy,
    sz: THREE.MathUtils.clamp(lateral, 0.66, 1.74)
  };
}

function currentBottomRadius() {
  return NATURAL_RADIUS_Y * currentShapeScale().sy;
}

function resetJelly() {
  state.position.set(0, 1.95, 0);
  state.velocity.set(0, 0, 0);
  state.squash = 0;
  state.squashVelocity = 0;
  state.wobbleX = 0;
  state.wobbleXVelocity = 0;
  state.wobbleZ = 0;
  state.wobbleZVelocity = 0;
  state.dragging = false;
  state.pinching = false;
  state.pinchAmount = 0;
  state.pinchVelocity = 0;
  state.pinchTarget = 0;
  state.pinchStartDistance = 0;
  state.touchFloat = 0;
  state.grabTargetSoft.copy(state.position);
  state.motion.gravityX = 0;
  state.motion.gravityY = 0;
  state.motion.linearX = 0;
  state.motion.linearY = 0;
  state.motion.linearZ = 0;
  state.grabWeights.fill(0);
}

function updateSpring(value, velocity, stiffness, damping, dt) {
  velocity += (-stiffness * value - damping * velocity) * dt;
  value += velocity * dt;
  return [value, velocity];
}

const cameraSpaceJelly = new THREE.Vector3();

function keepJellyInView() {
  const scales = currentShapeScale();
  cameraSpaceJelly.copy(state.position);
  camera.worldToLocal(cameraSpaceJelly);

  const depth = Math.max(0.6, -cameraSpaceJelly.z);
  const halfHeight =
    Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * depth;
  const halfWidth = halfHeight * camera.aspect;

  // Extra padding keeps the translucent rim and wobble inside the viewport.
  const radiusX = 0.62 * scales.sx + 0.075;
  const radiusY = 0.62 * Math.max(scales.sy, scales.sx * 0.82) + 0.075;

  const xLimit = Math.max(0.02, halfWidth - radiusX);
  const topLimit = Math.max(0.02, halfHeight - radiusY);

  let changed = false;

  if (cameraSpaceJelly.x < -xLimit) {
    cameraSpaceJelly.x = -xLimit;
    state.velocity.x = Math.abs(state.velocity.x) * 0.10;
    state.wobbleXVelocity -= 0.55;
    changed = true;
  } else if (cameraSpaceJelly.x > xLimit) {
    cameraSpaceJelly.x = xLimit;
    state.velocity.x = -Math.abs(state.velocity.x) * 0.10;
    state.wobbleXVelocity += 0.55;
    changed = true;
  }

  // The desk already guards the lower edge. This guards only the top edge,
  // allowing upward throws without ever losing the jelly outside the screen.
  if (cameraSpaceJelly.y > topLimit) {
    cameraSpaceJelly.y = topLimit;
    state.velocity.y = Math.min(0, state.velocity.y) * 0.08;
    state.velocity.z *= 0.88;
    state.squashVelocity -= 0.12;
    changed = true;
  }

  if (changed) {
    camera.localToWorld(cameraSpaceJelly);
    state.position.copy(cameraSpaceJelly);

    // Re-resolve the desk after vertical frustum correction.
    const bottom = state.position.y - currentBottomRadius();
    if (bottom < TABLE_Y) {
      state.position.y += TABLE_Y - bottom;
      if (state.velocity.y < 0) state.velocity.y = 0;
    }
  }
}

function screenAngle() {
  if (screen.orientation && Number.isFinite(screen.orientation.angle)) {
    return ((screen.orientation.angle % 360) + 360) % 360;
  }
  if (typeof window.orientation === "number") {
    return ((window.orientation % 360) + 360) % 360;
  }
  return 0;
}

function deviceVectorToScreen(x, y) {
  const angle = screenAngle();
  let sx = x;
  let sy = y;

  if (angle === 90) {
    sx = -y;
    sy = x;
  } else if (angle === 180) {
    sx = -x;
    sy = -y;
  } else if (angle === 270) {
    sx = y;
    sy = -x;
  }

  // If iOS refuses physical orientation lock and we are drawing a rotated
  // landscape stage over a portrait viewport, rotate sensor axes identically.
  if (viewport.rotated) {
    return { x: sy, y: -sx };
  }

  return { x: sx, y: sy };
}

function onDeviceMotion(event) {
  if (!state.motion.enabled) return;

  const g = event.accelerationIncludingGravity || {};
  const linear = event.acceleration || {};

  const screenG = deviceVectorToScreen(
    Number.isFinite(g.x) ? g.x : 0,
    Number.isFinite(g.y) ? g.y : 0
  );
  const screenLinear = deviceVectorToScreen(
    Number.isFinite(linear.x) ? linear.x : 0,
    Number.isFinite(linear.y) ? linear.y : 0
  );

  // Low-pass gravity for stable tilt. Linear acceleration remains faster so
  // a little shake travels through the pudding as a satisfying wobble.
  const gravityMix = 0.14;
  state.motion.gravityX += (screenG.x - state.motion.gravityX) * gravityMix;
  state.motion.gravityY += (screenG.y - state.motion.gravityY) * gravityMix;

  const linearMix = 0.28;
  state.motion.linearX += (screenLinear.x - state.motion.linearX) * linearMix;
  state.motion.linearY += (screenLinear.y - state.motion.linearY) * linearMix;
  state.motion.linearZ += (
    (Number.isFinite(linear.z) ? linear.z : 0) - state.motion.linearZ
  ) * linearMix;
}

async function tryLandscapeLock() {
  try {
    if (screen.orientation?.lock) await screen.orientation.lock("landscape");
  } catch (_) {
    // iPhone Safari may not expose/allow Orientation Lock. The CSS landscape
    // stage above is the fallback and still avoids a portrait composition.
  }
}

async function enableMotion() {
  await tryLandscapeLock();

  try {
    if (
      typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function"
    ) {
      const permission = await DeviceMotionEvent.requestPermission();
      state.motion.permission = permission;
      if (permission !== "granted") {
        motionButton.textContent = "ジャイロ NG";
        return false;
      }
    }

    if (typeof DeviceMotionEvent === "undefined") {
      state.motion.permission = "unsupported";
      motionButton.textContent = "センサーなし";
      return false;
    }

    state.motion.enabled = true;
    state.motion.permission = "granted";
    addEventListener("devicemotion", onDeviceMotion, { passive: true });
    motionButton.textContent = "ジャイロ ON";
    return true;
  } catch (error) {
    console.warn("Motion sensor unavailable.", error);
    state.motion.permission = "error";
    motionButton.textContent = "ジャイロ ERROR";
    return false;
  }
}

function disableMotion() {
  state.motion.enabled = false;
  removeEventListener("devicemotion", onDeviceMotion);
  state.motion.gravityX = 0;
  state.motion.gravityY = 0;
  state.motion.linearX = 0;
  state.motion.linearY = 0;
  state.motion.linearZ = 0;
  motionButton.textContent = "ジャイロ OFF";
}

function collideWithContainer() {
  const scales = currentShapeScale();
  const radiusX = 0.62 * scales.sx + Math.abs(state.wobbleX) * 0.08 + 0.035;
  const radiusZ = 0.62 * scales.sz + Math.abs(state.wobbleZ) * 0.08 + 0.035;
  const radiusY = currentBottomRadius() + 0.035;

  const minX = -CONTAINER.halfX + radiusX;
  const maxX = CONTAINER.halfX - radiusX;
  const minZ = -CONTAINER.halfZ + radiusZ;
  const maxZ = CONTAINER.halfZ - radiusZ;
  const maxY = CONTAINER.height - radiusY;

  if (state.position.x < minX) {
    state.position.x = minX;
    state.velocity.x = Math.abs(state.velocity.x) * 0.12;
    state.wobbleXVelocity -= 0.75;
  } else if (state.position.x > maxX) {
    state.position.x = maxX;
    state.velocity.x = -Math.abs(state.velocity.x) * 0.12;
    state.wobbleXVelocity += 0.75;
  }

  if (state.position.z < minZ) {
    state.position.z = minZ;
    state.velocity.z = Math.abs(state.velocity.z) * 0.12;
    state.wobbleZVelocity -= 0.65;
  } else if (state.position.z > maxZ) {
    state.position.z = maxZ;
    state.velocity.z = -Math.abs(state.velocity.z) * 0.12;
    state.wobbleZVelocity += 0.65;
  }

  if (state.position.y > maxY) {
    state.position.y = maxY;
    state.velocity.y = -Math.abs(state.velocity.y) * 0.08;
    state.squashVelocity -= 0.22;
  }

  const bottom = state.position.y - currentBottomRadius();
  if (bottom < TABLE_Y) {
    state.position.y += TABLE_Y - bottom;
    if (state.velocity.y < 0) {
      const impact = -state.velocity.y;
      state.velocity.y = impact * 0.03;
      state.squashVelocity += impact * 0.30;
      state.wobbleXVelocity += -state.velocity.x * 0.24;
      state.wobbleZVelocity += -state.velocity.z * 0.24;
      state.velocity.x *= 0.96;
      state.velocity.z *= 0.96;
    }
    if (Math.abs(state.velocity.y) < 0.08) state.velocity.y = 0;
  }
}

function physicsStep(dt) {
  // While touched, gravity almost disappears. After release it returns gradually,
  // so the jelly floats for a short moment instead of snapping downward.
  if (state.dragging) {
    state.touchFloat = 1;
  } else {
    state.touchFloat = Math.max(0, state.touchFloat - dt * 1.65);
  }

  const touchFactor = state.dragging ? 0.24 : 1.0;
  const releaseGravityScale = state.dragging
    ? 0.05
    : THREE.MathUtils.lerp(1.0, 0.28, state.touchFloat);

  if (state.gravityOn) {
    if (state.motion.enabled) {
      // accelerationIncludingGravity is rotated into the same axes as the
      // rendered landscape stage. Negating it gives the actual gravity direction.
      // X means screen-right/left; Y means screen-up/down. There is no hidden
      // depth-axis tilt anymore, so the jelly always moves where the screen tilts.
      const gravityX = THREE.MathUtils.clamp(-state.motion.gravityX / 9.81, -1, 1);
      const gravityY = THREE.MathUtils.clamp(-state.motion.gravityY / 9.81, -1, 1);

      state.velocity.x += gravityX * 7.0 * touchFactor * releaseGravityScale * dt;
      state.velocity.y += gravityY * 7.0 * touchFactor * releaseGravityScale * dt;
    } else {
      // Sensor off: keep a normal screen-down gravity.
      state.velocity.y -= 7.7 * releaseGravityScale * dt;
    }
  }

  if (state.motion.enabled) {

    // Fast device movement is separate from tilt: it excites the soft-body
    // springs in the same front-view axes.
    const shakeX = THREE.MathUtils.clamp(state.motion.linearX, -7, 7);
    const shakeY = THREE.MathUtils.clamp(state.motion.linearY, -7, 7);
    const shakeZ = THREE.MathUtils.clamp(state.motion.linearZ, -7, 7);

    state.wobbleXVelocity += -shakeX * 0.052 * touchFactor * dt * 60;
    state.squashVelocity += shakeY * 0.042 * touchFactor * dt * 60;
    state.wobbleZVelocity += -shakeZ * 0.024 * touchFactor * dt * 60;

    // Sudden vertical screen motion gives a small visible hop.
    if (!state.dragging && Math.abs(shakeY) > 1.8) {
      state.velocity.y += THREE.MathUtils.clamp(-shakeY * 0.020, -0.09, 0.09);
    }
  }

  if (state.dragging) {
    // Smooth the finger target itself. This removes tiny pointer jitter and gives
    // the surface a syrupy, pleasant follow rather than a rigid mouse-drag feel.
    const follow = 1 - Math.exp(-18 * dt);
    state.grabTargetSoft.lerp(state.grabTarget, follow);

    const toTarget = new THREE.Vector3().subVectors(state.grabTargetSoft, state.position);

    // Clamp the pull so accidental swipes remain stable.
    if (toTarget.length() > 2.15) toTarget.setLength(2.15);

    // Light-touch pudding: responsive near the finger, but the body still lags.
    state.velocity.addScaledVector(toTarget, 20 * dt);
    state.velocity.multiplyScalar(Math.pow(0.13, dt));

    // A grabbed point leads; the rest of the jelly lags behind.
    state.squashVelocity +=
      THREE.MathUtils.clamp(Math.abs(toTarget.y) * -0.34 + Math.abs(toTarget.x) * 0.06, -1.2, 0.6) * dt;

    state.wobbleXVelocity += -toTarget.x * 0.75 * dt;
    state.wobbleZVelocity += -toTarget.z * 0.75 * dt;
  } else {
    state.velocity.x *= Math.pow(0.91, dt);
    state.velocity.z *= Math.pow(0.91, dt);
  }

  state.position.addScaledVector(state.velocity, dt);

  // Front view behaves like a shallow display case rather than a deep 3D room.
  state.velocity.z *= Math.pow(0.16, dt);
  state.position.z *= Math.pow(0.20, dt);

  collideWithContainer();

  const pinchStiffness = state.pinching ? 28 : 11;
  const pinchDamping = state.pinching ? 7.0 : 3.2;
  const pinchDelta = state.pinchTarget - state.pinchAmount;
  state.pinchVelocity +=
    (pinchDelta * pinchStiffness - state.pinchVelocity * pinchDamping) * dt;
  state.pinchAmount += state.pinchVelocity * dt;
  state.pinchAmount = THREE.MathUtils.clamp(state.pinchAmount, -0.46, 0.58);

  keepJellyInView();

  [state.squash, state.squashVelocity] =
    updateSpring(state.squash, state.squashVelocity, 6.8, 1.7, dt);

  [state.wobbleX, state.wobbleXVelocity] =
    updateSpring(state.wobbleX, state.wobbleXVelocity, 5.2, 1.55, dt);

  [state.wobbleZ, state.wobbleZVelocity] =
    updateSpring(state.wobbleZ, state.wobbleZVelocity, 5.2, 1.55, dt);

  state.squash = THREE.MathUtils.clamp(state.squash, -0.55, 0.72);
  state.wobbleX = THREE.MathUtils.clamp(state.wobbleX, -0.72, 0.72);
  state.wobbleZ = THREE.MathUtils.clamp(state.wobbleZ, -0.72, 0.72);
}

const localTarget = new THREE.Vector3();
const localGrab = new THREE.Vector3();
const grabDelta = new THREE.Vector3();
let normalUpdateFrame = 0;

function deformJelly(time) {
  const scales = currentShapeScale();
  const array = positionAttribute.array;

  // Convert the world-space drag point to the body's local translation frame.
  localTarget.copy(state.grabTarget).sub(state.position);
  localGrab.copy(state.grabBase);
  grabDelta.subVectors(localTarget, localGrab);

  const speed = state.velocity.length();
  const travelShearX = THREE.MathUtils.clamp(-state.velocity.x * 0.038, -0.22, 0.22);
  const travelShearZ = THREE.MathUtils.clamp(-state.velocity.z * 0.038, -0.22, 0.22);

  for (let i = 0; i < positionAttribute.count; i++) {
    const ix = i * 3;
    const bx = basePositions[ix];
    const by = basePositions[ix + 1];
    const bz = basePositions[ix + 2];

    const height01 = THREE.MathUtils.clamp((by + 0.62) / 1.24, 0, 1);

    // Volume-preserving squash/stretch.
    let x = bx * scales.sx;
    let y = by * scales.sy;
    let z = bz * scales.sz;

    // Two-finger pinch: fingers closing squeeze the body radially and make it
    // bulge upward; opening the fingers stretches it wider and flatter.
    const pinch = state.pinchAmount;
    const pinchRadial = THREE.MathUtils.clamp(1 - pinch * 0.34, 0.76, 1.22);
    const pinchVertical = THREE.MathUtils.clamp(1 + pinch * 0.46, 0.76, 1.34);
    x *= pinchRadial;
    z *= pinchRadial;
    y *= pinchVertical;

    // Lower half widens a little more under compression, like soft food.
    const lowWeight = Math.pow(1 - height01, 1.7);
    const bulge = 1 + Math.max(state.squash, 0) * lowWeight * 0.34;
    x *= bulge;
    z *= bulge;

    // Flatten the contact patch against the desk without making the whole body flat.
    const localTableY = TABLE_Y - state.position.y;
    const flattenBand = 0.20;
    if (y < localTableY + flattenBand) {
      const t = THREE.MathUtils.clamp(
        (localTableY + flattenBand - y) / flattenBand,
        0,
        1
      );
      y = THREE.MathUtils.lerp(y, localTableY + 0.004, t * 0.88);
      x *= 1 + t * 0.095;
      z *= 1 + t * 0.095;
    }

    // Whole-body lag while travelling.
    x += by * (travelShearX + state.wobbleX * 0.26);
    z += by * (travelShearZ + state.wobbleZ * 0.26);

    // Tiny damped ripples after impact, strongest around the middle skin.
    const radial = Math.sqrt(bx * bx + bz * bz);
    const rippleWeight = Math.sin(Math.PI * height01) * THREE.MathUtils.clamp(radial / 0.62, 0, 1);
    const ripple =
      Math.sin(time * 4.4 + by * 3.8 + Math.atan2(bz, bx) * 1.25) *
      (Math.abs(state.squashVelocity) + speed * 0.035) *
      0.0048 *
      rippleWeight;

    const radialLen = Math.hypot(bx, bz) || 1;
    x += (bx / radialLen) * ripple;
    z += (bz / radialLen) * ripple;

    // Slow skin-flow layer: a low-frequency travelling deformation gives
    // the surface a viscous "nurunuru" motion instead of rubber-only wobble.
    const theta = Math.atan2(bz, bx);
    const flowWeight = Math.sin(Math.PI * height01) * Math.min(1, radial / 0.62);
    const flow =
      Math.sin(time * 2.1 + theta * 1.8 + by * 3.6) *
      (0.010 + Math.min(speed, 5) * 0.0032) *
      flowWeight;
    x += Math.cos(theta) * flow;
    z += Math.sin(theta) * flow;

    // True local grip deformation on the actual 3D mesh.
    if (state.dragging) {
      const weight = state.grabWeights[i];
      if (weight > 0.001) {
        const localFollow = 0.91 * weight;
        x += grabDelta.x * localFollow;
        y += grabDelta.y * localFollow;
        z += grabDelta.z * localFollow;

        // Nearby skin gets slightly pinched toward the grasp point.
        const pinch = weight * 0.088;
        x = THREE.MathUtils.lerp(x, localGrab.x + grabDelta.x, pinch);
        y = THREE.MathUtils.lerp(y, localGrab.y + grabDelta.y, pinch);
        z = THREE.MathUtils.lerp(z, localGrab.z + grabDelta.z, pinch);
      }
    }

    array[ix] = x;
    array[ix + 1] = y;
    array[ix + 2] = z;
  }

  positionAttribute.needsUpdate = true;
  // Recomputing normals on every frame was expensive on iPhone and made the
  // face appear to trail. Half-rate normal updates keep the jelly smooth.
  normalUpdateFrame++;
  if ((normalUpdateFrame & 1) === 0) jellyGeometry.computeVertexNormals();

  // The inner mass follows the big deformation but not the local skin pinch.
  core.scale.set(
    scales.sx * 0.98,
    scales.sy * 0.92,
    scales.sz * 0.96
  );
  core.position.set(
    state.wobbleX * 0.055,
    -0.015,
    state.wobbleZ * 0.055
  );

  // Face is intentionally steadier than the skin.
  // Face sits just outside the refractive shell and follows the same shear
  // immediately, so transparency sorting/refraction cannot make it lag.
  face.position.set(
    state.wobbleX * 0.030 + travelShearX * 0.010,
    0.004 - Math.max(state.squash, 0) * 0.038,
    0.628 * scales.sz + 0.018
  );
  face.rotation.z = THREE.MathUtils.clamp(-state.velocity.x * 0.025, -0.16, 0.16);
  face.scale.set(
    scales.sx,
    THREE.MathUtils.lerp(1, scales.sy, 0.62),
    1
  );

  leftEye.position.set(-0.142, 0.052, 0);
  rightEye.position.set(0.142, 0.052, 0);
  mouth.position.set(0, -0.047, 0.006);

  jellyGroup.position.copy(state.position);

  const height = Math.max(0, state.position.y - currentBottomRadius());
  blobShadow.position.x = state.position.x;
  blobShadow.position.z = state.position.z;
  blobShadow.scale.set(
    1.0 + Math.max(state.squash, 0) * 0.75,
    0.82 + Math.max(state.squash, 0) * 0.55,
    1
  );
  blobShadow.material.opacity = THREE.MathUtils.clamp(0.34 - height * 0.10, 0.07, 0.34);
}

// -----------------------------------------------------------------------------
// Pointer interaction with the actual 3D mesh.
// -----------------------------------------------------------------------------

const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragPlaneNormal = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
const tempRayPoint = new THREE.Vector3();

function setPointerNDC(event) {
  let nx;
  let ny;

  if (viewport.rotated) {
    // Same clockwise transform as #landscape-root.
    nx = event.clientY / innerHeight;
    ny = 1 - event.clientX / innerWidth;
  } else {
    nx = event.clientX / innerWidth;
    ny = event.clientY / innerHeight;
  }

  pointerNDC.x = nx * 2 - 1;
  pointerNDC.y = -(ny * 2 - 1);
}

function updateGrabWeights(localPoint) {
  const sigma = 0.32;
  let max = 0;

  for (let i = 0; i < positionAttribute.count; i++) {
    const ix = i * 3;
    const bx = basePositions[ix];
    const by = basePositions[ix + 1];
    const bz = basePositions[ix + 2];
    const d2 =
      (bx - localPoint.x) * (bx - localPoint.x) +
      (by - localPoint.y) * (by - localPoint.y) +
      (bz - localPoint.z) * (bz - localPoint.z);

    const w = Math.exp(-d2 / (2 * sigma * sigma));
    state.grabWeights[i] = w;
    if (w > max) max = w;
  }

  if (max > 0) {
    for (let i = 0; i < state.grabWeights.length; i++) {
      state.grabWeights[i] /= max;
    }
  }
}

const activePointers = new Map();

function pointerDistance() {
  const values = [...activePointers.values()];
  if (values.length < 2) return 0;
  const a = values[0];
  const b = values[1];
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function beginPinchIfPossible() {
  if (activePointers.size < 2) return false;

  const distance = pointerDistance();
  if (distance <= 0) return false;

  state.pinching = true;
  state.dragging = false;
  state.grabWeights.fill(0);
  state.pinchStartDistance = distance;
  state.pinchTarget = 0;
  state.pinchVelocity += 0.035;
  return true;
}

canvas.addEventListener("pointerdown", event => {
  tryLandscapeLock();

  if (!state.motion.enabled && state.motion.permission === "unknown") {
    enableMotion();
  }

  activePointers.set(event.pointerId, {
    x: event.clientX,
    y: event.clientY
  });

  if (activePointers.size >= 2 && beginPinchIfPossible()) {
    event.preventDefault();
    canvas.setPointerCapture(event.pointerId);
    return;
  }

  setPointerNDC(event);
  raycaster.setFromCamera(pointerNDC, camera);

  const intersections = raycaster.intersectObject(jelly, false);
  if (!intersections.length) return;

  event.preventDefault();
  canvas.setPointerCapture(event.pointerId);

  const hit = intersections[0];
  hitPoint.copy(hit.point);

  state.dragging = true;
  state.touchFloat = 1;
  state.grabTarget.copy(hit.point);
  state.grabTargetSoft.copy(hit.point);
  state.lastGrabTarget.copy(hit.point);
  state.grabTargetVelocity.set(0, 0, 0);

  // A tiny compression on contact gives a subtle tactile "ぷるっ" response.
  state.squashVelocity += 0.045;

  state.grabBase.copy(hit.point).sub(state.position);
  updateGrabWeights(state.grabBase);

  // Plane faces the camera and passes through the touched skin point.
  camera.getWorldDirection(dragPlaneNormal);
  dragPlane.setFromNormalAndCoplanarPoint(dragPlaneNormal, hit.point);

  state.wobbleXVelocity += -state.velocity.x * 0.12;
  state.wobbleZVelocity += -state.velocity.z * 0.12;
});

canvas.addEventListener("pointermove", event => {
  if (activePointers.has(event.pointerId)) {
    activePointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });
  }

  if (state.pinching && activePointers.size >= 2) {
    const distance = pointerDistance();
    if (state.pinchStartDistance > 0 && distance > 0) {
      const ratio = distance / state.pinchStartDistance;
      state.pinchTarget = THREE.MathUtils.clamp((1 - ratio) * 1.55, -0.42, 0.55);
    }
    return;
  }

  if (!state.dragging) return;

  setPointerNDC(event);
  raycaster.setFromCamera(pointerNDC, camera);

  if (!raycaster.ray.intersectPlane(dragPlane, tempRayPoint)) return;

  // Don't allow the grab target to disappear deeply below the container floor.
  tempRayPoint.y = Math.max(tempRayPoint.y, TABLE_Y + 0.06);

  const dt = Math.max(clock.getDelta(), 1 / 240);
  state.grabTargetVelocity
    .subVectors(tempRayPoint, state.lastGrabTarget)
    .divideScalar(dt);

  if (state.grabTargetVelocity.length() > 9) {
    state.grabTargetVelocity.setLength(9);
  }

  state.lastGrabTarget.copy(state.grabTarget);
  state.grabTarget.copy(tempRayPoint);
});

function releasePointer(event) {
  activePointers.delete(event.pointerId);

  if (state.pinching) {
    if (activePointers.size < 2) {
      // Let the stored squeeze spring back into a broad "ぷるん".
      state.pinching = false;
      state.pinchTarget = 0;
      state.squashVelocity += state.pinchAmount * 0.34;
      state.wobbleXVelocity += state.pinchAmount * 0.08;
    }
    return;
  }

  if (!state.dragging) return;

  // Release keeps enough finger velocity for an intentional throw.
  state.velocity.addScaledVector(state.grabTargetVelocity, 0.31);
  if (state.velocity.length() > 6.8) state.velocity.setLength(6.8);
  state.touchFloat = 1;

  state.wobbleXVelocity += -state.grabTargetVelocity.x * 0.10;
  state.wobbleZVelocity += -state.grabTargetVelocity.z * 0.10;

  state.dragging = false;
  state.grabWeights.fill(0);
  state.grabTargetVelocity.set(0, 0, 0);
}

canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);

// -----------------------------------------------------------------------------
// UI
// -----------------------------------------------------------------------------

resetButton.addEventListener("click", resetJelly);

gravityButton.addEventListener("click", () => {
  state.gravityOn = !state.gravityOn;
  gravityButton.textContent = state.gravityOn ? "GRAVITY ON" : "GRAVITY OFF";
});

motionButton.addEventListener("click", async () => {
  if (state.motion.enabled) disableMotion();
  else await enableMotion();
});

function resizeLandscapeStage() {
  viewport = landscapeViewport();
  camera.aspect = viewport.width / viewport.height;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(viewport.width, viewport.height, false);
}

addEventListener("resize", resizeLandscapeStage);
screen.orientation?.addEventListener?.("change", resizeLandscapeStage);

// -----------------------------------------------------------------------------
// Main loop
// -----------------------------------------------------------------------------

let last = performance.now();

function animate(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20);
  last = now;

  // Two substeps make table impacts and dragging less jittery.
  const subDt = dt * 0.5;
  physicsStep(subDt);
  physicsStep(subDt);

  deformJelly(now / 1000);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

resizeLandscapeStage();
resetJelly();
deformJelly(0);
renderer.render(scene, camera);
loading.classList.add("hide");
setTimeout(() => loading.remove(), 350);
requestAnimationFrame(animate);
</script>
</body>
</html>
