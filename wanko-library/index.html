<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>わんこ大図鑑</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f6efe3;color:#27231f}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(255,250,240,.9);backdrop-filter:blur(16px);border-bottom:1px solid #ddd0bd}
a{color:inherit;text-decoration:none}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #332f29;border-radius:13px;background:white;font-size:26px;font-weight:800}
h1{margin:0;font-size:23px}.status{margin-left:auto;font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px;background:white;border:1px solid #dccdb6}
main{width:min(100%,900px);margin:auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 28px)}
.empty{text-align:center;padding:70px 20px;color:#766c62}.empty b{display:block;font-size:48px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;border:2px solid #332f29;border-radius:20px;background:#fffaf2;overflow:hidden;box-shadow:0 5px 0 #332f29}
.card.active{outline:4px solid #f2c84b;outline-offset:2px}.thumb{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(#cce9ef 0 65%,#c6d891 65%);padding:12px}.thumb img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 1px rgba(0,0,0,.18))}
.thumb .placeholder{font-size:clamp(46px,11vw,74px);filter:drop-shadow(0 4px 1px rgba(0,0,0,.16))}.thumb .elementSymbol{font-size:clamp(34px,8vw,58px);font-weight:1000}.card.undiscovered .thumb .placeholder{filter:grayscale(1);opacity:.55}
.info{padding:10px}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{font-size:10px;color:#7b7066;margin-top:3px}.badge{display:inline-flex;margin-top:5px;padding:3px 7px;border-radius:999px;background:#f0c63d;color:#332f29;font-size:9px;font-weight:900}.use,.request{width:100%;margin-top:8px;border:0;border-radius:11px;background:#332f29;color:white;padding:9px;font-weight:900}.active .use{background:#f0c63d;color:#332f29}.request{background:#e07b39}.request:disabled{background:#b8aa9b;color:#fff;opacity:.9}
.new{display:inline-flex;margin-bottom:14px;padding:10px 14px;border-radius:13px;background:#332f29;color:white;font-weight:900}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.tab{border:2px solid #332f29;border-radius:13px;background:#fffaf2;padding:10px 6px;font-weight:900}.tab[aria-selected="true"]{background:#f0c63d;box-shadow:0 3px 0 #332f29}
.subtabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:-6px 0 18px}.subtab{border:2px solid #8b7967;border-radius:13px;background:#fffaf2;padding:9px 6px;font-weight:900}.subtab[aria-selected="true"]{background:#d9eef0;border-color:#332f29;box-shadow:0 3px 0 #332f29}.subtabs.is-hidden{display:none}.danger{width:100%;margin-top:8px;border:2px solid #a83a31;border-radius:11px;background:#fff0ed;color:#8f2e27;padding:8px;font-weight:900}
</style>
</head>
<body>
<header><a class="back" href="../wanko/?v=10">‹</a><h1>わんこ大図鑑</h1><span class="status" id="profileLabel">端末</span><a class="status" id="status" href="../wanko-cloud/">📱 保存中</a></header>
<main><a class="new" href="../paint/?wanko=1">＋ 新しいわんこを描く</a><nav class="tabs" role="tablist" aria-label="図鑑の種類"><button class="tab" data-tab="allies" role="tab">なかま</button><button class="tab" data-tab="enemies" role="tab">てき</button><button class="tab" data-tab="elements" role="tab">元素</button></nav><nav class="subtabs" id="ally-subtabs" role="tablist" aria-label="なかまの種類"><button class="subtab" data-subtab="custom" role="tab">自作</button><button class="subtab" data-subtab="owned" role="tab">所持</button></nav><div id="content"></div></main>
<div class="modal" id="request-modal" aria-hidden="true" style="display:none;position:fixed;inset:0;z-index:8;background:rgba(39,35,31,.55);padding:20px;place-items:center"><section style="width:min(100%,420px);padding:22px;border:2px solid #332f29;border-radius:20px;background:#fffaf2;box-shadow:0 6px 0 #332f29"><h2 style="margin:0 0 10px">正式登録の依頼</h2><p id="request-name" style="font-weight:900"></p><label for="request-faction">どっちのわんこ？</label><select id="request-faction" style="display:block;width:100%;margin:8px 0 12px;padding:10px;border:2px solid #332f29;border-radius:10px;background:white"><option value="ally">味方</option><option value="enemy">敵</option></select><p id="request-status" role="status" aria-live="polite"></p><div style="display:flex;gap:8px"><button class="use" id="request-cancel" type="button">やめる</button><button class="request" id="request-confirm" type="button">登録依頼を出す</button></div></section></div>
<script src="../shared/for-my-sons-db.js?v=2"></script>
<script src="../shared/profile-manager.js?v=2"></script>
<script src="../shared/parent-lock.js?v=3"></script>
<script src="../shared/save-store.js?v=2"></script>
<script src="../shared/github-sync.js?v=7"></script>
<script src="../shared/character-requests.js?v=1"></script>
<script src="../shared/for-my-sons.js?v=6"></script>
<script src="../shared/wanko-cloud-config.js"></script>
<script src="../shared/wanko-cloud.js"></script>
<script src="../shared/official-wankos.js?v=8"></script>
<script src="../shared/wanko-library-store.js?v=1"></script>
<script src="../shared/wanko-library.js"></script>
<script src="../shared/wanko-game-data.js?v=3"></script>
<script src="../shared/wanko-game-progress.js?v=7"></script>
<script src="../shared/wanko-profile-sync.js?v=1"></script>
<script src="../shared/wanko-library-view.js?v=3"></script>
<script src="../shared/wanko-registration-request.js?v=1"></script>
<script>
(async()=>{
 const content=document.getElementById('content'), status=document.getElementById('status'), profileLabel=document.getElementById('profileLabel');
 const requestModal=document.getElementById('request-modal'), requestName=document.getElementById('request-name'), requestFaction=document.getElementById('request-faction'), requestStatus=document.getElementById('request-status'), requestConfirm=document.getElementById('request-confirm');
 let requestTarget=null, requestInFlight=false;
 const tabs=[...document.querySelectorAll('.tab')], allySubtabs=document.getElementById('ally-subtabs'), subTabs=[...document.querySelectorAll('.subtab')];
 let Progress=window.WankoGameProgress, profileSync=null;
 const validTabs=new Set(['allies','enemies','elements']);
 const validSubTabs=new Set(['custom','owned']);
 let activeTab=validTabs.has(location.hash.slice(1))?location.hash.slice(1):'allies';
 let activeSubTab='custom';
 async function setupProfileProgress(){
  if(!window.ForMySonsShared?.createForMySons||!window.WankoProfileSync?.createWankoProfileSync)return;
  try{
   const api=await window.ForMySonsShared.createForMySons();
   const profile=await api.profile.current();
   const label=profile?.label&&profile.label!=='profile-1'?profile.label:'未設定';
   profileLabel.textContent=label;
   const scoped=window.WankoGameProgress.createProfileStore(profile.id,api.save,window.WankoGameData);
   const sync=window.WankoProfileSync.createWankoProfileSync({
    api,
    profileId:profile.id,
    definitions:window.WankoGameData,
    progressStore:scoped,
    legacyStorage:window.WankoLibrary,
    confirmLegacy:async preview=>{
     const count=preview.clearedStageCount+preview.discoveredElementCount+preview.discoveredEnemyCount;
     return Boolean(count&&window.confirm&&window.confirm(label+' に、この端末のこれまでのワンコ進行を引き継ぎますか？'));
    }
   });
   await sync.initialize();
   Progress=scoped;profileSync=sync;
  }catch(error){
   console.warn('Profile progress load failed; using legacy local progress.',error);
   profileLabel.textContent='端末保存';
  }
 }
 function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
 function makeCard({name,image,placeholder,subtitle,badge,active=false,disabled=false,onUse=null,onRequest=null,requestPending=false,onDelete=null,requestSubmitted=false,elementCard=false,undiscovered=false}){
  const card=element('article','card'+(active?' active':'')+(undiscovered?' undiscovered':''));
  const thumb=element('div','thumb');
  if(image){const img=element('img');img.alt='';img.src=image;thumb.appendChild(img);}
  else thumb.appendChild(element('span',elementCard?'elementSymbol':'placeholder',placeholder||'🐾'));
  const info=element('div','info');info.append(element('div','name',name),element('div','date',subtitle||''));
  if(badge)info.appendChild(element('span','badge',badge));
  if(onRequest){const button=element('button','request',requestPending?'依頼済み':'登録依頼を出す');button.type='button';button.disabled=requestPending;button.addEventListener('click',onRequest);info.appendChild(button);}
  if(requestSubmitted)info.appendChild(element('span','badge','登録依頼済み'));
  if(onUse){const button=element('button','use',active?'バトルで使用中':'このわんこを使う');button.disabled=disabled;button.addEventListener('click',onUse);info.appendChild(button);}
  if(onDelete){const button=element('button','danger','削除');button.type='button';button.addEventListener('click',onDelete);info.appendChild(button);}
  card.append(thumb,info);return card;
 }
 function openRequestModal(wanko){
  requestTarget=wanko;requestName.textContent=wanko.name;requestStatus.textContent='';requestConfirm.disabled=false;requestModal.style.display='grid';requestModal.setAttribute('aria-hidden','false');
 }
 function closeRequestModal(){requestTarget=null;requestModal.style.display='none';requestModal.setAttribute('aria-hidden','true');}
 async function submitRequest(){
  if(!requestTarget||requestInFlight)return;
  requestInFlight=true;requestConfirm.disabled=true;requestStatus.textContent='保存しています…';
  try{
   const api=await window.ForMySonsShared.createForMySons();
   const result=await window.ForMySonsWankoRegistrationRequest.createWankoRegistrationRequest({
    service:api.characterRequests,wanko:requestTarget,faction:requestFaction.value,
    markRequested:(id,requestId)=>WankoLibrary.markRegistrationRequested(id,requestId)
   });
   closeRequestModal();
   window.alert(result.duplicate?'このわんこは、もう依頼済みだよ':(result.synced?'登録依頼を出しました ✓':'登録依頼を保存したよ。あとで送るね'));
   render();
  }catch(error){requestStatus.textContent='保存できなかったよ。もう一度ためしてね';requestConfirm.disabled=false;console.error(error);}
  finally{requestInFlight=false;}
 }
 document.getElementById('request-cancel').addEventListener('click',closeRequestModal);
 requestConfirm.addEventListener('click',submitRequest);
 function selectTab(tab){activeTab=validTabs.has(tab)?tab:'allies';tabs.forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===activeTab)));allySubtabs.classList.toggle('is-hidden',activeTab!=='allies');}
 function selectSubTab(tab){activeSubTab=validSubTabs.has(tab)?tab:'custom';subTabs.forEach(button=>button.setAttribute('aria-selected',String(button.dataset.subtab===activeSubTab)));}
 tabs.forEach(button=>button.addEventListener('click',()=>{location.hash=button.dataset.tab;selectTab(button.dataset.tab);render();}));
 subTabs.forEach(button=>button.addEventListener('click',()=>{selectSubTab(button.dataset.subtab);render();}));
 window.addEventListener('hashchange',()=>{selectTab(location.hash.slice(1));render();});
 async function render(){
  selectTab(activeTab);selectSubTab(activeSubTab);
  const [list,active,state,officials,progress]=await Promise.all([
    WankoLibrary.listWankos(),
    WankoLibrary.getActiveWanko(),
    WankoLibrary.syncState(),
    window.OfficialWankos?OfficialWankos.list():[],
    Progress.getState()
  ]);
  status.textContent=!state.configured?'📱 この端末に保存':(!state.authenticated?'☁️ ログイン':(state.pending?'☁️ 同期待ち '+state.pending:'☁️ 保存済み'));
  let officialActiveId=localStorage.getItem('wankoOfficialActiveId');
  if(!officialActiveId && !active && officials.length){
    officialActiveId=officials[0].id;
    localStorage.setItem('wankoOfficialActiveId',officialActiveId);
  }
  const grid=document.createElement('div');grid.className='grid';
  if(activeTab==='allies'){
   if(activeSubTab==='custom'){
    for(const w of list){
     const isActive=!officialActiveId&&active?.id===w.id;
     grid.appendChild(makeCard({name:w.name,image:WankoLibrary.blobUrl(w),subtitle:new Date(w.createdAt).toLocaleDateString('ja-JP'),badge:isActive?'使用中':'自作',active:isActive,requestPending:Boolean(w.registrationRequestId),requestSubmitted:Boolean(w.characterRequestId),onRequest:()=>openRequestModal(w),onUse:async()=>{localStorage.removeItem('wankoOfficialActiveId');await WankoLibrary.setActiveWanko(w.id);render();},onDelete:async()=>{if(!window.confirm('このわんこを削除する？\\n削除すると、この端末の図鑑から見えなくなります。'))return;await WankoLibrary.archiveWanko(w.id);render();}}));
    }
    if(!list.length)content.setAttribute('aria-label','まだ自作わんこはいません');
   }else{
    const owned=WankoLibraryView.buildOwnedCards({officials,gameCards:WankoLibraryView.buildAllyCards(WankoGameData.characters,progress)});
    for(const card of owned){
     const isActive=card.source==='official'&&officialActiveId===card.id;
     const subtitle=card.source==='official'?'みんなで使えるキャラ':(card.unlockAfterStage?'ステージ '+card.unlockAfterStage+' クリアで解放':'最初から使える');
     const badge=card.source==='official'?'正式わんこ':(card.characterStatus==='placeholder'?'仮キャラ':'正式キャラ');
     grid.appendChild(makeCard({name:card.name,image:card.image||card.artwork,placeholder:card.placeholder,subtitle,badge,active:isActive,disabled:!card.unlocked,onUse:card.source==='official'?()=>{localStorage.setItem('wankoOfficialActiveId',card.id);render();}:null}));
    }
   }
  }else if(activeTab==='enemies'){
   for(const card of WankoLibraryView.buildEnemyCards(WankoGameData.characters,progress)){
    const badge=card.discovered?(card.characterStatus==='placeholder'?'発見済み · 仮キャラ':'発見済み · 正式キャラ'):'未発見';
    grid.appendChild(makeCard({name:card.name,image:card.artwork,placeholder:card.placeholder,subtitle:card.id+(card.kind==='boss'?' · ボス':''),badge,undiscovered:!card.discovered}));
   }
  }else{
   for(const card of WankoLibraryView.buildElementCards(WankoGameData.stages,WankoGameData.elements,progress)){
    const subtitle=card.discovered?'原子番号 '+card.atomicNumber+' · '+card.stageId:card.stageId;
    const badge=card.cleared?'クリア！':(card.discovered?'発見済み':'未発見');
    grid.appendChild(makeCard({name:card.name,placeholder:card.symbol||'?',subtitle,badge,elementCard:true,undiscovered:!card.discovered}));
   }
  }
  content.replaceChildren(grid);
 }
 window.addEventListener('wanko-library-changed',render);window.addEventListener('wanko-active-changed',render);
 selectTab(activeTab);await setupProfileProgress();await WankoLibrary.syncNow().catch(()=>{});render();
 window.addEventListener('wanko-cloud-auth-changed',async()=>{await WankoLibrary.syncNow().catch(()=>{});render();});
})();
</script>
</body></html>
