<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>わんこ図鑑</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f6efe3;color:#27231f}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(255,250,240,.9);backdrop-filter:blur(16px);border-bottom:1px solid #ddd0bd}
a{color:inherit;text-decoration:none}.back{width:42px;height:42px;display:grid;place-items:center;border:2px solid #332f29;border-radius:13px;background:white;font-size:26px;font-weight:800}
h1{margin:0;font-size:23px}.status{margin-left:auto;font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px;background:white;border:1px solid #dccdb6}
main{width:min(100%,900px);margin:auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 28px)}
.empty{text-align:center;padding:70px 20px;color:#766c62}.empty b{display:block;font-size:48px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;border:2px solid #332f29;border-radius:20px;background:#fffaf2;overflow:hidden;box-shadow:0 5px 0 #332f29}
.card.active{outline:4px solid #f2c84b;outline-offset:2px}.thumb{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(#cce9ef 0 65%,#c6d891 65%);padding:12px}.thumb img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 1px rgba(0,0,0,.18))}
.info{padding:10px}.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{font-size:10px;color:#7b7066;margin-top:3px}.use{width:100%;margin-top:8px;border:0;border-radius:11px;background:#332f29;color:white;padding:9px;font-weight:900}.active .use{background:#f0c63d;color:#332f29}
.new{display:inline-flex;margin-bottom:14px;padding:10px 14px;border-radius:13px;background:#332f29;color:white;font-weight:900}
</style>
</head>
<body>
<header><a class="back" href="../">‹</a><h1>わんこ図鑑</h1><span class="status" id="status">📱 保存中</span></header>
<main><a class="new" href="../paint/?wanko=1">＋ 新しいわんこを描く</a><div id="content"></div></main>
<script src="../shared/wanko-cloud-config.js"></script>
<script src="../shared/wanko-library.js"></script>
<script>
(async()=>{
 const content=document.getElementById('content'), status=document.getElementById('status');
 async function render(){
  const [list,active,state]=await Promise.all([WankoLibrary.listWankos(),WankoLibrary.getActiveWanko(),WankoLibrary.syncState()]);
  status.textContent=state.configured?(state.pending?'☁️ 同期待ち '+state.pending:'☁️ 保存済み'):'📱 この端末に保存';
  if(!list.length){content.innerHTML='<div class="empty"><b>🐶</b>まだわんこがいないよ<br>ペイントで描いてみよう</div>';return;}
  const grid=document.createElement('div');grid.className='grid';
  for(const w of list){
   const card=document.createElement('article');card.className='card'+(active?.id===w.id?' active':'');
   const url=WankoLibrary.blobUrl(w);
   card.innerHTML='<div class="thumb"><img alt=""></div><div class="info"><div class="name"></div><div class="date"></div><button class="use">'+(active?.id===w.id?'バトルで使用中':'このわんこを使う')+'</button></div>';
   card.querySelector('img').src=url;card.querySelector('.name').textContent=w.name;
   card.querySelector('.date').textContent=new Date(w.createdAt).toLocaleDateString('ja-JP');
   card.querySelector('.use').onclick=async()=>{await WankoLibrary.setActiveWanko(w.id);render();};
   grid.appendChild(card);
  }
  content.replaceChildren(grid);
 }
 window.addEventListener('wanko-library-changed',render);window.addEventListener('wanko-active-changed',render);
 await WankoLibrary.syncNow().catch(()=>{});render();
})();
</script>
</body></html>
