<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe2">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Split Puzzle</title>
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="back-button" href="../" aria-label="For My Sonsにもどる">‹</a>
      <div class="title-wrap">
        <p class="eyebrow">FOR MY SONS</p>
        <h1>Split Puzzle</h1>
      </div>
      <button class="new-button" id="new-puzzle" type="button" aria-label="あたらしいパズル">↻</button>
    </header>

    <main>
      <section class="status-panel" aria-label="パズルの設定">
        <div class="difficulty" role="group" aria-label="むずかしさ 5だんかい">
          <button type="button" data-level="1" aria-label="レベル1 4マス">
            <strong>1</strong><small>4</small>
          </button>
          <button type="button" data-level="2" aria-label="レベル2 9マス まんなか固定">
            <strong>2</strong><small>9🔒</small>
          </button>
          <button type="button" data-level="3" class="is-active" aria-label="レベル3 9マス 固定なし">
            <strong>3</strong><small>9</small>
          </button>
          <button type="button" data-level="4" aria-label="レベル4 16マス まんなか4マス固定">
            <strong>4</strong><small>16🔒</small>
          </button>
          <button type="button" data-level="5" aria-label="レベル5 16マス 固定なし">
            <strong>5</strong><small>16</small>
          </button>
        </div>
        <div class="status-meta">
          <span class="level-description" id="level-description">Lv3・9マス・固定なし</span>
          <div class="moves" aria-live="polite"><span id="move-count">0</span> かい</div>
        </div>
      </section>

      <section class="time-attack-panel" aria-label="タイムアタック">
        <button class="time-attack-toggle" id="time-attack-toggle" type="button" aria-pressed="false">
          <span aria-hidden="true">⏱</span>
          <span>タイムアタック</span>
        </button>
        <div class="time-readout" id="time-readout" hidden>
          <strong id="timer">00:00.0</strong>
          <span>ベスト <b id="best-time">--:--.-</b></span>
        </div>
      </section>

      <section class="art-bar" aria-label="パズルの絵">
        <button class="import-button" id="import-button" type="button">
          <span class="import-icon" aria-hidden="true">＋</span>
          <span>
            <strong>インポート</strong>
            <small>ペイント / 写真</small>
          </span>
        </button>
        <div class="current-art" id="current-art" hidden>
          <img id="current-art-image" alt="">
          <span>この絵をつかう</span>
          <button id="clear-import" type="button" aria-label="インポートした絵をやめる">✕</button>
        </div>
      </section>

      <section class="puzzle-area">
        <div class="countdown" id="countdown" aria-live="assertive" hidden>
          <span id="countdown-text">3</span>
        </div>
        <div id="board" class="board" role="grid" aria-label="絵あわせパズル"></div>
      </section>

      <p class="hint">ピースをドラッグするか、2つをじゅんばんにタップしていれかえよう。</p>
    </main>
  </div>

  <div class="modal" id="import-modal" aria-hidden="true">
    <section class="modal-card import-card" role="dialog" aria-modal="true" aria-labelledby="import-title">
      <div class="modal-head">
        <div>
          <p class="modal-kicker">IMPORT</p>
          <h2 id="import-title">絵をえらぶ</h2>
        </div>
        <button class="modal-close" id="import-close" type="button" aria-label="とじる">✕</button>
      </div>

      <button class="device-import" id="device-import" type="button">
        <span aria-hidden="true">🖼️</span>
        <span><strong>この端末から</strong><small>写真や画像をえらぶ</small></span>
      </button>
      <input id="image-input" type="file" accept="image/*" hidden>

      <div class="library-head">
        <span>ペイントから</span>
        <a href="../paint/?v=2">ペイントをひらく</a>
      </div>
      <div class="art-library" id="art-library"></div>
      <p class="library-empty" id="library-empty" hidden>まだパズル用の絵がないよ。ペイントで描いて「パズルに保存」してみよう。</p>

      <button class="emoji-only" id="emoji-only" type="button">絵文字だけにもどす</button>
    </section>
  </div>

  <div class="modal" id="crop-modal" aria-hidden="true">
    <section class="modal-card crop-card" role="dialog" aria-modal="true" aria-labelledby="crop-title">
      <div class="modal-head">
        <div>
          <p class="modal-kicker">CROP</p>
          <h2 id="crop-title">正方形にしよう</h2>
        </div>
        <button class="modal-close" id="crop-close" type="button" aria-label="とじる">✕</button>
      </div>
      <p class="crop-help">指でうごかして、2本指で大きさをかえられるよ。</p>
      <div class="crop-preview-wrap">
        <canvas id="crop-preview" width="720" height="720" aria-label="正方形の切り抜きプレビュー"></canvas>
        <div class="crop-guide" aria-hidden="true"></div>
      </div>
      <div class="zoom-row">
        <span aria-hidden="true">−</span>
        <input id="crop-zoom" type="range" min="1" max="6" step="0.01" value="1" aria-label="拡大">
        <span aria-hidden="true">＋</span>
      </div>
      <div class="crop-actions">
        <button class="secondary-action" id="crop-reset" type="button">まんなか</button>
        <button class="primary-action" id="crop-confirm" type="button">これで決定</button>
      </div>
    </section>
  </div>

  <div class="celebration" id="celebration" aria-hidden="true">
    <div class="celebration-card" role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <div class="clear-emoji" aria-hidden="true">🎉</div>
      <h2 id="clear-title">できた！</h2>
      <p><span id="clear-moves">0</span> かいで かんせい</p>
      <p class="clear-time-row" id="clear-time-row" hidden>タイム <strong id="clear-time">00:00.0</strong></p>
      <p class="clear-best" id="clear-best" hidden>🏆 ベストタイム！</p>
      <button id="play-again" type="button">もういちど</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=6" defer></script>
</body>
</html>
